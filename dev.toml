# The tasks for working on emdash-run itself. mise.toml includes this file; no other repo does.
# Each task's description is its documentation: docs/reference/dev-tasks.md is written from them.

["dev:packages"]
hide = true
description = "Install what this repo's own code needs: Playwright for the scripts, TypeScript for the type check"
run = ["pnpm --dir scripts install --silent --frozen-lockfile", "pnpm --dir tests install --silent --frozen-lockfile"]

["dev:types"]
description = "Type-check tests/ and scripts/ (tsconfig.json)"
depends = ["dev:packages"]
run = "pnpm --dir tests exec tsc -p ../tsconfig.json"

["dev:api-types"]
description = "Write scripts/core/emdash-api.d.ts, the types of every request EmDash's HTTP API has, from scripts/core/emdash-openapi.json (with openapi-typescript). The requests the tasks make themselves are checked against it by dev:types: a path, a method or a body that EmDash does not have is a type error. The JSON file is a copy of EmDash's own list, GET /_emdash/api/openapi.json of a built site this machine is signed in to, and its first key says which EmDash it is from. To move to a newer EmDash: save that site's list over the file, keep the first key, run this, then dev:types — which says which of the tasks' requests no longer fit"
depends = ["dev:packages"]
run = "pnpm --dir tests exec openapi-typescript ../scripts/core/emdash-openapi.json -o ../scripts/core/emdash-api.d.ts --default-non-nullable false"

["dev:test"]
description = "The test of every task, at one of three levels, the same here and on GitHub (dev:ci). smoke: the basics, in half a minute — a project is made, its tasks run, the site starts and answers. fast, the default: the everyday steps. all: every step, the long ones too. smoke and fast use one test site that is kept, and kept running, from one run to the next; all starts from nothing. It is the unit tests and the site, signin and plugin groups, each a task of its own that mise runs side by side — so it takes as long as the slowest of them. (The live group deploys: dev:test:live, by name)"
usage = '''
flag "--level <level>" help="smoke, fast or all" default="fast" {
  choices "smoke" "fast" "all"
}
flag "--node" help="On a Node site made from EmDash's template"
'''
depends = ["dev:test:unit", "dev:test:site --level {{ usage.level }}{% if usage.node %} --node{% endif %}", "dev:test:signin --level {{ usage.level }}{% if usage.node %} --node{% endif %}", "dev:test:plugin --level {{ usage.level }}{% if usage.node %} --node{% endif %}"]
run = "node -e \"console.log('dev:test: every group passed')\""

["dev:test:unit"]
description = "The unit tests, in a second: the graph of states and each state with a made-up outside, the edits to a site's config, and that every task has a test step"
depends = ["dev:types"]
run = "node tests/run.mjs --unit"

["dev:test:site"]
description = "The site group: making, running, checking and deleting a site, on a copy of site/"
depends = ["dev:types"]
usage = '''
flag "--level <level>" help="smoke, fast or all" default="fast" {
  choices "smoke" "fast" "all"
}
flag "--node" help="On a Node site made from EmDash's template"
flag "--only <words>" help="Only the steps whose name has these words"
'''
run = "node tests/run.mjs site --level {{ usage.level }}{% if usage.node %} --node{% endif %}{% if usage.only %} --only {{ usage.only }}{% endif %}"

["dev:test:signin"]
description = "The signin group: the CLI and a browser window as an administrator of the built site"
depends = ["dev:types"]
usage = '''
flag "--level <level>" help="smoke, fast or all" default="fast" {
  choices "smoke" "fast" "all"
}
flag "--node" help="On a Node site made from EmDash's template"
flag "--only <words>" help="Only the steps whose name has these words"
'''
run = "node tests/run.mjs signin --level {{ usage.level }}{% if usage.node %} --node{% endif %}{% if usage.only %} --only {{ usage.only }}{% endif %}"

["dev:test:plugin"]
description = "The plugin group: a plugin of your own, and plugins from EmDash's registry"
depends = ["dev:types"]
usage = '''
flag "--level <level>" help="smoke, fast or all" default="fast" {
  choices "smoke" "fast" "all"
}
flag "--node" help="On a Node site made from EmDash's template"
flag "--only <words>" help="Only the steps whose name has these words"
'''
run = "node tests/run.mjs plugin --level {{ usage.level }}{% if usage.node %} --node{% endif %}{% if usage.only %} --only {{ usage.only }}{% endif %}"

["dev:test:live"]
description = "REMOTE: the live group — the tasks that act on a deployed site, on the Worker kept for testing (TEST_LIVE_URL and TEST_LIVE_NAME in mise.local.toml). It deploys, and takes about five minutes"
depends = ["dev:types"]
usage = '''
flag "--level <level>" help="smoke, fast or all" default="fast" {
  choices "smoke" "fast" "all"
}
flag "--node" help="On a Node site made from EmDash's template"
flag "--only <words>" help="Only the steps whose name has these words"
'''
run = "node tests/run.mjs live --level {{ usage.level }}{% if usage.node %} --node{% endif %}{% if usage.only %} --only {{ usage.only }}{% endif %}"

["dev:ci"]
description = "REMOTE: have GitHub run dev:test at a level on Linux, macOS and Windows (the stages workflow), on the branch you are on, as it is pushed. By itself GitHub runs smoke on a push to main and all on a release tag"
usage = '''
flag "--level <level>" help="smoke, fast or all" default="smoke" {
  choices "smoke" "fast" "all"
}
'''
run = ["gh workflow run stages.yml --ref {{ exec(command='git branch --show-current') }} -f level={{ usage.level }}", "echo Started. Follow it: gh run watch, or gh run list --workflow stages --limit 1"]

[check]
description = "What must pass before a release, and what release runs before it tags: the test (dev:test) and repo:ci (the docs and the repo are as charter keeps them)"
run = [{ task = "dev:test" }, { task = "repo:ci" }]

["dev:src"]
description = "EmDash's source into .src/emdash (git ignores it), to read when a task meets something EmDash does that its docs do not say. Run again: the newest"
run = "git -C .src/emdash pull --ff-only --quiet || git clone --depth 1 --quiet https://github.com/emdash-cms/emdash .src/emdash"

["dev:commit"]
description = "What the commit check runs, in seconds: the types (dev:types), the unit tests (every task has a test step among them), and the docs are fresh and pass the lint (docs:check)"
depends = ["dev:types"]
run = ["node tests/run.mjs --unit", { task = "docs:check" }]

["dev:hooks"]
description = "Turn on the commit check in this clone: every commit runs dev:commit"
run = "git config core.hooksPath .githooks"
