# The harness: tools, tasks and daemons. Owned by emdash-run and replaced by `mise run upgrade` —
# do not edit it in a project. Project settings live in mise.toml; the logic lives in nu/.

[settings]
experimental = true # `mise daemons`

[tools]
node = "26.10.0"
pnpm = "12.9.1"
pitchfork = "2.29.0" # runs the daemons, through `mise daemons`
nushell = "0.116.1"  # the language of nu/ — the same on every platform
fnox = "1.36.0"      # secrets: Cloudflare credentials for deploy and the R2 check

[task_config]
shell = "nu --no-config-file -c"

[env]
HARNESS_VERSION = "0.6.1"
HARNESS_REPO = "https://github.com/joeblew999/emdash-run"
# npm command-line tools the harness runs through `pnpm dlx`, pinned here. The two oxlint packages
# are version-coupled: move them together.
OXLINT_VERSION = "1.86.0"
TSGOLINT_VERSION = "7.0.2003"
OXFMT_VERSION = "0.71.0"
# Defaults for every optional project setting. mise.toml wins over this file, so a project's values
# replace these — and a setting the project leaves out is EMPTY here rather than inherited from
# whatever shell ran the task (another project's seed and checks, in the case that found this).
DEPLOY_URL = ""
VERIFY_COLLECTION = ""
EMDASH_URL = ""
ROOT = "{{config_root}}"
SRC_DIR = "{{config_root}}/.src"                                  # gitignored checkouts
TEMPLATES_DIR = "{{config_root}}/.src/templates"
SITE_DIR = "{{config_root}}/site"                                 # the project's own site — created once from $TEMPLATE
EMDASH_DIR = "{{config_root}}/.src/emdash"                        # the EmDash source, on demand
PLUGINS_DIR = "{{config_root}}/plugins"
RUN_DIR = "{{config_root}}/run"                                   # gitignored output: token, snapshots
TEMPLATES_REPO = "https://github.com/emdash-cms/templates"
SITE_EXAMPLE_REPO = "https://github.com/emdash-cms/emdashcms.com"
EMDASH_REPO = "https://github.com/emdash-cms/emdash"
# The dev server's port. Give a second checkout its own (SITE_PORT in its mise.local.toml) and two
# sites run side by side — which is what lets several people, or agents, work at once.
SITE_PORT = "4321"
SITE_DAEMON = "site"
# The site's own emdash CLI on PATH, so the CLI and the site cannot drift apart.
_.path = ["{{config_root}}/site/node_modules/.bin"]
# The admin token `dev` mints, as EMDASH_MCP_TOKEN — .mcp.json reads it.
_.file = "{{config_root}}/run/token-admin.env"
# Unset on purpose — and `false` removes them even when the shell that ran the task exported them.
# Both are read by the CLIs, and a stale value silently redirects them: a dead token, or a registry
# nothing is running. A deployment's token goes in DEPLOY_TOKEN instead: the `--url` flows hand it
# to the CLI, and nothing else does. It has no default here, because a default would replace the
# value a CI job or mise.local.toml supplies.
EMDASH_TOKEN = false
EMDASH_REGISTRY_URL = false

# Every task is one command in nu/main.nu, named after the task (`plugin:new` runs `plugin new`).
# nu/task.nu hands it the task's arguments — through `usage`, because mise does not append them on
# Windows. `check` fails on a task that does not extend this template.
[task_templates.harness]
usage = 'arg "[args]" var=#true'
run = "nu --no-config-file {{config_root}}/nu/task.nu"

[tasks.setup]
extends = "harness"
hide = true
description = "First time here: create site/ from the template (once), install, then bring the site up"

[tasks.dev]
extends = "harness"
description = "Start working. Brings the site up — the first time it also creates and installs it. Run it again after you change settings or a plugin; page edits reload by themselves"

[tasks.status]
extends = "harness"
description = "What is running, and on which versions"

[tasks.report]
extends = "harness"
hide = true
description = "Something broke? Prints your versions, status and recent site log, ready to paste into an issue"

[tasks.check]
extends = "harness"
alias = "pre-commit"                                                                                              # what the git hook runs
description = "Before a commit: is the project sound? --fix repairs formatting; --site also type-checks the site"

[tasks.doctor]
extends = "harness"
description = "Is the running site healthy, and what the repo says it is? --url <deployment> asks a live one"

[tasks.deploy]
extends = "harness"
description = "Go live: check, build, ship to Cloudflare, then verify what is live. --dry builds without shipping"

[tasks.rollback]
extends = "harness"
description = "Undo the last deploy"

[tasks.snapshot]
extends = "harness"
description = "Save the site's content as a package. --database backs up everything, users included. --url takes it from a live site"

[tasks.restore]
extends = "harness"
description = "Put a snapshot or a backup back. Shows the plan; --confirm does it; --wipe empties the local site first"

[tasks.reset]
extends = "harness"
description = "Start the local site again from its seed. Wipes the local database; your site/ is untouched"

[tasks.logs]
extends = "harness"
description = "Follow the site's log. --deployed follows the live site"

[tasks.open]
extends = "harness"
description = "Open the admin in your browser, signed in"

[tasks."plugin:new"]
extends = "harness"
description = "Make a new plugin and load it into the running site — e.g: mise run plugin:new -- my-plugin"

[tasks."plugin:probe"]
extends = "harness"
hide = true
description = "Ask the running site to call a plugin's route — proof it is loaded, not just built"

[tasks."plugin:remove"]
extends = "harness"
description = "Remove a plugin and bring the site back up without it"

[tasks."plugin:roundtrip"]
extends = "harness"
hide = true
description = "Prove the plugin toolchain end to end with a throwaway plugin: scaffold, load, call, remove"

[tasks."plugin:release"]
extends = "harness"
description = "Get your plugins ready to publish: validate, test, build, bundle"

[tasks."seed:export"]
extends = "harness"
hide = true
description = "Export the running site's model and content as a seed, to review against the project's"

[tasks.upgrade]
extends = "harness"
description = "Take a newer version of these tasks. -- main takes the development branch"

[tasks.verify]
extends = "harness"
description = "Prove everything works on this machine: site up, check, doctor. --full adds plugins, a snapshot and a build"

[tasks."verify:template"]
extends = "harness"
hide = true
description = "Does the harness work on another template? Builds a throwaway project on it and runs verify — e.g: mise run verify:template -- starter. --from 1.0.1 proves an EmDash upgrade keeps the data and a plugin"

[tasks.upgrade-probe]
extends = "harness"
hide = true

[tasks."verify:linux"]
extends = "harness"
hide = true
description = "The same verification in a clean Linux container with only git and mise. Needs docker"

[tasks.source]
extends = "harness"
hide = true
description = "Clone or update a reference checkout under .src/ for reading: emdash (the default — EmDash's source at the version the site runs), templates, or emdashcms.com (EmDash's own production site)"

[tasks.emdash]
extends = "harness"
description = "Anything else in EmDash, through its official CLI — e.g: mise run emdash -- content list posts"

[tasks.emdash-plugin]
extends = "harness"
description = "The plugin registry, through the official plugin CLI — e.g: mise run emdash-plugin -- search translate"

[tasks.args]
extends = "harness"
hide = true

[tasks."daemon:site"]
extends = "harness"
hide = true

# Values here reach pitchfork verbatim — mise does not expand templates in [daemons].
[daemons.site]
run = "mise run daemon:site"
dir = "."
auto = ["start", "stop"]
