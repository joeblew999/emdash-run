# $schema = "https://pitchfork.jdx.dev/schema.json"

# Host site — an official EmDash template copied into .src/site (see ADR-0007).
# Plugin discovery uses the hosted registry (registry.emdashcms.com).
[daemons.emdash]
run           = "mise run server:start"
dir           = "."
auto          = ["start", "stop"]
retry         = 3

[daemons.emdash.hooks]
on_ready = "echo '✓ site ready → http://localhost:4321/_emdash/api/setup/dev-bypass?redirect=/_emdash/admin'"
on_fail  = "echo '✗ site failed — run: mise run server:logs'"
