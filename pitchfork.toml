# $schema = "https://pitchfork.jdx.dev/schema.json"

# Host site — an official EmDash template copied into .src/site (see ADR-0007).
# Plugin discovery uses the hosted registry (registry.emdashcms.com).
[daemons.emdash]
run        = "mise run site:dev"
dir        = "."
auto       = ["start", "stop"]
retry      = 3
# Readiness: Astro binds IPv6-only ([::1]:4321), so an HTTP check on localhost works
# where a 127.0.0.1 port probe would not. Declared here so `pitchfork start` waits
# for the site to actually serve before returning.
ready_http = "http://localhost:4321/"

# NOTE: lifecycle hooks (on_ready/on_fail/on_stop) only run under pitchfork's
# supervisor / shell-hook flow, not `pitchfork start` — so the URLs are printed by
# `mise run apply` instead of here.

# Local plugin registry (the "marketplace"): the emdash monorepo's aggregator on :8788.
# Optional — not started by `apply`. Start it with `mise run registry:up`.
[daemons.registry]
run        = "mise run registry:start"
dir        = "."
auto       = ["stop"]
retry      = 3
ready_http = "http://localhost:8788/xrpc/com.emdashcms.experimental.aggregator.searchPackages?limit=1"

# The registry's web UI (plugins.emdashcms.com). Optional. `mise run plugins-site:up`.
[daemons.plugins-site]
run        = "mise run plugins-site:start"
dir        = "."
auto       = ["stop"]
retry      = 3
ready_http = "http://localhost:4330/"
