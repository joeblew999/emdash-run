# The fast answer on every push: the harness holds together on every OS — modules, tasks, task
# arguments, the self-test, unit tests. Seconds, not minutes. It is `mise run check`, the same
# command the git hook runs locally.
#
# The site verifications (every OS, Cloudflare and Node.js, installers) are NOT run on a push:
# run them locally with `mise run verify -- --full`, and they run in full before every release —
# see full.yml.
name: verify
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run check
