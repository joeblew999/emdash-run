# The same thing a dev runs locally — `mise run verify` — on every OS we claim to support.
# Nothing is CI-only: mise installs the toolchain here exactly as it does on a laptop.
name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run verify
      # The same check on a plain Node.js template — EmDash without Cloudflare.
      - run: mise run verify:template -- starter
