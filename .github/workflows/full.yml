# The full verification. Runs when a version is tagged, and a release is published ONLY if every
# job here passes: every OS, Cloudflare and Node.js, the whole dev loop, and the installers a new
# dev actually runs. Everything is `mise run …` — the same commands as on a laptop.
name: full verification
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
jobs:
  # Site up, checks, doctor, a plugin scaffolded and called by the running site, a snapshot, and a
  # production build — on each OS, on a Cloudflare template and on a plain Node.js one.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        platform:
          - { name: Cloudflare, run: "verify --full" }
          - { name: Node.js, run: "verify:template starter --full" }
    name: ${{ matrix.platform.name }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run ${{ matrix.platform.run }}

  # Exactly what a release ships.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git archive --format=tar.gz -o emdash-harness.tar.gz HEAD nu .config/mise/conf.d/harness.toml .githooks .oxlintrc.json .oxfmtrc.json
      - uses: actions/upload-artifact@v7
        with:
          name: harness
          path: emdash-harness.tar.gz

  # What a new dev does: the one-line installer, in an empty folder, with that package.
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        template: [starter-cloudflare, starter]
    name: install ${{ matrix.template }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
      - uses: actions/download-artifact@v8
        with:
          name: harness
          path: ${{ runner.temp }}
      - name: install.sh
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir new-project && cd new-project
          EMDASH_HARNESS_TARBALL="$RUNNER_TEMP/emdash-harness.tar.gz" sh "$GITHUB_WORKSPACE/install.sh" ${{ matrix.template }}
          mise run status
          mise run doctor
      - name: install.ps1
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir new-project | Out-Null; cd new-project
          $env:EMDASH_HARNESS_TARBALL = "$env:RUNNER_TEMP\emdash-harness.tar.gz"
          $env:EMDASH_TEMPLATE = "${{ matrix.template }}"
          & "$env:GITHUB_WORKSPACE\install.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise run status
          mise run doctor

  # Only a tag that passed everything above becomes a release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: harness
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" 'index($0, v) == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" emdash-harness.tar.gz --title "emdash-run $version" --notes-file notes.md
