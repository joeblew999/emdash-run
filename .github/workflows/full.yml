# The full cross-platform verification: every OS, Cloudflare and Node.js, the whole dev loop, and
# the installers. It is slow (about 15 jobs), so it is NOT part of a push or a release. Run it by
# hand when the cross-platform layer itself changes — nu/task.nu, nu/lib.nu, the installers, the
# workflows — or before a release that touches them:   gh workflow run "full verification"
name: full verification
on:
  workflow_dispatch:
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
jobs:
  # Site up, checks, doctor, a plugin scaffolded and called by the running site, a snapshot, and a
  # production build — on each OS, on a Cloudflare template and on a plain Node.js one.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        platform:
          - { name: Cloudflare, run: "verify --full --restore" }
          - { name: Node.js, run: "verify:template starter --full" }
          # An EmDash upgrade from the previous release: data and a plugin survive it.
          - { name: Upgrade, run: "verify:template starter-cloudflare --from 1.0.1" }
    name: ${{ matrix.platform.name }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run ${{ matrix.platform.run }}

  # Exactly what a release ships.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git archive --format=tar.gz -o emdash-harness.tar.gz HEAD nu .config/mise/conf.d/harness.toml .githooks .oxlintrc.json .oxfmtrc.json
      - uses: actions/upload-artifact@v7
        with:
          name: harness
          path: emdash-harness.tar.gz

  # What a new dev does: the one-line installer, in an empty folder, with that package.
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        template: [starter-cloudflare, starter]
    name: install ${{ matrix.template }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
      - uses: actions/download-artifact@v8
        with:
          name: harness
          path: ${{ runner.temp }}
      - name: install.sh
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir new-project && cd new-project
          EMDASH_HARNESS_TARBALL="$RUNNER_TEMP/emdash-harness.tar.gz" sh "$GITHUB_WORKSPACE/install.sh" ${{ matrix.template }}
          mise run status
          mise run doctor
      - name: install.ps1
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir new-project | Out-Null; cd new-project
          $env:EMDASH_HARNESS_TARBALL = "$env:RUNNER_TEMP\emdash-harness.tar.gz"
          $env:EMDASH_TEMPLATE = "${{ matrix.template }}"
          & "$env:GITHUB_WORKSPACE\install.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise run status
          mise run doctor
