name: diag
on:
  push:
    paths: [".github/diag/**", ".github/workflows/diag.yml"]
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          working_directory: .github/diag
      - working-directory: .github/diag
        continue-on-error: true
        run: |
          mise trust
          echo "=== t1 plain append"; mise run t1 alpha beta
          echo "=== t2 usage"; mise run t2 alpha "two words" '{"k":1}'
          echo "=== t2 with --"; mise run t2 -- --dry x
          echo "=== t2 quote"; mise run t2 "it's" 'say "hi"'
          echo "=== t2 none"; mise run t2
