# Every step of the test, on macOS, Linux and Windows: mise run test:all — one task, the same one a
# developer can run. A developer's own run (mise run test) is the everyday steps, in a minute or
# two; the long ones are run here. The live group is not: a runner has no deployed test site.
#
# Started by a push to main that changes what the test depends on, by a release tag, or by hand.
name: stages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tasks.toml", "scripts/**", "tests/**", "site/**", "mise.toml", ".github/workflows/stages.yml", "!tests/*/results.json"]
    tags: ["v*"]
concurrency:
  group: stages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # the test needs node and pnpm only; do not let a task pull in the other tools on a runner
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # GitHub limits anonymous downloads per address, and hosted runners share addresses: without a
      # token, fetching EmDash's template (and mise fetching a tool) is refused now and then.
      GITHUB_TOKEN: ${{ github.token }}
      GIGET_AUTH: ${{ github.token }}
      # a step that has not ended in five minutes is stopped and fails (15 by default): the longest
      # real one, a first install on Windows, takes under two
      STEP_LIMIT: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          # the mise that wrote the pages in docs/ — the test fails when they are stale, and a
          # different mise could word them differently. Move this with min_version in mise.toml
          version: 2026.10.4
          install_args: node pnpm
      - name: mise run test:all
        run: mise run test:all
      # What this run recorded (tests/<group>/results.json), as the page docs/reference/status.md is written
      # from it. Not the committed page: a runner has no charter to rewrite it, so that one would
      # show the developer's last run, not this one.
      - name: what worked
        if: always()
        run: node tests/record.mjs --page status >> "$GITHUB_STEP_SUMMARY"
