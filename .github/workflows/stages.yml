# The test on macOS, Linux and Windows, at the level asked for. Nothing is decided here: each job
# installs mise and runs `mise run dev:test --level <level>`, the task a developer runs, so a pass on
# your machine is a pass on GitHub. The three levels are written in tests/run.mjs.
#
#   a push to main    smoke — the basics, a few minutes
#   by hand           the level you choose:  gh workflow run stages.yml -f level=all
#   a release tag     all
name: stages
on:
  workflow_dispatch:
    inputs:
      level:
        description: "smoke: the basics. fast: the everyday steps. all: every step"
        type: choice
        options: [smoke, fast, all]
        default: smoke
  push:
    branches: [main]
    paths: ["tasks.toml", "scripts/**", "tests/**", "site/**", "mise.toml", "tsconfig.json", ".github/workflows/stages.yml", "!tests/*/results.json"]
    tags: ["v*"]
concurrency:
  group: stages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
        with:
          version: 2026.10.4 # the repo's mise.toml: min_version
      - run: mise run dev:test --level ${{ inputs.level || (github.ref_type == 'tag' && 'all' || 'smoke') }}
        env:
          # the one thing a runner has to be given: who it is. GitHub limits anonymous downloads per
          # address, and hosted runners share addresses (EmDash's template is fetched from GitHub)
          GITHUB_TOKEN: ${{ github.token }}
