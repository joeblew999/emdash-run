# The same test a developer runs, on macOS, Linux and Windows: mise run test. On a runner no group
# is skipped as proven, and the live group is not run (no deployed test site there).
#
# Started by hand, or by a release tag. Never by a push: the test runs locally after every change,
# and docs/reference/status.md is its record.
name: stages
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
concurrency:
  group: stages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # the test needs node and pnpm only; do not let a task pull in the other tools on a runner
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # GitHub limits anonymous downloads per address, and hosted runners share addresses: without a
      # token, fetching EmDash's template (and mise fetching a tool) is refused now and then.
      GITHUB_TOKEN: ${{ github.token }}
      GIGET_AUTH: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          # the mise that wrote the pages in docs/ — the test fails when they are stale, and a
          # different mise could word them differently. Move this with min_version in mise.toml
          version: 2026.10.4
          install_args: node pnpm
      - name: mise run test
        run: mise run test
      # What this run recorded (tests/<group>/results.json), as the page docs/reference/status.md is written
      # from it. Not the committed page: a runner has no charter to rewrite it, so that one would
      # show the developer's last run, not this one.
      - name: what worked
        if: always()
        run: node tests/record.mjs --page status >> "$GITHUB_STEP_SUMMARY"
