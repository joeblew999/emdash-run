# The same test a developer runs — `mise run test:full` — on macOS, Linux and Windows.
#
# Started by hand, or by a release tag. Never by a push: the test is run locally after every change
# (docs/status.md is its record), and this is the cross-OS proof before a release.
name: stages
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
concurrency:
  group: stages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          # node and pnpm only: fnox is for the tasks that change Cloudflare, which are not run here
          install_args: node pnpm
      - run: mise run test:full
      - name: what worked
        if: always()
        run: cat docs/status.md >> "$GITHUB_STEP_SUMMARY"
