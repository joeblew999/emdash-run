# The same test a developer runs, on macOS, Linux and Windows — at one of the two levels.
#
# Started by hand, with the level chosen: quick (about 2 minutes a machine) or full. A release tag
# runs the full one. Never started by a push: the test runs locally after every change, and
# docs/status.md is its record.
name: stages
on:
  workflow_dispatch:
    inputs:
      level:
        description: "quick = the everyday tasks; full = every task that needs no deployed site"
        type: choice
        options: [quick, full]
        default: quick
  push:
    tags: ["v*"]
concurrency:
  group: stages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # the test needs node and pnpm only; do not let a task pull in the other tools on a runner
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # GitHub limits anonymous downloads per address, and hosted runners share addresses: without a
      # token, fetching EmDash's template (and mise fetching a tool) is refused now and then.
      GITHUB_TOKEN: ${{ github.token }}
      GIGET_AUTH: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
      - name: mise run test (quick)
        if: github.event_name == 'workflow_dispatch' && inputs.level == 'quick'
        run: mise run test
      - name: mise run test:full
        if: github.event_name != 'workflow_dispatch' || inputs.level == 'full'
        run: mise run test:full
      - name: what worked
        if: always()
        run: cat docs/status.md >> "$GITHUB_STEP_SUMMARY"
