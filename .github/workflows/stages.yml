# Runs one mise task, dev:test, at a level, on Linux, macOS and Windows. Nothing is decided here:
# what the task does is in dev.toml and tests/run.mjs. Started from a developer's machine by
# mise run dev:ci; by itself, smoke on a push to main and all on a release tag.
name: stages
on:
  workflow_dispatch:
    inputs:
      level:
        description: "smoke: the basics. fast: the everyday steps. all: every step"
        type: choice
        options: [smoke, fast, all]
        default: smoke
  push:
    branches: [main]
    paths: ["tasks.toml", "scripts/**", "tests/**", "site/**", "mise.toml", "dev.toml", "tsconfig.json", ".github/workflows/stages.yml", "!tests/*/results.json"]
    tags: ["v*"]
concurrency:
  group: stages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
        with:
          version: 2026.10.4 # the repo's mise.toml: min_version
      - run: mise run dev:test --level ${{ inputs.level || (github.ref_type == 'tag' && 'all' || 'smoke') }}
        env:
          # the one thing a runner has to be given: who it is. GitHub limits anonymous downloads per
          # address, and hosted runners share addresses (EmDash's template is fetched from GitHub)
          GITHUB_TOKEN: ${{ github.token }}
