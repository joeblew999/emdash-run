# The test on macOS, Linux and Windows. Nothing is decided here: each job installs mise and runs
# one mise task, the same one a developer runs, so a pass on your machine is a pass on GitHub.
#   mise run test       the everyday steps: an answer in minutes
#   mise run test:all   every step, the long ones too
# What they do, how long a step may take, what they print: tests/run.mjs, not this file.
#
# Started by a push to main that changes what the test depends on, by a release tag, or by hand.
name: stages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tasks.toml", "scripts/**", "tests/**", "site/**", "mise.toml", "tsconfig.json", ".github/workflows/stages.yml", "!tests/*/results.json"]
    tags: ["v*"]
concurrency:
  group: stages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        task: ["test", "test:all"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
        with:
          version: 2026.10.4 # the repo's mise.toml: min_version
      - run: mise run ${{ matrix.task }}
        env:
          # the one thing a runner has to be given: who it is. GitHub limits anonymous downloads per
          # address, and hosted runners share addresses (EmDash's template is fetched from GitHub)
          GITHUB_TOKEN: ${{ github.token }}
