# $schema = "https://mise.jdx.dev/schema/mise.json"
#
# emdash-run — local EmDash harness. See docs/adr/0007-emdash-1.1-templates-src-rework.md.
#
# Model: the host site is an official EmDash template (starter-cloudflare) copied
# into .src/site. It consumes the *published* `emdash` npm package — there is no
# emdash monorepo clone and no legacy marketplace.

[settings]
# Serial task execution — avoids pnpm lockfile conflicts during install
jobs = 1

[tools]
node           = "22.22.2"
pnpm           = "11.9.0"      # must match the site's packageManager (emdash@1.1.0 requires 11.9.0)
pitchfork      = "2.29.0"      # process manager for the site daemon
"npm:skills"   = "1.4.7"       # Claude Code skills manager

[env]
# Project root (where this mise.toml lives)
ROOT            = "{{config_root}}"

# Gitignored working checkouts (see ADR-0007)
SRC_DIR         = "{{config_root}}/.src"
TEMPLATES_DIR   = "{{config_root}}/.src/templates"   # clone of emdash-cms/templates
SITE_DIR        = "{{config_root}}/.src/site"        # copy of $TEMPLATE — the host site (:4321)

# Which official template to host. `blank` was retired upstream; starter-cloudflare
# is the minimal Cloudflare (D1 + R2) base — the closest live equivalent.
TEMPLATE        = "starter-cloudflare"

TEMPLATES_REPO  = "https://github.com/emdash-cms/templates"

# EmDash version — single source of truth. `site:install` pins the site's `emdash`
# and `@emdash-cms/cloudflare` to exactly this. To upgrade:
#   bump it → mise run server:clean → server:build → init → apply
EMDASH_VERSION  = "1.1.0"

# Local plugins under development — symlinked into the site's node_modules by plugins:link
PLUGINS_DIR     = "{{config_root}}/plugins"

# Runtime output dirs (both gitignored)
LOGS_DIR        = "{{config_root}}/logs"   # pitchfork daemon logs
RUN_DIR         = "{{config_root}}/run"    # generated tokens (token-admin.txt, token-admin.env, token-user.txt)

# Injects EMDASH_TOKEN from run/token-admin.env into the environment.
# (Re)generated by mcp:token-admin on every apply. The EmDash MCP server reads it.
_.file          = "{{config_root}}/run/token-admin.env"

# =============================================================================
# QUICK REFERENCE
# =============================================================================
#
# First time:
#   mise run server:build    ← clone templates → copy site → install → apply config
#   mise run init            ← plugin deps + skills (run once)
#   mise run apply           ← start daemons + generate token (idempotent)
#
# Every day / after every change:
#   mise run apply           ← config:apply + plugins:link + skills:sync + restart + token
#
# Recovery:
#   mise run server:reset    ← wipe local D1/miniflare state, then: mise run apply
#   mise run server:clean    ← wipe .src/site, then: server:build → init → apply
#   mise run server:regen    ← wipe .src entirely (templates + site), then: server:build → init → apply
#
# URLs (once running):
#   http://localhost:4321/_emdash/api/setup/dev-bypass?redirect=/_emdash/admin  ← Admin UI (ALWAYS use this, not /login)
#   http://localhost:4321/_emdash/api/mcp   ← MCP endpoint (enabled by default; Bearer token from run/token-admin.txt)
#
# Why dev-bypass and NOT the login page:
#   Passkeys are stored in the database. server:reset wipes it → old passkey credentials
#   are gone but still cached in the browser → "Authentication failed" on login.
#   dev-bypass skips passkey auth entirely (DEV mode only) and runs migrations + seed.
#
# Updating:
#   EmDash version    bump EMDASH_VERSION below, then: server:clean → server:build → init → apply
#   Template content  server:clean → server:build → init → apply  (apply alone does NOT re-copy .src/site)
#   Local plugin      mise run apply
#
# Deploy (Cloudflare):
#   mise run site:deploy:dry   ← build + validate the Worker bundle (no cloud changes)
#   mise run site:deploy       ← build + deploy (creds via fnox)
#   Live: https://emdash-run.gedw99.workers.dev
#
# Gotchas:
#   - A production build (site:build / site:deploy) dirties the dev server's Vite cache
#     → 500s on admin routes. The build tasks clean up and print a reminder; then: mise run apply
#   - Astro 7 auto-backgrounds under a non-TTY parent; server:start sets
#     ASTRO_DEV_BACKGROUND so pitchfork can supervise it.
#   - Astro binds IPv6-only — readiness is `ready_http` in pitchfork.toml, not a port probe.
#   - `apply` is idempotent and IS the check: if it exits cleanly, the system works.
#
# =============================================================================

# -----------------------------------------------------------------------------
# SRC (gitignored checkouts)
# -----------------------------------------------------------------------------

[tasks."src:clone:templates"]
description = "Clone/update emdash-cms/templates into .src/templates"
run = """
set -euo pipefail
mkdir -p "$SRC_DIR"
if [ -d "$TEMPLATES_DIR/.git" ]; then
  git -C "$TEMPLATES_DIR" fetch --depth 1 origin main
  git -C "$TEMPLATES_DIR" checkout -q FETCH_HEAD
else
  git clone --depth 1 "$TEMPLATES_REPO" "$TEMPLATES_DIR"
fi
echo "  ✓ templates @ $(git -C "$TEMPLATES_DIR" rev-parse --short HEAD)"
"""

# -----------------------------------------------------------------------------
# SITE (host site = official template copy, runs on :4321)
# -----------------------------------------------------------------------------

[tasks."site:sync"]
description = "Copy $TEMPLATE into .src/site (pristine copy; drops the template's packageManager pin)"
depends = ["src:clone:templates"]
run = """
set -euo pipefail
if [ ! -d "$TEMPLATES_DIR/$TEMPLATE" ]; then
  echo "✗ Template '$TEMPLATE' not found in $TEMPLATES_DIR"
  echo "  Available: $(ls "$TEMPLATES_DIR" | grep -v '^\\.' | tr '\\n' ' ')"
  exit 1
fi
rm -rf "$SITE_DIR"
mkdir -p "$SITE_DIR"
cp -R "$TEMPLATES_DIR/$TEMPLATE/." "$SITE_DIR/"
# The template pins pnpm@11.9.0 via packageManager; mise already provides that pnpm.
# Drop the pin so pnpm never tries to self-manage a second copy.
node -e "const fs=require('fs');const p=process.argv[1];const j=JSON.parse(fs.readFileSync(p));delete j.packageManager;fs.writeFileSync(p,JSON.stringify(j,null,'\\t')+'\\n')" "$SITE_DIR/package.json"
echo "  ✓ site ← $TEMPLATE"
"""

[tasks."site:install"]
description = "Install site deps + the first-party plugins the site config registers"
depends = ["site:sync"]
run = """
set -euo pipefail
cd "$SITE_DIR"
pnpm install
# Pin the CMS to EMDASH_VERSION. The template ships floating ranges (emdash: ^1.0.1)
# which would otherwise drift on every install.
# Write exact pins directly — `pnpm add --save-exact` still writes a caret range here.
node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p));j.dependencies.emdash=process.argv[1];j.dependencies['@emdash-cms/cloudflare']=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,'\\t')+'\\n')" "$EMDASH_VERSION"
# First-party plugins the site config registers. Declared here (not hand-edited into
# the template) so template updates stay clean.
pnpm add @emdash-cms/plugin-forms @emdash-cms/plugin-webhook-notifier
echo "  ✓ site deps installed (emdash@$EMDASH_VERSION)"
"""

[tasks."config:apply"]
description = "Write our config into .src/site (astro.config, wrangler.jsonc, merged seed)"
# NOTE: no depends on site:sync — site:sync is destructive (rm -rf + copy) and must
# only run from server:build / server:clean. apply must be non-destructive.
run = """
set -euo pipefail
if [ ! -f "$SITE_DIR/package.json" ]; then
  echo "✗ .src/site is missing — run: mise run server:build"
  exit 1
fi
cp "$ROOT/config/site.astro.config.mjs" "$SITE_DIR/astro.config.mjs"
cp "$ROOT/config/site.wrangler.jsonc"   "$SITE_DIR/wrangler.jsonc"
node "$ROOT/scripts/merge-seed.mjs"
echo "  ✓ config applied to .src/site"
"""

[tasks."server:build"]
description = "One-time: clone templates → copy site → install → apply config"
depends = ["site:install", "config:apply"]
run = "echo '✓ build done — run: mise run init'"

[tasks."server:start"]
description = "Start the site dev server on :4321 — called by pitchfork, do not run directly"
run = "cd \"$SITE_DIR\" && exec pnpm dev"
# Astro 7 auto-backgrounds itself when it detects an agent / non-TTY parent
# (`isRunByAgent()`), which makes it exit and orphans the server so pitchfork
# cannot supervise it. Setting ASTRO_DEV_BACKGROUND disables that detection and
# keeps the server in the foreground. (The name is Astro's; the value just needs
# to be set — it is also written into Astro's lock file.)
[tasks."server:start".env]
ASTRO_DEV_BACKGROUND = "1"

[tasks."server:logs"]
description = "Follow live site logs"
run = "pitchfork logs emdash --follow"

[tasks."server:open"]
description = "Open admin UI in browser via dev-bypass (runs migrations + seed; skips passkey auth)"
# Always use this — never go to /_emdash/admin/login directly.
run = "open 'http://localhost:4321/_emdash/api/setup/dev-bypass?redirect=/_emdash/admin'"

[tasks."server:reset"]
description = "⚠ Wipe local D1/miniflare state (loses all content) — then run: mise run apply"
# The host site is a Cloudflare template, so data lives in miniflare's D1 state,
# not in a data.db file.
run = "rm -rf \"$SITE_DIR/.wrangler/state\" && echo 'Done — run: mise run apply'"

[tasks."server:clean"]
description = "⚠ Wipe .src/site — then run: mise run server:build → init → apply"
run = """
set -euo pipefail
pitchfork stop emdash || true
rm -rf "$SITE_DIR"
echo "✓ Wiped .src/site — run: mise run server:build"
"""

[tasks."server:regen"]
description = "⚠ Wipe all of .src (templates + site) and re-clone templates"
run = """
set -euo pipefail
pitchfork stop -a || true
rm -rf "$SRC_DIR"
mise run src:clone:templates
echo "✓ Wiped .src — run: mise run server:build → init → apply"
"""

# -----------------------------------------------------------------------------
# DEPLOY (Cloudflare)
# -----------------------------------------------------------------------------

[tasks."site:build"]
description = "Production-build the site (astro build → .src/site/dist)"
# A production build leaves .vite/.astro in a state `astro dev` cannot reuse (stale
# deps_ssr URLs → 500s), so clean up afterwards and warn that dev must be restarted.
depends = ["config:apply"]
run = """
set -uo pipefail
cd "$SITE_DIR"
rc=0
pnpm build || rc=$?
rm -rf node_modules/.vite .astro
if [ "$rc" -eq 0 ]; then echo "→ dev server needs a restart: mise run apply"; fi
exit $rc
"""

[tasks."site:deploy:dry"]
description = "Validate the production build + Worker bundle without deploying"
depends = ["config:apply"]
run = """
set -uo pipefail
cd "$SITE_DIR"
rc=0
{ pnpm build && pnpm exec wrangler deploy --dry-run --outdir dist; } || rc=$?
rm -rf node_modules/.vite .astro
if [ "$rc" -eq 0 ]; then echo "→ dev server needs a restart: mise run apply"; fi
exit $rc
"""

[tasks."site:deploy"]
description = "Build + deploy the site to Cloudflare (creds via fnox)"
# Cloudflare creds come from fnox (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID).
depends = ["config:apply"]
run = """
set -uo pipefail
cd "$SITE_DIR"
rc=0
fnox exec -- pnpm run deploy || rc=$?
rm -rf node_modules/.vite .astro
if [ "$rc" -eq 0 ]; then echo "→ dev server needs a restart: mise run apply"; fi
exit $rc
"""

# -----------------------------------------------------------------------------
# TOP-LEVEL WORKFLOW
# -----------------------------------------------------------------------------

[tasks."init"]
description = "One-time init after server:build — plugin deps + skills"
depends = ["plugins:install-all", "skills:add:all"]
run = "echo '✓ init done — run: mise run apply'"

[tasks."apply"]
description = "Apply config + restart daemons + refresh token — run after every change"
# Full stop → wipe the Vite dep cache → cold start. Why stop first: a hot restart can
# leave @cloudflare/vite-plugin's miniflare instance in a bad state. Why wipe .vite: the
# optimizer re-hashes chunks whenever the dependency graph changes — adding a plugin's
# admin module, or running a production build in the same dir — which leaves the running
# server serving stale `deps_ssr/*?v=…` URLs and returning 500s.
depends = ["config:apply", "plugins:link", "skills:sync:emdash"]
run = """
set -euo pipefail
pitchfork stop -a || true
rm -rf "$SITE_DIR/node_modules/.vite"
# pitchfork waits for ready_http (declared in pitchfork.toml) before returning, so the
# site is already serving by the time we get here. Readiness is an HTTP check because
# Astro binds IPv6-only ([::1]:4321) — a 127.0.0.1 port probe would hang.
pitchfork start emdash
# dev-bypass also runs migrations and applies the seed on the first request, so poll
# until it returns 200 before minting the MCP token.
echo "⏳ waiting for the site to be ready..."
for i in $(seq 1 60); do
  STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:4321/_emdash/api/setup/dev-bypass) || true
  if [ "$STATUS" = "200" ]; then break; fi
  sleep 1
done
mise run mcp:token-admin
echo "→ admin:  http://localhost:4321/_emdash/api/setup/dev-bypass?redirect=/_emdash/admin"
echo "→ mcp:    http://localhost:4321/_emdash/api/mcp (Bearer: run/token-admin.txt)"
echo "✓ apply done"
"""

# -----------------------------------------------------------------------------
# PITCHFORK (daemon manager)
# -----------------------------------------------------------------------------

[tasks."pitchfork:start"]
description = "Apply configs + link plugins + start the site daemon (without forcing restart)"
depends = ["config:apply", "plugins:link", "skills:sync:emdash"]
run = "pitchfork start emdash"

[tasks."pitchfork:stop"]
description = "Stop all pitchfork daemons"
run = "pitchfork stop -a"

[tasks."pitchfork:status"]
description = "Show the site daemon status"
run = "pitchfork status emdash || true"

[tasks."pitchfork:logs"]
description = "Follow pitchfork site daemon logs"
run = "pitchfork logs emdash --follow"

[tasks."pitchfork:tui"]
description = "Open pitchfork TUI"
run = "pitchfork tui"

# -----------------------------------------------------------------------------
# MCP TOKENS
# The MCP endpoint (/_emdash/api/mcp) is enabled by default and requires a Bearer
# token. Tokens are written to run/ (gitignored) and auto-loaded via _.file above.
# -----------------------------------------------------------------------------

[tasks."mcp:token-admin"]
description = "Create admin MCP token → run/token-admin.txt + run/token-admin.env"
# admin token = full access (content, schema, media, taxonomy, plugins)
dir = "{{config_root}}"
run = """
set -euo pipefail
mkdir -p "$RUN_DIR"
TOKEN=$(node "$ROOT/scripts/get-mcp-token.mjs" admin)
echo "$TOKEN" > "$RUN_DIR/token-admin.txt"
echo "EMDASH_TOKEN=$TOKEN" > "$RUN_DIR/token-admin.env"
echo "✓ Token saved → run/token-admin.txt"
"""

[tasks."mcp:token-user"]
description = "Create content-only MCP token → run/token-user.txt"
dir = "{{config_root}}"
run = """
set -euo pipefail
mkdir -p "$RUN_DIR"
TOKEN=$(node "$ROOT/scripts/get-mcp-token.mjs" user)
echo "$TOKEN" > "$RUN_DIR/token-user.txt"
echo "✓ Token saved → run/token-user.txt"
"""

[tasks."mcp:clean-tokens"]
description = "Revoke all API tokens from the database"
run = "node \"$ROOT/scripts/clean-tokens.mjs\""

# -----------------------------------------------------------------------------
# PLUGIN DEVELOPMENT
# The CLI now ships with the site (published `emdash` package) — no monorepo build.
# -----------------------------------------------------------------------------

[tasks."plugin:install"]
description = "Install deps for one plugin — e.g: mise run plugin:install -- plat-trunk"
run = "sh -c 'cd \"$PLUGINS_DIR/$1\" && pnpm install' --"

[tasks."plugins:install-all"]
description = "Install deps for all plugins in plugins/"
wait_for = ["server:build"]
sources = ["plugins/*/package.json"]
outputs = ["plugins/*/node_modules/.modules.yaml"]
run = """
for d in "$PLUGINS_DIR"/*/; do
  [ -f "$d/package.json" ] || continue
  echo "→ pnpm install in $d"
  (cd "$d" && pnpm install)
done
"""

[tasks."plugins:link"]
description = "Symlink all local plugins into the site's node_modules so the dev server can load them"
# Why: plugins live in plugins/ but the site resolves them from its own node_modules.
# Symlinking keeps edits live. Handles scoped (@scope/name) and unscoped names.
run = """
set -euo pipefail
mkdir -p "$SITE_DIR/node_modules"
for d in "$PLUGINS_DIR"/*/; do
  [ -f "$d/package.json" ] || continue
  pkg=$(node -e "process.stdout.write(require('$d/package.json').name)")
  if [[ "$pkg" == @*/* ]]; then
    scope="${pkg%%/*}"
    name="${pkg#*/}"
    mkdir -p "$SITE_DIR/node_modules/$scope"
    ln -sfn "$d" "$SITE_DIR/node_modules/$scope/$name"
  else
    ln -sfn "$d" "$SITE_DIR/node_modules/$pkg"
  fi
  echo "  ✓ linked $pkg"
done
"""

[tasks."plugin:validate"]
description = "Validate a plugin manifest — e.g: mise run plugin:validate -- plat-trunk"
run = "sh -c 'mise run emdash:cli -- plugin validate --dir \"$PLUGINS_DIR/$1\"' --"

[tasks."plugin:bundle"]
description = "Bundle a plugin for distribution — e.g: mise run plugin:bundle -- plat-trunk"
run = "sh -c 'mise run emdash:cli -- plugin bundle --dir \"$PLUGINS_DIR/$1\" --outDir \"$PLUGINS_DIR/$1/dist\"' --"

[tasks."plugin:publish"]
description = "Publish a plugin to the PUBLIC emdash registry — e.g: mise run plugin:publish -- plat-trunk"
run = "sh -c 'mise run emdash:cli -- plugin publish --dir \"$PLUGINS_DIR/$1\" --build' --"

[tasks."plugin:login"]
description = "Log in to the EmDash registry via GitHub (required before plugin:publish)"
run = "mise run emdash:cli -- plugin login"

# -----------------------------------------------------------------------------
# SKILLS (Claude Code agent skills)
# -----------------------------------------------------------------------------

[tasks."skills:find"]
description = "Search skills.sh marketplace — e.g: mise run skills:find -- mise"
run = "sh -c 'skills find \"$1\"' --"

[tasks."skills:add"]
description = "Install a skill — e.g: mise run skills:add -- kinoward/agent-skills/mise-guide"
run = "sh -c 'skills add \"$1\" --yes --agents \"Claude Code\"' --"

[tasks."skills:remove"]
description = "Remove a skill — e.g: mise run skills:remove -- mise-guide"
run = "sh -c 'skills remove \"$1\" --yes' --"

[tasks."skills:remove:all"]
description = "Remove all installed skills"
run = "skills remove --all --yes"

[tasks."skills:update"]
description = "Update all skills to latest versions"
run = "skills update"

[tasks."skills:restore"]
description = "Restore skills from skills-lock.json (after fresh clone)"
run = "skills experimental_install"

[tasks."skills:list"]
description = "List installed skills"
run = "skills list"

[tasks."skills:sync:emdash"]
description = "Symlink the site's shipped EmDash skills into .claude/skills/emdash"
# The template ships its own agent skills. Symlink (don't copy) so they track the
# template version automatically.
run = """
set -euo pipefail
mkdir -p "$ROOT/.claude/skills"
# Use a RELATIVE target: the link lives at .claude/skills/emdash, so the target is
# always ../../.src/site/.... An absolute symlink breaks on any other clone, and
# pointing into a gitignored dir means it must never be committed.
rel=""
[ -d "$SITE_DIR/.claude/skills" ] && rel="../../.src/site/.claude/skills"
[ -z "$rel" ] && [ -d "$SITE_DIR/.agents/skills" ] && rel="../../.src/site/.agents/skills"
if [ -z "$rel" ]; then
  echo "  ⚠ no shipped skills found in $SITE_DIR (.claude/skills or .agents/skills)"
  exit 0
fi
ln -sfn "$rel" "$ROOT/.claude/skills/emdash"
echo "  ✓ .claude/skills/emdash → $rel"
"""

[tasks."skills:add:all"]
description = "Install the standard skill set for this project (run once after init)"
# After install, remove non-Claude agent symlinks — the skills CLI has no restrict flag.
wait_for = ["server:build"]
run = """
set -euo pipefail
mise run skills:sync:emdash
skills add kinoward/agent-skills/mise-guide --yes --agents "Claude Code"
rm -rf "$ROOT/.crush" "$ROOT/.goose" "$ROOT/.cursor" "$ROOT/.augment" "$ROOT/.continue" "$ROOT/.codebuddy"
echo "  ✓ non-Claude agent dirs removed"
"""

# -----------------------------------------------------------------------------
# EMDASH CLI
# -----------------------------------------------------------------------------

[tasks."emdash:cli"]
description = "Run the site's emdash CLI against the local server — e.g: mise run emdash:cli -- content list posts"
# Thin wrapper around scripts/emdash.mjs (site-local CLI, --url http://localhost:4321).
run = "node \"$ROOT/scripts/emdash.mjs\""

[tasks."plugins:catalog"]
description = "Discover EmDash plugins on GitHub → docs/plugin-catalog/"
run = "node \"$ROOT/scripts/find-plugins.mjs\""

[tasks."plugins:catalog:dry"]
description = "Discover plugins, print JSON to stdout (no files written)"
run = "node \"$ROOT/scripts/find-plugins.mjs\" --dry"

[tasks."plugins:catalog:full"]
description = "Discover plugins + fetch README excerpts (slower)"
run = "node \"$ROOT/scripts/find-plugins.mjs\" --readmes"
