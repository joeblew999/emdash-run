# $schema = "https://mise.jdx.dev/schema/mise.json"
#
# emdash-run — local EmDash harness. See docs/plans/done/0007-emdash-1.1-templates-src-rework.md.
#
# Model: the host site is an official EmDash template (starter-cloudflare) copied
# into .src/site. It consumes the *published* `emdash` npm package.
#
# Tasks are the interface; scripts/*.mjs hold the implementation. Every task here is a
# one-line call into scripts/ — put logic in a script, never inline in this file.
# The one exception is `depends`, which is mise's job (orchestration).

[settings]
# Serial task execution — avoids pnpm lockfile conflicts during install
jobs = 1

[tools]
node           = "22.22.2"
pnpm           = "11.9.0"      # must match the site's packageManager (emdash@1.1.0 requires 11.9.0)
pitchfork      = "2.29.0"      # process manager for the daemons
# Secrets. `fnox exec -- <cmd>` is how anything needing credentials runs: `site:deploy`,
# and the `secret()` helper in scripts/lib/exec.mjs that `repo:verify` uses to reach R2.
#
# Declared here rather than left to the global mise config, where it was the only thing
# providing it — so a fresh clone on another machine had no fnox, and both of those paths
# would fail with a confusing error. Short form on purpose: mise maps `fnox` to
# `github:jdx/fnox`, which is the same resolution the global config gets.
fnox           = "1.36.0"
"npm:skills"   = "1.4.7"       # Claude Code skills manager
# Linters + formatter — the same ones the emdash monorepo uses, at the same versions it has
# installed, so the ecosystem agrees on style AND the toolchain is known-good. Pinned here
# rather than in a root package.json, because this repo has no root package: mise [tools] is
# the toolchain.
#
# These three are version-coupled and must move together: oxlint --type-aware delegates to
# oxlint-tsgolint, and a mismatch panics at run time rather than failing cleanly (oxlint
# 1.86.0 + tsgolint 0.25.0 dies with `panic: unknown rule: no-generated-empty-object-type`).
# Versions below are read from .src/emdash/node_modules — the pair that works there.
"npm:oxlint"          = "1.74.0"
"npm:oxfmt"           = "0.59.0"
"npm:oxlint-tsgolint" = "0.25.0"
# Test runner for the repo's own scripts (`tests/*.test.mjs`). Matches the version the
# sandboxed plugin already uses, so there is one vitest in the story, not two.
"npm:vitest"          = "4.1.11"

[env]
# Project root (where this mise.toml lives)
ROOT            = "{{config_root}}"

# Gitignored working checkouts (see docs/plans/done/0007-emdash-1.1-templates-src-rework.md)
SRC_DIR         = "{{config_root}}/.src"
TEMPLATES_DIR   = "{{config_root}}/.src/templates"   # clone of emdash-cms/templates
SITE_DIR        = "{{config_root}}/.src/site"        # copy of $TEMPLATE — the host site (:4321)
SITE_URL        = "http://localhost:4321"            # the host site as a URL — scripts read this, never a literal
EMDASH_DIR      = "{{config_root}}/.src/emdash"      # optional emdash monorepo clone (on demand)

# Which official template to host. `blank` was retired upstream; starter-cloudflare
# is the minimal Cloudflare (D1 + R2) base — the closest live equivalent.
TEMPLATE        = "starter-cloudflare"

TEMPLATES_REPO  = "https://github.com/emdash-cms/templates"
EMDASH_REPO     = "https://github.com/emdash-cms/emdash"

# EmDash version — single source of truth. `site:install` pins the site's `emdash`
# and `@emdash-cms/cloudflare` to exactly this.
EMDASH_VERSION  = "1.1.0"

# Local plugins under development — symlinked into the site's node_modules by plugin:link
PLUGINS_DIR     = "{{config_root}}/plugins"

# Runtime output dirs (both gitignored)
LOGS_DIR        = "{{config_root}}/logs"   # pitchfork daemon logs
RUN_DIR         = "{{config_root}}/run"    # generated tokens (token-admin.txt, token-admin.env, token-user.txt)

# Optional daemons — the single place these addresses are defined. Scripts read them;
# pitchfork.toml's ready_http is static and repeats the port (it cannot read mise env).
REGISTRY_URL     = "http://localhost:8788"
REGISTRY_PORT    = "8788"
PLUGINS_SITE_URL = "http://localhost:4330"
PLUGINS_SITE_PORT = "4330"

# Point the site's plugin discovery at the LOCAL registry. build.mjs deletes this before
# site:build / site:deploy, so production uses the hosted registry.
EMDASH_REGISTRY_URL = "{{env.REGISTRY_URL}}"

# Injects EMDASH_TOKEN from run/token-admin.env into the environment.
# (Re)generated by mcp:token-admin on every apply. The EmDash MCP server reads it.
_.file          = "{{config_root}}/run/token-admin.env"

# =============================================================================
# QUICK REFERENCE
# =============================================================================
#
# First time:
#   mise run site:setup      ← clone templates → copy site → install → apply config
#   mise run repo:init            ← plugin deps + skills (run once)
#   mise run repo:apply           ← start daemons + generate token (idempotent)
#
# Every day / after every change:
#   mise run repo:apply           ← config:apply + plugin:build + plugin:link + skills:sync + restart + token
#   mise run repo:verify          ← assert the RUNNING site matches what this repo claims
#
# Recovery:
#   mise run site:reset      ← wipe local D1/miniflare state, then: mise run repo:apply
#   mise run site:clean      ← wipe .src/site, then: site:setup → init → apply
#   mise run site:regen      ← wipe .src entirely (templates + site), then: site:setup → init → apply
#
# Optional (not on the default path):
#   mise run src:clone-emdash  ← shallow clone of the emdash monorepo into .src/emdash
#   mise run registry:up       ← run the local plugin registry (the "marketplace") on :8788
#   mise run registry:backfill ← ingest publishers' records (Jetstream only streams new)
#   mise run registry:project  ← build the public projection (else reads return nothing)
#
# URLs (once running):
#   mise run repo:urls            ← prints every URL below
#   http://localhost:4321/_emdash/api/setup/dev-bypass?redirect=/_emdash/admin  ← Admin UI (ALWAYS use this, not /login)
#   http://localhost:4321/_emdash/api/mcp   ← MCP endpoint (enabled by default; Bearer token from run/token-admin.txt)
#   http://localhost:8788/health   ← local registry (JSON API under /xrpc/…) — only if `mise run registry:up`
#
# Why dev-bypass and NOT the login page:
#   Passkeys are stored in the database. site:reset wipes it → old passkey credentials
#   are gone but still cached in the browser → "Authentication failed" on login.
#   dev-bypass skips passkey auth entirely (DEV mode only) and runs migrations + seed.
#
# Updating:
#   EmDash version    bump EMDASH_VERSION below, then: site:clean → site:setup → init → apply
#   Template content  site:clean → site:setup → init → apply  (apply alone does NOT re-copy .src/site)
#   Local plugin      mise run repo:apply
#
# Deploy (Cloudflare):
#   mise run site:deploy-dry   ← build + validate the Worker bundle (no cloud changes)
#   mise run site:deploy       ← build + deploy (creds via fnox)
#   Live: https://emdash-run.gedw99.workers.dev
#
# Gotchas:
#   - A production build (site:build / site:deploy) dirties the dev server's Vite cache
#     → 500s on admin routes. The build tasks clean up and print a reminder; then: mise run repo:apply
#   - Astro 7 auto-backgrounds under a non-TTY parent; site:dev sets ASTRO_DEV_BACKGROUND
#     so pitchfork can supervise it.
#   - Astro binds IPv6-only — readiness is `ready_http` in pitchfork.toml, not a port probe.
#   - `apply` is idempotent and IS the check: if it exits cleanly, the system works.
#
# =============================================================================

# -----------------------------------------------------------------------------
# SRC (gitignored checkouts)
# -----------------------------------------------------------------------------

[tasks."src:clone-templates"]
description = "Clone or update emdash-cms/templates into .src/templates"
run = """
mkdir -p "$SRC_DIR"
if [ -d "$TEMPLATES_DIR/.git" ]; then
  git -C "$TEMPLATES_DIR" fetch --depth 1 origin main
  git -C "$TEMPLATES_DIR" checkout -q FETCH_HEAD
else
  git clone --depth 1 "$TEMPLATES_REPO" "$TEMPLATES_DIR"
fi
echo "  ✓ templates @ $(git -C "$TEMPLATES_DIR" rev-parse --short HEAD)"
"""

[tasks."src:clone-emdash"]
description = "Clone or update the emdash monorepo at tag emdash@$EMDASH_VERSION into .src/emdash — on demand"
run = """
mkdir -p "$SRC_DIR"
TAG="emdash@$EMDASH_VERSION"
if [ -d "$EMDASH_DIR/.git" ]; then
  git -C "$EMDASH_DIR" fetch --depth 1 origin "refs/tags/$TAG"
  git -C "$EMDASH_DIR" checkout -q FETCH_HEAD
else
  git clone --depth 1 --branch "$TAG" "$EMDASH_REPO" "$EMDASH_DIR"
fi
echo "  ✓ emdash @ $TAG → $EMDASH_DIR"
"""

# -----------------------------------------------------------------------------
# SITE (host site = official template copy, runs on :4321)
# -----------------------------------------------------------------------------

[tasks."site:sync"]
description = "Copy $TEMPLATE into .src/site (pristine copy; drops the template's packageManager pin)"
depends = ["src:clone-templates"]
run = "node \"$ROOT/scripts/site.mjs\" sync"

[tasks."site:install"]
description = "Install site deps + the first-party plugins the site config registers"
depends = ["site:sync"]
run = "node \"$ROOT/scripts/site.mjs\" install"

[tasks."config:apply"]
description = "Write our config into .src/site (astro.config, wrangler.jsonc, merged + validated seed)"
run = "node \"$ROOT/scripts/config.mjs\" apply"

[tasks."seed:validate"]
description = "Validate the merged site seed — EmDash silently skips an invalid one"
run = "node \"$ROOT/scripts/seed.mjs\" validate"

[tasks."seed:apply"]
description = "Get the seed into the RUNNING dev site — empties local D1 then reapplies (discards local content + admin session)"
run = "node \"$ROOT/scripts/seed.mjs\" apply"

[tasks."seed:from-remote"]
description = "Diff the DEPLOYED site's content model against the repo's seed (read-only; Cloudflare creds via fnox)"
run = "node \"$ROOT/scripts/seed.mjs\" from-remote"

[tasks."seed:export"]
description = "Export the running dev site's model + content as a seed (official: emdash export-seed)"
run = "node \"$ROOT/scripts/seed.mjs\" export"

[tasks."site:setup"]
description = "One-time: clone templates → copy site → install → apply config"
depends = ["site:install", "config:apply"]
run = "echo '✓ setup done — run: mise run repo:init'"

[tasks."site:dev"]
description = "Run the site dev server on :4321 — called by pitchfork, do not run directly"
dir = "{{config_root}}/.src/site"
run = "pnpm dev"

# Astro 7 auto-backgrounds itself when it detects an agent / non-TTY parent
# (`isRunByAgent()`), which makes it exit and orphans the server so pitchfork cannot
# supervise it. ASTRO_DEV_BACKGROUND disables that detection and keeps it in the
# foreground. EMDASH_REGISTRY_URL points plugin discovery at the LOCAL registry while it
# runs; deliberately not set for site:build / site:deploy, so production uses the hosted one.
[tasks."site:dev".env]
ASTRO_DEV_BACKGROUND = "1"

[tasks."site:logs"]
description = "Follow live site logs"
run = "pitchfork logs emdash --follow"

[tasks."site:open"]
description = "Open admin UI in browser via dev-bypass (runs migrations + seed; skips passkey auth)"
run = "open '$SITE_URL/_emdash/api/setup/dev-bypass?redirect=/_emdash/admin'"

[tasks."site:check"]
description = "Typecheck the site — astro check (incl. that the config loads) + tsc --checkJs on astro.config.mjs. Stops and restarts the site"
run = "node \"$ROOT/scripts/site.mjs\" check"

[tasks."site:doctor"]
description = "Diagnose the site's real D1 — database health and scheduler wiring (emdash doctor, pointed at the dev database)"
run = "node \"$ROOT/scripts/site.mjs\" doctor"

[tasks."site:migrate"]
description = "Report EmDash CORE migration status for the DEPLOYED D1 (read-only, Cloudflare creds via fnox — no admin token)"
run = "node \"$ROOT/scripts/site.mjs\" migrate"

[tasks."site:reset"]
description = "⚠ Wipe local D1/miniflare state (loses all content) — then run: mise run repo:apply"
run = "node \"$ROOT/scripts/site.mjs\" reset"

[tasks."site:clean"]
description = "⚠ Wipe .src/site — then run: mise run site:setup → init → apply"
run = "node \"$ROOT/scripts/site.mjs\" clean"

[tasks."site:regen"]
description = "⚠ Wipe all of .src (templates + site) and re-clone templates"
run = "node \"$ROOT/scripts/site.mjs\" regen"

# -----------------------------------------------------------------------------
# TOP-LEVEL WORKFLOW
# -----------------------------------------------------------------------------

[tasks."repo:init"]
description = "One-time init after site:setup — plugin deps + skills"
depends = ["plugin:install-all", "skills:add-all"]
run = "node \"$ROOT/scripts/repo.mjs\" init"

[tasks."repo:apply"]
description = "Apply config + restart the site + refresh token — run after every change"
depends = ["config:apply", "plugin:build", "plugin:link", "plugin:typecheck", "plugin:audit", "skills:sync", "mise:check"]
run = "node \"$ROOT/scripts/repo.mjs\" apply"

# ── COMPOSED WORKFLOWS ──────────────────────────────────────────────────────────────
# The CLI gives one-shot commands; these are the jobs a developer actually does, each
# composed from several of them. The point of this file is that `mise run <task>` is the
# whole job — not a relay of one CLI call, which the CLI already does better.

[tasks."check"]
description = "Everything that must pass before a commit — lint, format, tests, plugin checks, mapping"
depends = ["repo:check", "mise:check", "repo:test", "plugin:typecheck", "plugin:audit"]

[tasks."check:deployed"]
description = "The same checks against a DEPLOYMENT — export EMDASH_URL=https://… first (needs emdash:login)"
run = """
set -e
echo "→ core migrations"
mise run site:migrate
echo "→ content model: repo vs deployed"
mise run seed:from-remote
echo "→ content, the model_id join, and snapshot drift"
mise run repo:verify
"""

[tasks."release"]
description = "Everything a sandboxed-plugin release needs — audit + typecheck, then validate, build, bundle"
depends = ["plugin:audit", "plugin:typecheck"]
run = "mise run plugin:validate && mise run plugin:build && mise run plugin:bundle"

[tasks."content:set"]
description = "Set fields on a live entry: read its rev, update, print the result"
usage = """
arg "<collection>" help="Collection slug, e.g. parts"
arg "<entry>" help="Entry id or slug"
arg "<json>" help="Data to set, as a JSON object"
"""
run = """
set -e
COLLECTION="$usage_collection"; ENTRY="$usage_entry"; DATA="$usage_json"
REV=$(mise run emdash:content -- get "$COLLECTION" "$ENTRY" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.indexOf("{")));console.log(j._rev||"")})')
if [ -z "$REV" ]; then echo "✗ no _rev for $COLLECTION/$ENTRY"; exit 1; fi
echo "→ $COLLECTION/$ENTRY rev=$REV"
mise run emdash:content -- update "$COLLECTION" "$ENTRY" --rev="$REV" --data "$DATA"
echo "✓ updated"
"""

[tasks."schema:diff"]
description = "Diff the repo's content model against a live instance (set EMDASH_URL for a deployment)"
run = "mise run seed:from-remote"

[tasks."repo:urls"]
description = "Print every URL this project serves"
run = "node \"$ROOT/scripts/repo.mjs\" urls"

[tasks."repo:verify"]
description = "Assert the running site matches what the repo claims (set EMDASH_URL to check a deployment instead) — content, the model_id join, and snapshot drift against real R2 objects"
run = "node \"$ROOT/scripts/repo.mjs\" verify"

[tasks."repo:check"]
description = "Lint + formatting over scripts/ and the plugins (oxlint --type-aware, oxfmt)"
run = "node \"$ROOT/scripts/repo.mjs\" check"

[tasks."repo:test"]
description = "Unit-test the repo's own scripts (tests/*.test.mjs)"
run = "node \"$ROOT/scripts/repo.mjs\" test"

[tasks."repo:format"]
description = "Apply formatting to scripts/ and the plugins — the fix for a failing repo:check"
run = "node \"$ROOT/scripts/repo.mjs\" format"

[tasks."mise:check"]
description = "Assert the 1:1 mapping between mise namespaces and scripts/<namespace>.mjs"
run = "node \"$ROOT/scripts/mise.mjs\" check"

# -----------------------------------------------------------------------------
# PITCHFORK (daemon manager)
# -----------------------------------------------------------------------------

[tasks."mcp:token-admin"]
description = "Create admin MCP token → run/token-admin.txt + run/token-admin.env"
run = "node \"$ROOT/scripts/mcp.mjs\" token-admin"

[tasks."mcp:clean-tokens"]
description = "Revoke all API tokens from the database"
run = "node \"$ROOT/scripts/mcp.mjs\" clean-tokens"

# -----------------------------------------------------------------------------
# DEPLOY (Cloudflare)
# -----------------------------------------------------------------------------

[tasks."site:build"]
description = "Production-build the site (astro build → .src/site/dist)"
depends = ["config:apply"]
run = "node \"$ROOT/scripts/site.mjs\" build"

[tasks."site:deploy-dry"]
description = "Validate the production build + Worker bundle without deploying"
depends = ["config:apply"]
run = "node \"$ROOT/scripts/site.mjs\" deploy-dry"

[tasks."site:deploy"]
description = "Build + deploy the site to Cloudflare (creds via fnox)"
depends = ["config:apply"]
run = "node \"$ROOT/scripts/site.mjs\" deploy"

# -----------------------------------------------------------------------------
# PLUGIN DEVELOPMENT
# Singular = one plugin (takes a name); plural = all plugins.
# The CLI ships with the site (published `emdash` package) — no monorepo build.
# -----------------------------------------------------------------------------

[tasks."plugin:install"]
description = "Install deps for one plugin — e.g: mise run plugin:install -- plat-trunk"
run = "node \"$ROOT/scripts/plugin.mjs\" install"

[tasks."plugin:install-all"]
description = "Install deps for all plugins in plugins/"
wait_for = ["site:setup"]
sources = ["plugins/*/package.json"]
outputs = ["plugins/*/node_modules/.modules.yaml"]
run = "node \"$ROOT/scripts/plugin.mjs\" install-all"

[tasks."plugin:link"]
description = "Symlink all local plugins into the site's node_modules so the dev server can load them"
run = "node \"$ROOT/scripts/plugin.mjs\" link"

[tasks."plugin:typecheck"]
description = "Typecheck every plugin that declares a typecheck script"
run = "node \"$ROOT/scripts/plugin.mjs\" typecheck"

[tasks."plugin:audit"]
description = "Structural checks across plugins/ — phantom scripts, unbuilt sandbox bundles, emdash drift, empty allowedHosts"
run = "node \"$ROOT/scripts/plugin.mjs\" audit"

# Sandboxed-plugin build + release. The CLI is `@emdash-cms/plugin-cli` (binary
# `emdash-plugin`) and needs an `emdash-plugin.jsonc`. These sweep every plugin and run the
# script only if it declares one, so a native plugin is skipped rather than failed.
#
# `plugin:build` is not optional before `plugin:link`: a sandboxed plugin's `./sandbox` export
# points at its built bundle, so linking without building leaves the site importing a file
# that does not exist. See docs/plugin.md.

[tasks."plugin:build"]
description = "Build every plugin that declares a build script (sandboxed bundles)"
run = "node \"$ROOT/scripts/plugin.mjs\" build"

[tasks."plugin:validate"]
description = "Validate plugin manifests (sandboxed plugins only)"
run = "node \"$ROOT/scripts/plugin.mjs\" validate"

[tasks."plugin:bundle"]
description = "Bundle a plugin for release — e.g: mise run plugin:bundle -- plat-trunk-sandboxed"
run = "node \"$ROOT/scripts/plugin.mjs\" bundle"



[tasks."skills:sync"]
description = "Vendor the site's EmDash skills into .github/skills/ (committed) + symlink them for Claude Code"
run = "node \"$ROOT/scripts/skills.mjs\" sync"

[tasks."skills:check"]
description = "Fail if the committed .github/skills/ copy has drifted from the skills the site ships"
run = "node \"$ROOT/scripts/skills.mjs\" check"

[tasks."skills:add-all"]
description = "Install the standard skill set for this project (run once after init)"
wait_for = ["site:setup"]
run = "node \"$ROOT/scripts/skills.mjs\" add-all"

# -----------------------------------------------------------------------------
# EMDASH CLI
# -----------------------------------------------------------------------------

[tasks."emdash:cli"]
description = "Run the site's emdash CLI against the local server — e.g: mise run emdash:cli -- content list posts"
run = "node \"$ROOT/scripts/emdash.mjs\""

[tasks."emdash:help"]
description = "the official emdash help, or `-- <cmd> --help` for one command"
run = "node \"$ROOT/scripts/emdash.mjs\" help"

[tasks."emdash:init"]
description = "initialize a database from the template config (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" init"

[tasks."emdash:types"]
description = "generate TypeScript types from the schema (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" types"

[tasks."emdash:doctor"]
description = "check database health and scheduler wiring (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" doctor"

[tasks."emdash:seed"]
description = "apply a seed file to a database (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" seed"

[tasks."emdash:export-seed"]
description = "export a database's schema + content as a seed (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" export-seed"

[tasks."emdash:migrate"]
description = "check or apply deployment-managed migrations (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" migrate"

[tasks."emdash:secrets"]
description = "generate or fingerprint an EmDash encryption key (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" secrets"

[tasks."emdash:login"]
description = "log in to an instance — prints a URL and a code you approve by hand"
run = "node \"$ROOT/scripts/emdash.mjs\" login"

[tasks."emdash:logout"]
description = "log out of an instance"
run = "node \"$ROOT/scripts/emdash.mjs\" logout"

[tasks."emdash:whoami"]
description = "show the current user and auth method"
run = "node \"$ROOT/scripts/emdash.mjs\" whoami"

[tasks."emdash:content"]
description = "list/get/create/update/delete/publish/schedule content (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" content"

[tasks."emdash:schema"]
description = "list/get/create/delete collections and add/remove fields (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" schema"

[tasks."emdash:media"]
description = "list/upload/get/delete media, or repair-usage (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" media"

[tasks."emdash:search"]
description = "full-text search across content (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" search"

[tasks."emdash:taxonomy"]
description = "list taxonomies and terms, add a term (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" taxonomy"

[tasks."emdash:menu"]
description = "list menus, or get one with its items (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" menu"

[tasks."emdash:site"]
description = "export/import a whole site as a .emdash package (official)"
run = "node \"$ROOT/scripts/emdash.mjs\" site"

[tasks."plugin:catalog"]
description = "Fetch the live plugin list from the registry → docs/plugin-catalog/"
run = "node \"$ROOT/scripts/plugin.mjs\" catalog"


[tasks."plugin:login"]
description = "log in to the plugin registry via your Atmosphere account (official)"
run = "node \"$ROOT/scripts/plugin.mjs\" login"

[tasks."plugin:logout"]
description = "log out of the plugin registry, revoking the publisher session (official)"
run = "node \"$ROOT/scripts/plugin.mjs\" logout"

[tasks."plugin:whoami"]
description = "show the active publisher (official)"
run = "node \"$ROOT/scripts/plugin.mjs\" whoami"

[tasks."plugin:profile"]
description = "manage the plugin package profile (official)"
run = "node \"$ROOT/scripts/plugin.mjs\" profile"

[tasks."plugin:switch"]
description = "switch the active publisher session to another DID (official)"
run = "node \"$ROOT/scripts/plugin.mjs\" switch"

[tasks."plugin:info"]
description = "show details about a single package (official) — e.g: mise run plugin:info -- <slug>"
run = "node \"$ROOT/scripts/plugin.mjs\" info"

[tasks."plugin:dev"]
description = "watch a sandboxed plugin's sources and rebuild on change (official)"
run = "node \"$ROOT/scripts/plugin.mjs\" dev"

[tasks."plugin:init"]
description = "scaffold a new sandboxed plugin (official) — e.g: mise run plugin:init -- my-plugin"
run = "node \"$ROOT/scripts/plugin.mjs\" init"

[tasks."plugin:release"]
description = "manage delegated release intents (official)"
run = "node \"$ROOT/scripts/plugin.mjs\" release"

[tasks."plugin:update-package"]
description = "update a published plugin's registry record without a release (official)"
run = "node \"$ROOT/scripts/plugin.mjs\" update-package"

[tasks."plugin:search"]
description = "Search the plugin registry (emdash-plugin search, defaulting to the local registry when running)"
run = "node \"$ROOT/scripts/plugin.mjs\" search"

[tasks."registry:install"]
description = "Clone (if needed) + install + build the emdash monorepo for the registry aggregator"
depends = ["src:clone-emdash"]
# Skipped when the lockfile has not changed — otherwise every `registry:up` re-installs
# the whole monorepo.
sources = [".src/emdash/pnpm-lock.yaml"]
outputs = [".src/emdash/node_modules/.modules.yaml"]
run = "node \"$ROOT/scripts/registry.mjs\" install"

[tasks."registry:migrate"]
description = "Apply the registry aggregator's local D1 migrations"
depends = ["registry:install"]
run = "node \"$ROOT/scripts/registry.mjs\" migrate"

[tasks."registry:env"]
description = "Create the registry aggregator's local .env (LISTING_POLICY_MODE=open + dev admin token)"
depends = ["src:clone-emdash"]
run = "node \"$ROOT/scripts/registry.mjs\" env"

[tasks."registry:start"]
description = "Start the local registry aggregator on :8788 — called by pitchfork"
depends = ["registry:migrate", "registry:env"]
run = "node \"$ROOT/scripts/registry.mjs\" start"

[tasks."registry:up"]
description = "Start the registry aggregator daemon via pitchfork"
run = "node \"$ROOT/scripts/registry.mjs\" up"

[tasks."registry:backfill"]
description = "Ingest plugin records from the ATProto network — then run registry:project to make reads work"
run = "node \"$ROOT/scripts/registry.mjs\" backfill"

[tasks."registry:project"]
description = "Build the registry's public projection — without it every read returns empty"
run = "node \"$ROOT/scripts/registry.mjs\" project"

