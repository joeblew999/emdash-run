# $schema = "https://mise.jdx.dev/schema/mise.json"
#
# emdash-run — the stages of working on an EmDash site, as mise tasks. They are in tasks.toml.
#
#   mise run site:new -- cloudflare:blog   a site, once
#   mise run site:start                    run it; then open /_emdash/api/setup/dev-bypass?redirect=/_emdash/admin
#   mise run site:stop
#   mise run emdash -- content list posts  anything else, through EmDash's own CLI
#   mise run site:delete
#
# This repo uses its own tasks the way any project does. Another project needs only:
#   [tools] node and pnpm, and
#   [task_config]
#   includes = ["git::https://github.com/joeblew999/emdash-run.git//tasks.toml?ref=<tag>"]

# The mise that writes docs/tasks.md here and on CI (.github/workflows/stages.yml pins the same).
# For THIS repo only: a project that includes tasks.toml needs no particular mise.
min_version = "2026.10.4"

[settings]
experimental = true # task includes from a git repo

[tools]
node = "26"
pnpm = "12"
fnox = "1.36.0" # secrets: the Cloudflare token for the live: tasks — fnox exec -- mise run live:…
# charter writes and checks the docs site the same way in every repo of the owner's (docs:setup).
"github:joeblew999/charter" = "0.13.0"

[env]
TEMPLATE = "cloudflare:starter" # what site:new makes site/ from when it is given no argument

[task_config]
includes = ["tasks.toml"]

# This repo's own tasks — not in tasks.toml, so a project that includes the tasks does not get them.
[tasks.test]
description = "Quick test: the everyday tasks from an empty folder, about a minute. One task: mise run test -- signin:token. Updates docs/status.md"
run = "bash tests/replay.sh quick"

[tasks."test:full"]
description = "Full test: every task, both templates, then the deployed-site tasks. About 8 minutes. Updates docs/status.md"
run = "bash tests/replay.sh full"

[tasks.issues]
description = "What developers have reported and nobody has dealt with: the open issues, newest first. Look here first"
run = "gh issue list --state open --limit 30"

[tasks.docs]
description = "Rebuild every generated page: docs/tasks.md (mise's own task docs, from tasks.toml), the README's task table, the docs site's pages, docs/status.md. The commit check and every test run do this too"
run = "node tests/status.mjs --rebuild"

[tasks.hooks]
description = "Turn on this repo's commit check: a commit that changes a task, the test or the README is refused until the test covers every task and the generated pages are rebuilt"
run = "git config core.hooksPath .githooks"

[tasks."docs:setup"]
description = "Write the docs site's config (charter: the same for every repo of the owner's)"
run = "charter docs"

[tasks."docs:check"]
description = "Check docs/ with charter: the site config is charter's, front matter, links, tasks and paths that do not exist. The commit check runs it by itself once charter is newer than 0.13.0 (joeblew999/charter#76): until then it reports every task in tasks.toml as missing — read past those lines"
run = "charter docs -check && charter docs-lint"

[tasks."docs:pages"]
description = "REMOTE, once: turn on GitHub Pages for docs/ on main"
run = 'gh api -X POST "repos/{owner}/{repo}/pages" -f "source[branch]=main" -f "source[path]=/docs"'

[tasks."github:labels"]
description = "REMOTE: create or update this repo's issue labels from .github/labels.tsv (charter)"
run = "charter labels"
