# $schema = "https://mise.jdx.dev/schema/mise.json"
#
# emdash-run — develop and run EmDash from any repo, on the official CLIs.
#
#   mise run setup              first time: template, install, config — then the site is up
#   mise run dev                after any change: config, seed, plugins, restart, URLs
#   mise run check              before a commit (the git hook runs it)      --fix repairs
#   mise run doctor             is the running site what the repo says?     --url <deployment>
#   mise run deploy             check, build, ship to Cloudflare, verify    --dry
#   mise run snapshot           the whole site as a package;  mise run restore -- <package>
#   mise run plugin:new -- x    scaffold a plugin, load it, have the site call it
#   mise run emdash -- …        the official CLI, any arguments
#
# THIS FILE IS YOUR PROJECT: the settings below, and nothing else. The harness itself — tools,
# tasks, daemons — is .config/mise/conf.d/harness.toml and nu/, which `mise run upgrade` replaces.
# How to work here: docs/agents/README.md

[env]
TEMPLATE = "starter-cloudflare"                      # any directory in emdash-cms/templates
EMDASH_VERSION = "1.1.0"                             # the site is pinned to exactly this
DEPLOY_URL = "https://emdash-run.gedw99.workers.dev"
# Packages config/site.astro.config.mjs imports that the template does not ship.
SITE_PACKAGES = "@emdash-cms/plugin-forms @emdash-cms/plugin-webhook-notifier"

# The project's own seed, merged over the template's. Empty: run on the template's seed alone.
SEED_FILE = "{{config_root}}/config/cad.seed.json"
SEED_ORDER = "projects:assemblies:parts"           # its collections, dependency-first
SEED_LABEL = "CAD"                                 # appended to the template's site name

# Who a scaffolded plugin says it is from. The placeholder works locally; publishing needs yours.
PLUGIN_PUBLISHER = "did:plc:REPLACE-WITH-YOUR-PUBLISHER-DID"
PLUGIN_AUTHOR = "joeblew999"
PLUGIN_SECURITY_URL = "https://github.com/joeblew999/emdash-run/security/advisories/new"

# What `doctor` asserts about live content. Each is optional — empty skips that check.
VERIFY_COLLECTION = "parts"                                                                               # its entries must carry data
VERIFY_JOIN_FIELD = "model_id"                                                                            # each entry must have this field…
VERIFY_BUCKET = "cad-documents"                                                                           # …naming an object in this R2 bucket…
VERIFY_OBJECT_KEY = "models/{id}/manifest.json"
VERIFY_SNAPSHOT_FIELD = "geometry_meta"                                                                   # …whose fields this stored snapshot must match
VERIFY_SNAPSHOT_MAP = "model_name=name,objects=objectCount,model_version=version,model_updated=updatedAt"
