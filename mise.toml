# $schema = "https://mise.jdx.dev/schema/mise.json"
#
# emdash-run — the stages of working on an EmDash site, as mise tasks. They are in tasks.toml.
#
#   mise run site:new -- cloudflare:blog   a site, once
#   mise run site:start                    run it; then open /_emdash/api/setup/dev-bypass?redirect=/_emdash/admin
#   mise run site:stop
#   mise run emdash -- content list posts  anything else, through EmDash's own CLI
#   mise run site:delete
#
# This repo uses its own tasks the way any project does. Another project needs only:
#   [tools] node and pnpm, and
#   [task_config]
#   includes = ["git::https://github.com/joeblew999/emdash-run.git//tasks.toml?ref=<tag>"]

# The mise that writes docs/tasks.md here and on CI (.github/workflows/stages.yml pins the same).
# For THIS repo only: a project that includes tasks.toml needs no particular mise.
min_version = "2026.10.4"

[settings]
experimental = true # task includes from a git repo

[tools]
node = "26"
pnpm = "12"
fnox = "1.36.0" # secrets: the Cloudflare token for the live: tasks — fnox exec -- mise run live:…
# charter keeps this repo the way it keeps every repo of the owner's: docs site, generated pages,
# issue forms, labels (charter.toml; mise run repo). Its tasks come from tasks/repo, below.
"github:joeblew999/charter" = "0.17.0"

[env]
TEMPLATE = "cloudflare:starter" # what site:new makes site/ from when it is given no argument

[task_config]
includes = ["tasks.toml", "git::https://github.com/joeblew999/charter.git//tasks/repo?ref=v0.17.0"]

# This repo's own tasks — not in tasks.toml, so a project that includes the tasks does not get them.
# Everything else this repo runs is charter's, from tasks/repo above: release, repo, repo:check, repo:ci, issue, issues,
# upstream:status, docs:setup, docs:lint, docs:check, docs:review, docs:pages.
[tasks.test]
description = "Quick test: the everyday tasks from an empty folder, about a minute. One task: mise run test -- signin:token. Records what it saw (tests/results.json) and rewrites the generated pages"
run = "bash tests/replay.sh quick"

[tasks."test:full"]
description = "Full test: every task, three sites at once, then the deployed-site tasks. About 20 minutes. Records what it saw and rewrites the generated pages"
run = "bash tests/replay.sh full"

[tasks.check]
description = "Every check but the tests themselves, in seconds: every task has a test step, the last recorded test run has no failure and no untested task, and repo:ci (the docs and the repo are as charter keeps them). mise run release runs this before it tags; run mise run test:full before that"
run = ["node tests/status.mjs --coverage", "node tests/status.mjs --green", { task = "repo:ci" }]

[tasks.hooks]
description = "Turn on the commit check in this clone (running a test does it too): every task has a test step, the generated pages are fresh, docs/ passes the lint"
run = "git config core.hooksPath .githooks"
