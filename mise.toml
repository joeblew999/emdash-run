# -----------------------------------------------------------------------------
# REGISTRY — the optional local plugin registry (:8788)
# Not on the default path. `registry:up` starts it; the projection has to be built or
# every query returns nothing.
# -----------------------------------------------------------------------------

# A private helper. mise does NOT hide a leading `_` on its own — `hide = true` does that.
# Both admin routes are the same POST with a different path, so the token lookup lives here.
[tasks."registry:_admin"]
hide = true
usage = 'arg "<path>" help="Admin route, e.g. /_admin/backfill"'
run = """
let env_file = $"($env.EMDASH_DIR)/apps/aggregator/.env"
let hits = (open $env_file | lines | where {|l| $l | str starts-with 'ADMIN_TOKEN=' })
if ($hits | is-empty) {
  print "✗ no ADMIN_TOKEN — run: mise run registry:env"
  exit 1
}
let token = ($hits | first | split row '=' | skip 1 | str join '=')
let res = (
  ^curl -sS -X POST
    -H $"authorization: Bearer ($token)"
    -H 'content-type: application/json'
    -d '{}'
    $"($env.REGISTRY_URL)($env.usage_path)"
  | complete
)
let body = ($res.stdout | str trim)
print (if ($body | str length) > 600 { $body | str substring 0..<600 } else { $body })
exit $res.exit_code
"""

[tasks."registry:install"]
description = "Install + build the emdash monorepo for the registry aggregator"
depends = ["src:clone-emdash"]
# Skipped when the lockfile has not changed — otherwise every `registry:up` re-installs
# the whole monorepo. Absolute paths, so they stay correct whatever the working directory.
dir = "{{config_root}}/.src/emdash"
sources = ["{{config_root}}/.src/emdash/pnpm-lock.yaml"]
outputs = ["{{config_root}}/.src/emdash/node_modules/.modules.yaml"]
run = """
^pnpm install --frozen-lockfile
^pnpm --filter @emdash-cms/aggregator run prebuild
"""

[tasks."registry:migrate"]
description = "Apply the registry aggregator's local D1 migrations"
depends = ["registry:install"]
dir = "{{config_root}}/.src/emdash/apps/aggregator"
run = "pnpm run db:migrate:local"

[tasks."registry:env"]
description = "Create the registry aggregator's local .env (LISTING_POLICY_MODE=open + dev admin token)"
depends = ["src:clone-emdash"]
dir = "{{config_root}}/.src/emdash/apps/aggregator"
# Without this the aggregator uses wrangler.jsonc's default LISTING_POLICY_MODE=projection,
# which fails closed (it needs positive labels from the emdashcms labeller) — so every read
# returns empty. `.env.example` sets `open`.
run = """
if ('.env' | path exists) {
  print "  ✓ .env already present"
} else {
  cp .env.example .env
  print "  ✓ wrote .env (LISTING_POLICY_MODE=open, dev ADMIN_TOKEN)"
}
"""

[tasks."registry:start"]
description = "Start the local registry aggregator on :8788 — called by pitchfork"
depends = ["registry:migrate", "registry:env"]
dir = "{{config_root}}/.src/emdash/apps/aggregator"
# `wrangler dev`, NOT the package's `vite dev`: the Cloudflare vite plugin resolves
# miniflare@4.20260507.1 + workerd@1.20260507.1, and that workerd build crashes on
# Durable Object SQLite (`table _cf_ALARM has 3 columns but 2 values were supplied`).
run = "^pnpm exec wrangler dev --port $env.REGISTRY_PORT"

[tasks."registry:up"]
description = "Start the registry aggregator daemon via pitchfork"
run = """
^pitchfork start registry
print $"→ registry: ($env.REGISTRY_URL)/health — JSON API under /xrpc/com.emdashcms.experimental.aggregator.*"
"""

[tasks."registry:logs"]
description = "Follow the registry aggregator's logs"
run = "pitchfork logs registry --follow"

[tasks."registry:backfill"]
description = "Ingest plugin records from the ATProto network — then run registry:project to make reads work"
# Jetstream only streams NEW records, so a fresh registry stays empty until backfill:
# this discovers publishers on the relay and fans out one job per (DID × collection).
run = "mise run registry:_admin -- /_admin/backfill"

[tasks."registry:project"]
description = "Build the registry's public projection — without it every read returns empty"
# Reads gate on public_projection_state.active_generation, and the generation is built by the
# LABEL ingest DO — locally there is no label stream, so a labels replay is what builds it.
run = "mise run registry:_admin -- /_admin/labels/replay"
