# $schema = "https://mise.jdx.dev/schema/mise.json"
#
# emdash-run — develop and run EmDash from any repo, on the official CLIs.
#
#   mise run setup              first time: template, install, config — then the site is up
#   mise run dev                after any change: config, seed, plugins, restart, URLs
#   mise run check              before a commit (the git hook runs it)      --fix repairs
#   mise run doctor             is the running site what the repo says?     --url <deployment>
#   mise run deploy             check, build, ship to Cloudflare, verify    --dry
#   mise run snapshot           the whole site as a package;  mise run restore -- <package>
#   mise run plugin:new -- x    scaffold a plugin, load it, have the site call it
#   mise run emdash -- …        the official CLI, any arguments
#
# YOUR PROJECT is this file (settings) and site/ (the site itself — pages, config, seed). The
# harness — tools, tasks, daemons — is .config/mise/conf.d/harness.toml and nu/, which
# `mise run upgrade` replaces.
# How to work here: docs/agents/README.md

[env]
TEMPLATE = "starter-cloudflare"                      # any directory in emdash-cms/templates
EMDASH_VERSION = "1.1.0"                             # the site is pinned to exactly this
DEPLOY_URL = "https://emdash-run.gedw99.workers.dev"
# Who a scaffolded plugin says it is from. The placeholder works locally; publishing needs yours.
PLUGIN_PUBLISHER = "did:plc:REPLACE-WITH-YOUR-PUBLISHER-DID"
PLUGIN_AUTHOR = "joeblew999"
PLUGIN_SECURITY_URL = "https://github.com/joeblew999/emdash-run/security/advisories/new"

# What `doctor` asserts about live content: this collection has entries, and they carry data.
# Empty skips the check.
VERIFY_COLLECTION = "posts"
