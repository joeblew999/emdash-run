# $schema = "https://mise.jdx.dev/schema/mise.json"

[settings]
# Serial task execution — avoids pnpm lockfile conflicts during install
jobs = 1

[tools]
node           = "22.22.2"
pnpm           = "10.28.0"
pitchfork      = "2.3.0"       # process manager for daemons (emdash dev server + marketplace worker)
"npm:wrangler" = "4.80.0"      # Cloudflare Workers CLI — used to run the local marketplace worker
"npm:skills"   = "1.4.7"       # Claude Code skills manager

[env]
# Project root (where this mise.toml lives)
ROOT          = "{{config_root}}"

# emdash monorepo clone — git cloned at $EMDASH_TAG by server:clone
EMDASH_DIR    = "{{config_root}}/emdash"

# The Cloudflare demo site inside the emdash clone — this is what runs as the dev server on :4321.
# config:apply copies our local config files here (astro.config.mjs, wrangler.jsonc).
# Named HOST_DIR because it is the Astro host application (the "site"), not the CMS package.
# TODO: rename to SITE_DIR for clarity
HOST_DIR      = "{{config_root}}/emdash/demos/cloudflare"

# Local plugins under development — symlinked into emdash/node_modules by plugins:link
PLUGINS_DIR   = "{{config_root}}/plugins"

# Runtime output dirs (both gitignored)
LOGS_DIR      = "{{config_root}}/logs"   # pitchfork daemon logs
RUN_DIR       = "{{config_root}}/run"    # generated tokens (token-admin.txt, token-admin.env, token-user.txt)

# Git tag to clone — bump this to upgrade emdash, then run: mise run server:clean → server:build → init → apply
EMDASH_TAG                = "emdash@0.1.0"

# Token used to seed the local marketplace DB on first init.
# Both vars must match — MARKETPLACE_SEED_TOKEN is read by the marketplace worker,
# EMDASH_MARKETPLACE_TOKEN is read by the emdash core when calling the marketplace.
MARKETPLACE_SEED_TOKEN    = "local-dev-seed-token"
EMDASH_MARKETPLACE_TOKEN  = "local-dev-seed-token"

# Injects EMDASH_TOKEN from run/token-admin.env into the environment.
# This file is (re)generated by mcp:token-admin on every apply.
# The EmDash MCP server reads EMDASH_TOKEN to authenticate API requests.
_.file                    = "{{config_root}}/run/token-admin.env"

# =============================================================================
# QUICK REFERENCE
# =============================================================================
#
# First time:
#   mise run server:build    ← clone → install → build + config:apply (slow, ~3 min)
#   mise run init            ← marketplace DB + plugin deps + skills (run once)
#   mise run apply           ← start daemons + generate token (always idempotent)
#
# Every day / after every change:
#   mise run apply           ← config:apply + plugins:link + skills:sync + restart daemons + token
#
# Recovery:
#   mise run server:reset    ← wipe SQLite database, then: mise run apply
#   mise run server:clean    ← wipe entire emdash clone, then: server:build → init → apply
#
# URLs (once running):
#   http://localhost:4321/_emdash/api/setup/dev-bypass?redirect=/_emdash/admin  ← Admin UI (ALWAYS use this, not /login)
#   http://localhost:4321/_emdash/api/mcp ← MCP endpoint (requires Bearer token from run/token-admin.txt)
#   http://localhost:8787/health          ← Marketplace health check
#   http://localhost:8787/api/v1/plugins  ← Marketplace plugin listing
#
# Why dev-bypass and NOT the login page:
#   Passkeys are stored in data.db. server:reset wipes data.db → old passkey credentials
#   are gone but still cached in the browser → "Authentication failed" on login.
#   dev-bypass skips passkey auth entirely (only works in DEV mode).
#
# =============================================================================

# -----------------------------------------------------------------------------
# CONFIG
# -----------------------------------------------------------------------------

[tasks."config:apply"]
description = "Copy local config overrides into the emdash clone — run before every daemon start"
# Why: the emdash clone is read-only (pinned at EMDASH_TAG). We keep our local
# config in config/ and copy it in rather than editing the clone directly.
# marketplace.wrangler.jsonc strips the custom_domain route — without this,
# wrangler dev uses marketplace.emdashcms.com as the Host header, breaking
# url.origin in marketplace routes (iconUrl etc. would point to prod domain).
run = """
cp "$ROOT/config/server.astro.config.mjs" "$HOST_DIR/astro.config.mjs"
cp "$ROOT/config/server.wrangler.jsonc" "$HOST_DIR/wrangler.jsonc"
cp "$ROOT/config/marketplace.wrangler.jsonc" "$EMDASH_DIR/packages/marketplace/wrangler.jsonc"
echo "  ✓ config applied"

# Symlink extra built-in plugins into the demo's node_modules.
# The demo's package.json only declares forms + webhook-notifier. The others
# (audit-log, color, embeds, atproto, ai-moderation) are in emdash/packages/plugins/
# but not declared as deps — symlink them directly. Same pattern as the kumo fix.
mkdir -p "$HOST_DIR/node_modules/@emdash-cms"
for p in plugin-audit-log plugin-color plugin-embeds plugin-atproto plugin-ai-moderation; do
  src="$EMDASH_DIR/packages/plugins/${p#plugin-}"
  ln -sfn "$src" "$HOST_DIR/node_modules/@emdash-cms/$p"
  echo "  ✓ linked @emdash-cms/$p"
done

# Fix @cloudflare/kumo version mismatch — packages/blocks pins ^1.10.0 (no Sidebar export)
# but the admin UI requires ^1.16.0. pnpm install restores the wrong version, so we
# force all symlinks to 1.16.0 on every apply. Without this the admin loads blank
# with "Sidebar not exported" in the console.
KUMO_16=$(find "$EMDASH_DIR/node_modules/.pnpm" -maxdepth 1 -type d -name "@cloudflare+kumo@1.1[6-9]*" -o -maxdepth 1 -type d -name "@cloudflare+kumo@1.[2-9]*" 2>/dev/null | sort -V | tail -1)
KUMO_16="$KUMO_16/node_modules/@cloudflare/kumo"
if [ -d "$KUMO_16" ]; then
  for target in \
    "$EMDASH_DIR/packages/blocks/node_modules/@cloudflare/kumo" \
    "$EMDASH_DIR/packages/blocks/playground/node_modules/@cloudflare/kumo" \
    "$EMDASH_DIR/packages/plugins/forms/node_modules/@cloudflare/kumo" \
    "$EMDASH_DIR/packages/plugins/ai-moderation/node_modules/@cloudflare/kumo"; do
    [ -e "$(dirname "$target")" ] && ln -sfn "$KUMO_16" "$target"
  done
  mkdir -p "$EMDASH_DIR/node_modules/@cloudflare"
  ln -sfn "$KUMO_16" "$EMDASH_DIR/node_modules/@cloudflare/kumo"
  echo "  ✓ kumo symlinks pinned to $(basename $(dirname $(dirname $KUMO_16)))"
else
  echo "  ✗ kumo 1.16+ not found in pnpm store — admin UI may fail to load"
fi
"""

# -----------------------------------------------------------------------------
# PLUGINS
# -----------------------------------------------------------------------------

[tasks."plugins:link"]
description = "Symlink all local plugins into emdash/node_modules so the dev server can load them"
# Why: plugins live in plugins/ but the emdash dev server resolves them from
# its own node_modules. We symlink rather than publish so edits are live immediately.
# Handles both scoped (@scope/name) and unscoped package names.
run = """
for d in "$PLUGINS_DIR"/*/; do
  [ -f "$d/package.json" ] || continue
  pkg=$(node -e "process.stdout.write(require('$d/package.json').name)")
  if [[ "$pkg" == @*/* ]]; then
    scope="${pkg%%/*}"
    name="${pkg#*/}"
    mkdir -p "$EMDASH_DIR/node_modules/$scope"
    ln -sfn "$d" "$EMDASH_DIR/node_modules/$scope/$name"
  else
    ln -sfn "$d" "$EMDASH_DIR/node_modules/$pkg"
  fi
  echo "  ✓ linked $pkg"
done
"""

# -----------------------------------------------------------------------------
# TOP-LEVEL WORKFLOW
# -----------------------------------------------------------------------------

[tasks."init"]
description = "One-time init after server:build — marketplace DB + plugin deps + skills"
depends = ["marketplace:init", "plugins:install-all", "skills:add:all"]
run = "echo '✓ init done — run: mise run apply'"

[tasks."apply"]
description = "Apply all config + restart daemons + refresh token — run after every change"
# Full stop → wipe Vite dep cache → cold start.
# Why stop first: pitchfork --force does a hot restart but @cloudflare/vite-plugin's
# miniflare instance requires a cold start when the Vite cache is absent or stale.
# Hot restart after cache wipe leaves miniflare undefined, breaking all API routes.
# Why wipe .vite: stale dep optimizations cause "Sidebar not exported" (kumo) and
# other Vite bundling issues. Cold start re-optimizes cleanly.
# -l: wait for daemon ready output before returning (blocks until :4321 and :8787 are up).
depends = ["config:apply", "plugins:link", "skills:sync:emdash"]
run = """
pitchfork stop -a || true
rm -rf "$HOST_DIR/node_modules/.vite"
pitchfork start -l
# pitchfork -l means port 4321 is open, but miniflare (the CF worker) needs ~5s more to boot.
# Poll dev-bypass until 200 before generating the token.
echo "⏳ waiting for worker to be ready..."
for i in $(seq 1 30); do
  STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:4321/_emdash/api/setup/dev-bypass)
  if [ "$STATUS" = "200" ]; then break; fi
  sleep 1
done
mise run mcp:token-admin
echo "✓ apply done"
"""

# -----------------------------------------------------------------------------
# PITCHFORK (daemon manager)
# -----------------------------------------------------------------------------

[tasks."pitchfork:start"]
description = "Apply configs + link plugins + start all daemons (without forcing restart)"
depends = ["config:apply", "plugins:link", "skills:sync:emdash"]
run = "pitchfork start -l"

[tasks."pitchfork:stop"]
description = "Stop all pitchfork daemons"
run = "pitchfork stop -a"

[tasks."pitchfork:status"]
description = "Show all pitchfork daemon status"
run = "pitchfork status emdash && pitchfork status marketplace"

[tasks."pitchfork:logs"]
description = "Follow pitchfork dev daemon logs"
run = "pitchfork logs emdash --follow"

[tasks."pitchfork:tui"]
description = "Open pitchfork TUI"
run = "pitchfork tui"

# -----------------------------------------------------------------------------
# SERVER (emdash dev server on :4321)
# -----------------------------------------------------------------------------

[tasks."server:clone"]
description = "Clone emdash at $EMDASH_TAG — run once"
# Idempotent: skips if already cloned at the right tag. Fails if cloned at wrong tag.
outputs = ["emdash/pnpm-lock.yaml"]
dir = "{{config_root}}"
run = """
set -euo pipefail
mkdir -p "$LOGS_DIR"
if [ ! -d "$EMDASH_DIR" ]; then
  echo "→ Cloning emdash @ $EMDASH_TAG..."
  git clone --depth 1 --branch "$EMDASH_TAG" https://github.com/emdash-cms/emdash.git "$EMDASH_DIR"
else
  if ! cd "$EMDASH_DIR" && git tag --points-at HEAD | grep -qF "$EMDASH_TAG"; then
    echo "✗ Clone does not have tag $EMDASH_TAG — run: mise run server:clean first"
    exit 1
  fi
  echo "→ Already at $EMDASH_TAG"
fi
"""

[tasks."server:build"]
description = "Install deps + build packages + apply config"
# Idempotent: skips if packages/core/dist already exists (already built).
# config:apply runs at the end so our local overrides are in place before first start.
depends = ["server:clone"]
dir = "{{config_root}}"
run = """
set -euo pipefail
if [ -f "$EMDASH_DIR/packages/core/dist/index.mjs" ]; then
  echo "→ Already built, skipping"
  exit 0
fi
echo "→ Installing..."
cd "$EMDASH_DIR" && pnpm install --frozen-lockfile
echo "→ Building packages..."
pnpm build
mise run config:apply
echo "✓ Done — run: mise run pitchfork:start"
"""

[tasks."server:start"]
description = "Start dev server on :4321 — called by pitchfork, do not run directly"
run = "cd \"$HOST_DIR\" && exec pnpm dev"

[tasks."server:open"]
description = "Open admin UI in browser via dev-bypass (skips passkey auth)"
# Always use this — never go to /_emdash/admin/login directly.
# Passkeys are in data.db; server:reset wipes them → browser credential becomes stale → auth fails.
run = "open 'http://localhost:4321/_emdash/api/setup/dev-bypass?redirect=/_emdash/admin'"

[tasks."server:logs"]
description = "Follow live server logs"
run = "pitchfork logs emdash --follow"

[tasks."server:reset"]
description = "⚠ Wipe SQLite database (data.db) — loses all content. Then run: mise run apply"
run = "rm -f \"$HOST_DIR/data.db\" && echo 'Done — restart server'"

[tasks."server:clean"]
description = "⚠ Wipe entire emdash clone — then run: mise run server:build → init → apply"
dir = "{{config_root}}"
run = """
set -euo pipefail
pitchfork stop emdash || true
rm -rf "$EMDASH_DIR"
echo "✓ Wiped — run: mise run server:build"
"""

# -----------------------------------------------------------------------------
# MCP TOKENS
# The MCP server at /_emdash/api/mcp requires a Bearer token.
# Tokens are written to run/ (gitignored) and auto-loaded via _.file above.
# -----------------------------------------------------------------------------

[tasks."mcp:token-admin"]
description = "Create admin MCP token → run/token-admin.txt + run/token-admin.env"
# admin token = full access (content, schema, media, taxonomy, plugins)
# token-admin.env is auto-sourced via _.file so EMDASH_TOKEN is always current
dir = "{{config_root}}"
run = """
set -euo pipefail
mkdir -p "$RUN_DIR"
TOKEN=$(node "$ROOT/scripts/get-mcp-token.mjs" admin)
echo "$TOKEN" > "$RUN_DIR/token-admin.txt"
echo "EMDASH_TOKEN=$TOKEN" > "$RUN_DIR/token-admin.env"
echo "✓ Token saved → run/token-admin.txt"
"""

[tasks."mcp:token-user"]
description = "Create content-only MCP token → run/token-user.txt"
# user token = read/write content only (no schema, no admin operations)
dir = "{{config_root}}"
run = """
set -euo pipefail
mkdir -p "$RUN_DIR"
TOKEN=$(node "$ROOT/scripts/get-mcp-token.mjs" user)
echo "$TOKEN" > "$RUN_DIR/token-user.txt"
echo "✓ Token saved → run/token-user.txt"
"""

[tasks."mcp:clean-tokens"]
description = "Revoke all API tokens from the database"
run = "node \"$ROOT/scripts/clean-tokens.mjs\""

# -----------------------------------------------------------------------------
# PLUGIN DEVELOPMENT
# -----------------------------------------------------------------------------

[tasks."plugin:install"]
description = "Install deps for one plugin — e.g: mise run plugin:install -- plat-trunk"
run = "sh -c 'cd \"$PLUGINS_DIR/$1\" && pnpm install' --"

[tasks."plugins:install-all"]
description = "Install deps for all plugins in plugins/"
# sources/outputs: mise caches this — only reruns when package.json files change
wait_for = ["server:build"]
sources = ["plugins/*/package.json"]
outputs = ["plugins/*/node_modules/.modules.yaml"]
run = """
for d in "$PLUGINS_DIR"/*/; do
  [ -f "$d/package.json" ] || continue
  echo "→ pnpm install in $d"
  (cd "$d" && pnpm install)
done
"""

[tasks."plugin:validate"]
description = "Validate a plugin manifest — e.g: mise run plugin:validate -- plat-trunk"
run = "sh -c 'mise run emdash:cli -- plugin validate --dir \"plugins/$1\"' --"

[tasks."plugin:bundle"]
description = "Bundle a plugin for distribution — e.g: mise run plugin:bundle -- plat-trunk"
run = "sh -c 'mise run emdash:cli -- plugin bundle --dir \"plugins/$1\" --outDir \"plugins/$1/dist\"' --"

[tasks."plugin:publish"]
description = "Publish a plugin to the PUBLIC emdash marketplace — e.g: mise run plugin:publish -- plat-trunk"
run = "sh -c 'mise run emdash:cli -- plugin publish --dir \"plugins/$1\" --build' --"

[tasks."plugin:login"]
description = "Log in to the EmDash Marketplace via GitHub (required before plugin:publish)"
run = "mise run emdash:cli -- plugin login"

# -----------------------------------------------------------------------------
# MARKETPLACE (local Cloudflare Worker on :8787)
# Runs the same marketplace code as production but against a local D1 database.
# URLs: http://localhost:8787/health  |  http://localhost:8787/api/v1/plugins
# -----------------------------------------------------------------------------

[tasks."marketplace:init"]
description = "Initialize local marketplace D1 database — run once after server:build"
# Idempotent: skips if the sqlite file already exists
depends = ["server:build"]
dir = "{{config_root}}/emdash/packages/marketplace"
run = """
if ls .wrangler/state/v3/d1/miniflare-D1DatabaseObject/*.sqlite 2>/dev/null | grep -q .; then
  echo "→ Marketplace DB already initialized, skipping"
  exit 0
fi
wrangler d1 execute emdash-marketplace --local --file src/db/schema.sql
"""

[tasks."marketplace:start"]
description = "Start local marketplace worker on :8787 — called by pitchfork, do not run directly"
dir = "{{config_root}}/emdash/packages/marketplace"
run = "wrangler dev --port 8787"

[tasks."marketplace:logs"]
description = "Follow marketplace worker logs"
run = "pitchfork logs marketplace --follow"

[tasks."marketplace:publish"]
description = "Publish a plugin to the LOCAL marketplace — e.g: mise run marketplace:publish -- plat-trunk"
# Use this during plugin development to test install flow locally.
# Use plugin:publish to publish to the real public marketplace.
run = "sh -c 'mise run emdash:cli -- plugin publish --dir \"plugins/$1\" --build --registry http://localhost:8787' --"

# -----------------------------------------------------------------------------
# SKILLS (Claude Code agent skills)
# -----------------------------------------------------------------------------

[tasks."skills:find"]
description = "Search skills.sh marketplace — e.g: mise run skills:find -- mise"
run = "sh -c 'skills find \"$1\"' --"

[tasks."skills:add"]
description = "Install a skill — e.g: mise run skills:add -- kinoward/agent-skills/mise-guide"
run = "sh -c 'skills add \"$1\" --yes --agents \"Claude Code\"' --"

[tasks."skills:remove"]
description = "Remove a skill — e.g: mise run skills:remove -- mise-guide"
run = "sh -c 'skills remove \"$1\" --yes' --"

[tasks."skills:remove:all"]
description = "Remove all installed skills"
run = "skills remove --all --yes"

[tasks."skills:update"]
description = "Update all skills to latest versions"
run = "skills update"

[tasks."skills:restore"]
description = "Restore skills from skills-lock.json (after fresh clone)"
run = "skills experimental_install"

[tasks."skills:sync:emdash"]
description = "Symlink .claude/skills/emdash → emdash clone's skills directory"
# Why: emdash ships its own Claude skills inside the monorepo. Rather than copying
# them, we symlink so they stay in sync with the cloned version automatically.
run = """
mkdir -p "$ROOT/.claude/skills"
ln -sfn "$EMDASH_DIR/.claude/skills" "$ROOT/.claude/skills/emdash"
echo "  ✓ .claude/skills/emdash → $EMDASH_DIR/.claude/skills"
"""

[tasks."skills:add:all"]
description = "Install the standard skill set for this project (run once after init)"
# After install, remove non-Claude agent symlinks — the skills CLI has no restrict flag,
# so we clean up manually. Only .claude/skills and .agents/skills are needed here.
wait_for = ["server:build"]
run = """
mise run skills:sync:emdash
skills add kinoward/agent-skills/mise-guide --yes --agents "Claude Code"
rm -rf "$ROOT/.crush" "$ROOT/.goose" "$ROOT/.cursor" "$ROOT/.augment" "$ROOT/.continue" "$ROOT/.codebuddy"
echo "  ✓ non-Claude agent dirs removed"
"""

[tasks."skills:list"]
description = "List installed skills"
run = "skills list"

# -----------------------------------------------------------------------------
# EMDASH CLI
# -----------------------------------------------------------------------------

[tasks."emdash:cli"]
description = "Run emdash CLI against local server — e.g: mise run emdash:cli -- content list posts"
# Thin wrapper around scripts/emdash.mjs which points the CLI at http://localhost:4321
run = "node \"$ROOT/scripts/emdash.mjs\""

[tasks."plugins:catalog"]
description = "Discover EmDash plugins on GitHub → docs/plugin-catalog/"
run = "node \"$ROOT/scripts/find-plugins.mjs\""

[tasks."plugins:catalog:dry"]
description = "Discover plugins, print JSON to stdout (no files written)"
run = "node \"$ROOT/scripts/find-plugins.mjs\" --dry"

[tasks."plugins:catalog:full"]
description = "Discover plugins + fetch README excerpts (slower)"
run = "node \"$ROOT/scripts/find-plugins.mjs\" --readmes"
