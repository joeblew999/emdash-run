# $schema = "https://mise.jdx.dev/schema/mise.json"
#
# emdash-run — local EmDash harness. See docs/plans/done/0007-emdash-1.1-templates-src-rework.md.
#
# -----------------------------------------------------------------------------
# FILES THAT MUST AGREE — this one is the source of truth for all of them.
#
#   [daemons]        the daemons live in THIS file and run tasks from THIS file. mise manages them
#                    through pitchfork (`mise daemons start|stop|status|logs`). `repo:sync` fails if
#                    a daemon names a task that does not exist — mise itself does not check that.
#   .mcp.json        its `${EMDASH_MCP_TOKEN}` is written by `mcp:token-admin` into
#                    run/token-admin.env, which [env] loads. Rename one, rename the other.
#   AGENTS.md        how to work in this repo. If a rule here changes, it changes there.
#
# Never keep a second copy of the task list in any of them — duplicated lists drift.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# CHECKS — RUN THESE. Do not reason about whether this file is correct; ask it.
#
#   mise run check       everything before a commit — lint, formatting, the skills, the files that
#                        must agree, and the nushell check below. It composes them.
#   mise run repo:nu     nushell's OWN CHECKER over every task body in this file. Bodies live
#                        inside TOML, so nothing parses them until they run: a typo stays invisible
#                        until someone happens to hit that path. `nu --ide-check` reports parse
#                        errors, type mismatches and unknown variables, and does NOT resolve
#                        externals (`^cmd`, a bare `pnpm`), so it raises no false alarms.
#                        It has already caught a `&&` — not a nushell operator — and a command
#                        wrapped across two lines. Both tasks had never been run and could not
#                        have worked.
#   mise run repo:sync   every `mise run <task>` in [daemons] names a task that exists.
#   mise run doctor      the LIVE state: the site's database, plugin consistency, repo:verify.
#   mise run site:check  the site type-checks, including that astro.config.mjs loads.
#
# Edited a task?      mise run repo:nu      Touched a daemon?  mise run repo:sync
# -----------------------------------------------------------------------------
#
# Model: the host site is an official EmDash template (starter-cloudflare) copied
# into .src/site. It consumes the *published* `emdash` npm package, and the two official
# CLIs are the way to work with it: `emdash` (site) and `emdash-plugin` (plugins).
#
# There are no scripts. Every task body is nushell, run by `[task_config] shell` below, so
# the task IS the implementation — readable in one place, and the same on every platform.
#
# WRITTEN TO BE REUSED. This harness is not specific to this site: the tasks are built on the two
# official CLIs and the official template layout, and every value that names a project lives in the
# PROJECT SETTINGS block at the top of [env] — template, EmDash version, deploy URL, daemon name,
# the project's own seed, the code to lint, and the collection/field/bucket that `repo:verify`
# asserts. Point those at another EmDash project and the flows work unchanged.
#
# Tasks are the interface, and they come in two kinds — the distinction is the point:
#
#   PRIMITIVES  one official command or script, nothing invented. Thin on purpose: the
#               CLI already does this well, so these add only what makes it usable here
#               (the site's own binary on PATH, the working directory the CLI needs, the dev
#               database path).
#
#   WORKFLOWS   the jobs a developer actually does, composed from primitives. "The CLI
#               provides one-shot commands; a dev wants to wrap many into one." This is
#               where the value is, and it is what mise is for: `depends` to run parts
#               in parallel, `usage` for typed arguments, `dir`/`env` for context,
#               `sources`/`outputs` to skip work already done, `hide` for a helper that is
#               not part of the interface.

[settings]
# `mise daemons` is experimental. Enabled in the repo's own config so it travels with the repo
# rather than depending on anyone's global mise settings.
experimental = true
# Serial task execution — avoids pnpm lockfile conflicts during install
jobs = 1

[tools]
node = "26.10.0"
pnpm = "12.9.1"      # must match the site's packageManager (emdash@1.1.0 requires 11.9.0)
pitchfork = "2.29.0" # process manager for the daemons
# The shell the inline task scripts run under — `[task_config] shell = "nu -c"` below. A real
# shell with typed values, paths and error handling, so a task body is not a pile of POSIX
# incantations that only work on macOS and Linux. Pinned exactly: `latest` floats, and a task
# shell that shifts under you is a bad place to discover that.
nushell = "0.116.1"
# Secrets. `fnox exec -- <cmd>` is how anything needing credentials runs: `site:deploy`,
# and the R2 cross-checks in `repo:verify`.
#
# Declared here rather than left to the global mise config, where it was the only thing
# providing it — so a fresh clone on another machine had no fnox, and both of those paths
# would fail with a confusing error. Short form on purpose: mise maps `fnox` to
# `github:jdx/fnox`, which is the same resolution the global config gets.
fnox = "1.36.0"
"npm:skills" = "1.7.0" # Claude Code skills manager
# Linters + formatter — the same ones the emdash monorepo uses, at the same versions it has
# installed, so the ecosystem agrees on style AND the toolchain is known-good. Pinned here
# rather than in a root package.json, because this repo has no root package: mise [tools] is
# the toolchain.
#
# These three are version-coupled and must move together: oxlint --type-aware delegates to
# oxlint-tsgolint, and a mismatch panics at run time rather than failing cleanly (oxlint
# 1.86.0 + tsgolint 0.25.0 dies with `panic: unknown rule: no-generated-empty-object-type`).
# Versions below are read from .src/emdash/node_modules — the pair that works there.
"npm:oxlint" = "1.86.0"
"npm:oxfmt" = "0.71.0"
"npm:oxlint-tsgolint" = "7.0.2003"
# The sandboxed-plugin CLI (binary `emdash-plugin`). Scheduled here rather than borrowed from
# whichever plugin happens to have it in node_modules — that borrowing meant `plugin:login`,
# `plugin:whoami` and friends could not be ordinary tasks. Version matches what the plugins
# declare, so there is still exactly one CLI in the story.
"npm:@emdash-cms/plugin-cli" = "0.13.2"
# Every `run` body is nushell, not POSIX shell. mise's default is `sh -c`, which means a task
# written on macOS silently depends on bashisms, BSD flags and `test -f` — none of which hold on
# Windows. nushell is the same on every platform, gives structured data (`from json`, `where`,
# `parse`) instead of grep/sed pipelines, and fails loudly rather than carrying on.
#
# Single-command tasks are unaffected (`run = "mise daemons logs emdash --follow"` is valid nu).
# Anything multi-line uses nu syntax: `if $x { } else { }`, `let x = (cmd)`, `^cmd` to force an
# external binary. See the note on `run_windows` further down for the one platform-specific case.
[task_config]
shell = "nu --no-config-file -c"
# The CLI looks for a project root — a package.json — for commands like `migrate`, `schema` and
# `content`. The repo root has none; the SITE is the project, and it is also where `astro check`
# and a production build have to run. So it is the default here, once, instead of a `dir = ` line
# on every task that happens to call the CLI. A task that needs to run elsewhere overrides it
# (registry:* runs in the aggregator, plugin:init in plugins/).
dir = "{{config_root}}/.src/site"

[env]
# =============================================================================
# PROJECT SETTINGS — edit these for a different EmDash project.
#
# Everything else in this file is written against the two official CLIs and the official template
# layout, so it is generic: point these at your project and the flows work. Nothing below this
# block needs to know which site it is.
# =============================================================================

# Where this mise.toml lives.
ROOT = "{{config_root}}"

# Which official template to host — any directory in emdash-cms/templates.
TEMPLATE = "starter-cloudflare"

# The EmDash version to pin the site to. `site:install` writes exactly this into the site's
# package.json, for `emdash` and `@emdash-cms/cloudflare`.
EMDASH_VERSION = "1.1.0"

# Where `mise run deploy` ships, and what `deploy` then verifies.
DEPLOY_URL = "https://emdash-run.gedw99.workers.dev"

# The pitchfork daemon that runs the site — the name under [daemons.*] in this file.
SITE_DAEMON = "emdash"

# This project's hand-maintained seed: the source of truth for the content model. The template's
# demo seed is merged INTO it by `seed:build`, and an export is never written back over it.
SEED_FILE = "{{config_root}}/config/cad.seed.json"

# The code you own, for lint and formatting. Absolute, so it does not depend on a task's working
# directory; `:`-separated because an env var is a string.
CODE_PATHS = "{{config_root}}/plugins/plat-trunk/src:{{config_root}}/plugins/plat-trunk-sandboxed/src:{{config_root}}/plugins/plat-trunk-sandboxed/tests"

# What `repo:verify` asserts about the RUNNING site: a collection whose entries carry a field that
# names an object in an R2 bucket, and a stored snapshot of that object's manifest. The checks are
# generic — these four names are the only domain knowledge in them.
VERIFY_COLLECTION = "parts"
VERIFY_JOIN_FIELD = "model_id"
VERIFY_SNAPSHOT_FIELD = "geometry_meta"
VERIFY_BUCKET = "cad-documents"

# =============================================================================
# DERIVED — the layout below follows the official template; you should not need to change it.
# =============================================================================

# Gitignored working checkouts (see docs/plans/done/0007-emdash-1.1-templates-src-rework.md)
SRC_DIR = "{{config_root}}/.src"
TEMPLATES_DIR = "{{config_root}}/.src/templates" # clone of emdash-cms/templates
SITE_DIR = "{{config_root}}/.src/site"           # copy of $TEMPLATE — the host site (:4321)
SITE_URL = "http://localhost:4321"               # the host site as a URL — scripts read this, never a literal
EMDASH_DIR = "{{config_root}}/.src/emdash"       # optional emdash monorepo clone (on demand)

TEMPLATES_REPO = "https://github.com/emdash-cms/templates"
EMDASH_REPO = "https://github.com/emdash-cms/emdash"

# Local plugins under development — symlinked into the site's node_modules by plugin:link
PLUGINS_DIR = "{{config_root}}/plugins"

# Generated output, gitignored: the MCP token, site snapshots, and the temp files the nushell
# check writes.
RUN_DIR = "{{config_root}}/run"

# Optional daemons — the single place these addresses are defined. The daemons' `ready_http`
# reads them too, so a port is written down once.
REGISTRY_URL = "http://localhost:8788"
REGISTRY_PORT = "8788"
PLUGINS_SITE_URL = "http://localhost:4330"
PLUGINS_SITE_PORT = "4330"

# Point the site's plugin discovery at the LOCAL registry. build.mjs deletes this before
# site:build / site:deploy, so production uses the hosted registry.
EMDASH_REGISTRY_URL = "{{env.REGISTRY_URL}}"

# The EmDash CLI that ships with the host site — the same version the site runs, so the CLI and
# the instance cannot drift. On PATH so the emdash:* tasks ARE the official tool with no wrapper
# around them. (It cannot be a [tools] entry: mise's npm backend refuses a bare unscoped name.)
_.path = ["{{config_root}}/.src/site/node_modules/.bin"]
# (Re)generated by mcp:token-admin on every apply. The EmDash MCP server reads it.
#
# Deliberately NOT named EMDASH_TOKEN. The emdash CLI reads EMDASH_TOKEN as an auth source, and
# the token generated here belongs to the LOCAL site — exporting it under that name made every
# remote command send a local token to a deployment and fail with "Token is invalid or expired",
# which looked exactly like the CLI being unable to read its own stored login. Under its own
# name the variable reaches the MCP server (see .mcp.json) and nothing else.
_.file = "{{config_root}}/run/token-admin.env"
# -----------------------------------------------------------------------------

# =============================================================================
# QUICK REFERENCE — the flows. Everything else is a primitive they are built from.
# =============================================================================
#
#   mise run setup       first time here: clone the template, install, apply config, plugins, skills
#   mise run dev         every time: bring the site up on the current config, seed and plugins
#   mise run check       before a commit — lint, formatting, plugin checks
#   mise run deploy      ship it: build, deploy to Cloudflare, then VERIFY what is live
#   mise run snapshot    save the whole site — schema AND content — as a .emdash package
#   mise run doctor      diagnose: the site's database, the plugins, and the running site's state
#
# Against a deployment:  export EMDASH_URL=https://…  then `mise run check:deployed`
# URLs:                  mise run repo:urls          Admin UI:  mise run site:open
#
# Task bodies are NUSHELL, not POSIX sh — see the note in [tools]. `$env.VAR`, `^cmd` to force an
# external binary, and no `set -e`: a failing external command does not abort the body.
#
# `mise tasks ls` lists everything. This file is the source of truth — never keep a second copy.
# =============================================================================
#
# First time:      mise run site:setup && mise run repo:init && mise run repo:apply
# After a change:  mise run repo:apply          ← idempotent, and it IS the check
# Before a commit: mise run check               ← lint, format, tests, plugin checks
# Against a deploy: export EMDASH_URL=https://… ; mise run check:deployed
#
# URLs (once running):  mise run repo:urls
# Admin UI:  http://localhost:4321/_emdash/api/setup/dev-bypass?redirect=/_emdash/admin
#
# Writing a task: bodies are NUSHELL, not POSIX sh — see the note in [tools]. `$env.VAR`, commas
# between arguments, `^cmd` to force an external binary. There is no `set -e`; a failing external
# command does not abort the script, so check the one you care about.
#
# Targeting a deployment: the COMPOSED checks read `EMDASH_URL` (check:deployed, seed:from-remote,
# repo:verify). A single `emdash:*` task does NOT — it is the official CLI, so use its own flag:
#   mise run emdash:cli -- whoami --url https://my-site.workers.dev
#
# dev-bypass and NOT /login: passkeys live in the database, so site:reset invalidates
# every existing credential while the browser still caches it. dev-bypass skips passkey
# auth (DEV only) and runs migrations + seed.
#
# Full task list with descriptions:  mise tasks ls
# =============================================================================

# -----------------------------------------------------------------------------
# COMPOSED WORKFLOWS
# The jobs a developer actually does, each composed from primitives below. This is the
# point of the file: one command for one job, not a relay of a single CLI call.
# -----------------------------------------------------------------------------

[tasks."setup"]
description = "First time here: clone the template, install the site, apply our config, install the plugins, vendor the skills, then bring it up"
depends = ["site:setup", "repo:init"]
run = "mise run repo:apply"

[tasks."dev"]
description = "Start working — bring the site up on the current config, seed and plugins, then print where everything is"
depends = ["repo:apply"]
run = "mise run repo:urls"

[tasks."deploy"]
description = "Ship it — build, deploy to Cloudflare, then PROVE what is live matches the repo"
run = """
print "→ config and seed"
^mise run config:apply
print "→ build and deploy"
^mise run site:deploy
print "→ verify what is now live"
with-env { EMDASH_URL: $env.DEPLOY_URL } { ^mise run check:deployed }
"""

[tasks."snapshot"]
description = "Save the whole site — schema AND content — as a .emdash package (official: emdash site export)"
run = """
# The only backup that carries the content MODEL as well as the content: a seed cannot restore
# collections and fields, and `wrangler d1 export` refuses a database with FTS5 tables — which every
# EmDash site has. Set EMDASH_URL to snapshot a deployment instead of the local site.
let url = ($env.EMDASH_URL? | default "")
let extra = (if ($url | is-not-empty) { ["--url" $url] } else { [] })
let dest = $"($env.RUN_DIR)/snapshots/(date now | format date "%Y%m%d-%H%M%S").emdash"
mkdir ($dest | path dirname)
^emdash site export --output $dest ...$extra
print $"✓ saved → ($dest)"
print "  it carries every entry plus authors' email addresses — treat it like a database backup."
"""

[tasks."doctor"]
description = "Diagnose the lot — the site's database, the plugins' consistency, and whether the running site matches the repo"
depends = ["site:doctor", "plugin:audit"]
run = "mise run repo:verify"

[tasks."check"]
description = "Everything that must pass before a commit — lint, formatting, plugin checks"
depends = ["repo:check", "plugin:typecheck", "plugin:audit"]

[tasks."check:deployed"]
description = "The same checks against a DEPLOYMENT — export EMDASH_URL=https://… first (needs emdash:login)"
run = """
print "→ core migrations"
^mise run site:migrate
print "→ content model: repo vs deployed"
^mise run seed:from-remote
print "→ content, the model_id join, and snapshot drift"
^mise run repo:verify
"""

[tasks."release"]
description = "Everything a sandboxed-plugin release needs — audit + typecheck, then validate, build, bundle"
depends = ["plugin:audit", "plugin:typecheck"]
run = """
# No `&&` in nushell — and a failing external command does not abort the body either, so each step
# is checked. (`repo:nu` caught the `&&`; it had never been run.)
^mise run plugin:validate
if $env.LAST_EXIT_CODE != 0 { exit 1 }
^mise run plugin:build
if $env.LAST_EXIT_CODE != 0 { exit 1 }
^mise run plugin:bundle
if $env.LAST_EXIT_CODE != 0 { exit 1 }
"""

[tasks."content:set"]
description = "Set fields on a live entry: read its rev, update, print the result"
usage = """
arg "<collection>" help="Collection slug, e.g. parts"
arg "<entry>" help="Entry id or slug"
arg "<json>" help="Data to set, as a JSON object"
"""
run = """
let collection = $env.usage_collection
let entry = $env.usage_entry
# `content get` prints a banner before the JSON, so cut to the first brace and parse from there.
mut url = []
if ($env.EMDASH_URL? | is-not-empty) { $url = ['--url' $env.EMDASH_URL] }
let raw = (^emdash content get $collection $entry --json ...$url | complete).stdout
let body = ($raw | str substring ($raw | str index-of '{')..)
let rev = ($body | from json | get -o _rev | default '')
if ($rev | is-empty) {
  print $"✗ no _rev for ($collection)/($entry)"
  exit 1
}
print $"→ ($collection)/($entry) rev=($rev)"
^emdash content update $collection $entry $"--rev=($rev)" --data $env.usage_json ...$url
print "✓ updated"
"""

[tasks."schema:diff"]
description = "Diff the repo's content model against a live instance (set EMDASH_URL for a deployment)"
run = "mise run seed:from-remote"

# -----------------------------------------------------------------------------
# SRC — gitignored checkouts
# Cloned on demand; nothing here is committed.
# -----------------------------------------------------------------------------

[tasks."src:clone-templates"]
description = "Clone or update emdash-cms/templates into .src/templates"
run = """
mkdir $"($env.SRC_DIR)"
if ($"($env.TEMPLATES_DIR)/.git" | path exists) {
  ^git -C $env.TEMPLATES_DIR fetch --depth 1 origin main
  ^git -C $env.TEMPLATES_DIR checkout -q FETCH_HEAD
} else {
  ^git clone --depth 1 $env.TEMPLATES_REPO $env.TEMPLATES_DIR
}
print $"  ✓ templates @ (^git -C $env.TEMPLATES_DIR rev-parse --short HEAD | str trim)"
"""

[tasks."src:clone-emdash"]
description = "Clone or update the emdash monorepo at tag emdash@$EMDASH_VERSION into .src/emdash — on demand"
run = """
let tag = $"emdash@($env.EMDASH_VERSION)"
mkdir $"($env.SRC_DIR)"
if ($"($env.EMDASH_DIR)/.git" | path exists) {
  ^git -C $env.EMDASH_DIR fetch --depth 1 origin $"refs/tags/($tag)"
  ^git -C $env.EMDASH_DIR checkout -q FETCH_HEAD
} else {
  ^git clone --depth 1 --branch $tag $env.EMDASH_REPO $env.EMDASH_DIR
}
print $"  ✓ emdash @ ($tag) → ($env.EMDASH_DIR)"
"""
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# SITE — the host site, an official template copy on :4321
# -----------------------------------------------------------------------------

[tasks."site:setup"]
description = "One-time: clone templates → copy site → install → apply config"
depends = ["site:install", "config:apply"]
run = "echo '✓ setup done — run: mise run repo:init'"

[tasks."site:sync"]
description = "Copy $TEMPLATE into .src/site (pristine copy; drops the template's packageManager pin)"
depends = ["src:clone-templates"]
run = """
let src = $"($env.TEMPLATES_DIR)/($env.TEMPLATE)"
if not ($src | path exists) {
  print $"✗ template '($env.TEMPLATE)' not found in ($env.TEMPLATES_DIR)"
  print $"  available: (ls ($env.TEMPLATES_DIR) | get name | each {|p| $p | path basename } | str join ' ')"
  exit 1
}
# dest is removed first, so `cp -r` creates it AS a copy of the template rather than copying
# the template into it (which is what `cp -r` does when the destination already exists).
rm -rf ($env.SITE_DIR)
cp -r $src ($env.SITE_DIR)
# The template pins pnpm via packageManager; mise already provides that pnpm, so drop the pin
# and let pnpm stop trying to self-manage a second copy.
mut pkg = (open $"($env.SITE_DIR)/package.json")
if 'packageManager' in $pkg { $pkg = ($pkg | reject packageManager) }
$pkg | to json --indent 4 | save -f $"($env.SITE_DIR)/package.json"
print $"  ✓ site ← ($env.TEMPLATE)"
"""

[tasks."site:install"]
description = "Install site deps + the first-party plugins the site config registers"
depends = ["site:sync"]
run = """
^pnpm --dir ($env.SITE_DIR) install
# Pin the CMS exactly — the template ships floating ranges (emdash: ^1.0.1) that would
# otherwise drift on every install. `pnpm add --save-exact` still writes a caret here, so set
# the versions directly.
mut pkg = (open $"($env.SITE_DIR)/package.json")
$pkg.dependencies.emdash = $env.EMDASH_VERSION
$pkg.dependencies."@emdash-cms/cloudflare" = $env.EMDASH_VERSION
$pkg | to json --indent 4 | save -f $"($env.SITE_DIR)/package.json"
# First-party plugins the site config registers — declared here rather than hand-edited into
# the template, so template updates stay clean.
^pnpm --dir ($env.SITE_DIR) add @emdash-cms/plugin-forms @emdash-cms/plugin-webhook-notifier
# The template's tsconfig declares `types: ["node"]` but never depends on @types/node, so a
# strict (pnpm) install leaves the editor reporting "Cannot find type definition file for 'node'".
^pnpm --dir ($env.SITE_DIR) add -D @types/node
print $"  ✓ site deps installed — emdash@($env.EMDASH_VERSION)"
"""

[tasks."config:apply"]
description = "Write our config into .src/site — astro.config, wrangler.jsonc, the merged seed — then validate it"
run = """
if not ($"($env.SITE_DIR)/package.json" | path exists) {
  print "✗ .src/site is missing — run: mise run site:setup"
  exit 1
}
cp $"($env.ROOT)/config/site.astro.config.mjs" $"($env.SITE_DIR)/astro.config.mjs"
cp $"($env.ROOT)/config/site.wrangler.jsonc" $"($env.SITE_DIR)/wrangler.jsonc"
^mise run seed:build
^mise run seed:validate
print "  ✓ config applied to .src/site"
"""

[tasks."site:dev"]
description = "Run the site dev server on :4321 — called by pitchfork, do not run directly"
run = "pnpm dev"

# Astro 7 auto-backgrounds itself when it detects an agent / non-TTY parent
# (`isRunByAgent()`), which makes it exit and orphans the server so pitchfork cannot
# supervise it. ASTRO_DEV_BACKGROUND disables that detection and keeps it in the
# foreground. EMDASH_REGISTRY_URL points plugin discovery at the LOCAL registry while it
# runs; deliberately not set for site:build / site:deploy, so production uses the hosted one.
[tasks."site:dev".env]
ASTRO_DEV_BACKGROUND = "1"

[tasks."site:logs"]
description = "Follow live site logs"
run = "mise daemons logs emdash --follow"

[tasks."site:open"]
description = "Open admin UI in browser via dev-bypass (runs migrations + seed; skips passkey auth)"
run = """
let url = $"($env.SITE_URL)/_emdash/api/setup/dev-bypass?redirect=/_emdash/admin"
# No single cross-platform opener exists; nushell can at least dispatch on the one it is running on.
match $nu.os-info.name {
  "macos" => { ^open $url }
  "windows" => { ^cmd /c start "" $url }
  _ => { ^xdg-open $url }
}
"""

[tasks."site:check"]
description = "Typecheck the site — astro check (incl. that the config loads) + tsc --checkJs on astro.config.mjs. Stops and restarts the site"
run = """
# Two passes, because they cover different things and neither covers both:
#   `astro check`    the template's own .astro/.ts files. It also LOADS astro.config.mjs, so a
#                    config that throws on load fails here — which is the class that bit us.
#   `tsc --checkJs`  the TYPES of that same config, which `astro check` never inspects: it
#                    executes the config rather than analysing it.
# `--ignoreConfig` is required — the site has a tsconfig.json and tsc refuses to combine it with
# explicit file arguments.
#
# The daemon is stopped first and restarted afterwards: `astro check` re-runs the Vite optimizer
# inside .src/site, re-hashing the `deps_ssr/*?v=…` URLs a running server is already serving.
# Leaving a site that is up and broken is worse than a check that takes 30s.
let site = $env.SITE_DIR
let paused = (^mise run site:_pause | str trim)
print "→ astro check (the site, and that its config loads)"
^pnpm --dir $site exec astro check
let astro = $env.LAST_EXIT_CODE
print "→ tsc --checkJs astro.config.mjs (the types astro check does not see)"
^pnpm --dir $site exec tsc --noEmit --ignoreConfig --allowJs --checkJs --moduleResolution bundler --module esnext --target es2022 --skipLibCheck astro.config.mjs
let tsc = $env.LAST_EXIT_CODE
# Restarted regardless of the result, so a failing check does not also cost you the site.
^mise run site:_resume -- $paused
if $astro != 0 or $tsc != 0 { exit 1 }
"""

[tasks."site:doctor"]
description = "Diagnose the site's real D1 — database health and scheduler wiring (emdash doctor, pointed at the dev database)"
run = """
let db = (^mise run site:_devdb | str trim)
if ($db | is-empty) { exit 1 }
print $"  → diagnosing ($db | path relative-to $env.SITE_DIR)"
^emdash doctor -d $db
"""

[tasks."seed:build"]
description = "Merge the template's seed with ours → .src/site/seed/seed.json"
run = """
# Merge the template's demo seed with this repo's CAD seed.
#
# The rules are deliberately NOT uniform, and the asymmetry is the point:
#   collections / taxonomies          a collision goes to the TEMPLATE
#   content                           a collision goes to CAD — opposite, on purpose: the CAD seed
#                                     is this repo's reason to exist, and its ids are namespaced
#                                     (`parts:motor-housing`), so a real clash means a malformed seed
#   menus / widgetAreas / settings    the template's, falling back to CAD's
# Content order is dependency-first: entries carry `$ref:` values that must resolve to something
# already applied.
let base = (open $"($env.TEMPLATES_DIR)/($env.TEMPLATE)/seed/seed.json")
let cad = (open $env.SEED_FILE)

# Union two lists by key, with the template winning on collision. `upsert`, not `insert`: nushell
# errors when `insert` targets a column that already exists, which is exactly the collision case.
def union [cad_items: list, base_items: list, key: string] {
  mut acc = {}
  for item in $cad_items { $acc = ($acc | upsert ($item | get $key) $item) }
  for item in $base_items { $acc = ($acc | upsert ($item | get $key) $item) }
  $acc | values
}

let cad_content = ($cad | get -o content | default {})
let base_content = ($base | get -o content | default {})
let dep_order = ["projects" "assemblies" "parts"]
let keys = (
  $dep_order
  | append ($cad_content | columns | where {|k| not ($k in $dep_order) })
  | append ($base_content | columns)
  | uniq
)

mut content = {}
mut seen = []
for key in $keys {
  let entries = (
    ($cad_content | get -o $key | default [])
    | append ($base_content | get -o $key | default [])
  )
  mut kept = []
  for entry in $entries {
    let id = ($entry | get -o id)
    # Ids are namespaced already, so the id alone identifies an entry — the old composite key
    # (`parts:parts:motor-housing`) could not have caught a cross-collection duplicate.
    if ($id | is-empty) {
      $kept = ($kept | append $entry)
    } else if not ($id in $seen) {
      $seen = ($seen | append $id)
      $kept = ($kept | append $entry)
    }
  }
  $content = ($content | upsert $key $kept)
}

let base_meta = ($base | get -o meta | default {})
let cad_meta = ($cad | get -o meta | default {})
let site_name = ($base_meta | get -o name | default "Site")
let description = (
  [($base_meta | get -o description | default "") ($cad_meta | get -o description | default "")]
  | where {|part| $part | is-not-empty }
  | str join " — "
)
# `upsert` again rather than a spread plus an override: nushell rejects a record literal defining a
# field `...$base_meta` already supplied. These two are the only keys that override the template's.
let merged_meta = ($base_meta | upsert name $"($site_name) + CAD" | upsert description $description)

# Built key by key, in the same order the JavaScript wrote them. `'$schema'` is single-quoted
# because a double-quoted key would be interpolated as a variable.
let schema_uri = ($base | get -o '$schema' | default ($cad | get -o '$schema' | default ""))
let version = ($base | get -o version | default ($cad | get -o version | default "1"))
let settings = ($base | get -o settings | default ($cad | get -o settings | default {}))
let menus = ($base | get -o menus | default ($cad | get -o menus | default []))
let widget_areas = ($base | get -o widgetAreas | default ($cad | get -o widgetAreas | default []))
let collections = (union ($cad | get -o collections | default []) ($base | get -o collections | default []) "slug")
let taxonomies = (union ($cad | get -o taxonomies | default []) ($base | get -o taxonomies | default []) "name")

mut merged = {}
$merged = ($merged | insert '$schema' $schema_uri)
$merged = ($merged | insert version $version)
$merged = ($merged | insert meta $merged_meta)
$merged = ($merged | insert settings $settings)
$merged = ($merged | insert collections $collections)
$merged = ($merged | insert taxonomies $taxonomies)
$merged = ($merged | insert menus $menus)
$merged = ($merged | insert widgetAreas $widget_areas)
$merged = ($merged | insert content $content)

let dest = $"($env.SITE_DIR)/seed/seed.json"
mkdir ($dest | path dirname)
$merged | to json --indent 4 | save --force $dest
let total = ($content | values | each {|list| $list | length } | math sum)
print $"  ✓ seed → .src/site/seed/seed.json — ($content | columns | length) collections, ($total) entries"
"""

[tasks."seed:validate"]
description = "Validate the merged site seed — EmDash silently skips an invalid one"
run = "^emdash seed --validate seed/seed.json"

# `emdash seed <file>` writes a FILE database (`-d`, default `./data.db`), and the dev server does
# not read that file — it reads miniflare's D1 under `.wrangler/state/v3/d1`. So the default seeds
# nothing the site can see and still reports "✔ Seed applied successfully". Pointing `--database`
# at the real D1 is what makes it land; `--on-conflict=update` is what makes EDITS to existing
# entries land rather than being skipped.
[tasks."seed:apply"]
description = "Get the seed into the RUNNING dev site, in place — existing entries are UPDATED, nothing is wiped"
run = """
let db = (^mise run site:_devdb | str trim)
if ($db | is-empty) { exit 1 }
print $"→ emdash seed → ($db | path relative-to $env.SITE_DIR)  with on-conflict=update"
^emdash seed seed/seed.json --database $db --on-conflict=update
print "✓ seed applied — then: mise run repo:verify"
"""

[tasks."seed:export"]
description = "Export the running dev site's model + content as a seed (official: emdash export-seed)"
run = """
let db = (^mise run site:_devdb | str trim)
if ($db | is-empty) { exit 1 }
# Written to a SEPARATE file, never over $SEED_FILE: that one is hand-maintained and is
# the source of truth, so overwriting it with an export would turn a review into a replacement.
^emdash export-seed --database $db --with-content=all
  | save -f $"($env.ROOT)/config/seed.live.json"
print "✓ exported the live model → config/seed.live.json"
print $"  compare it with ($env.SEED_FILE | path relative-to $env.ROOT) — not written over it on purpose."
"""

[tasks."seed:from-remote"]
description = "Diff a live instance's content model against the repo's seed (read-only; set EMDASH_URL for a deployment)"
run = """
let listed = (^mise run emdash:_json -- "schema list --json" | from json)
# `schema list --json` returns a BARE ARRAY of collections — no envelope. (The `parsed.data ?? parsed`
# and `listed.items ?? listed.collections ?? listed` fallbacks in the script this replaces were both
# no-ops on an array, which is why they looked like they were doing something.) Accept either shape,
# so a future CLI that starts wrapping does not silently yield nothing.
let collection_rows = (
  if (($listed | describe) | str starts-with "record") {
    ($listed | get -o items | default ($listed | get -o collections | default []))
  } else {
    $listed
  }
)
let remote_slugs = ($collection_rows | each {|c| $c.slug })

mut remote = {}
for slug in $remote_slugs {
  let detail = (^mise run emdash:_json -- $"schema get ($slug) --json" | from json)
  let fields = (
    if (($detail | describe) | str starts-with "record") { $detail | get -o fields | default [] }
    else { [] }
  )
  for field in $fields {
    $remote = ($remote | insert $"($slug).($field.slug)" $field.type)
  }
}

let ours = (open $env.SEED_FILE)
let local_slugs = ($ours | get -o collections | default [] | each {|c| $c.slug })
mut local = {}
for collection in ($ours | get -o collections | default []) {
  for field in ($collection | get -o fields | default []) {
    $local = ($local | insert $"($collection.slug).($field.slug)" $field.type)
  }
}

# Immutable copies: nushell will not let a closure capture a `mut` binding, and the comparisons
# below are all closures.
let remote_map = $remote
let local_map = $local
let remote_keys = ($remote_map | columns)
let local_keys = ($local_map | columns)
let only_local = ($local_keys | where {|k| not ($k in $remote_keys) } | sort)
let only_remote = ($remote_keys | where {|k| not ($k in $local_keys) } | sort)
let type_diff = (
  $local_keys
  | where {|k| ($k in $remote_keys) and (($remote_map | get $k) != ($local_map | get $k)) }
  | sort
  | each {|k| $"($k): repo=($local_map | get $k) deployed=($remote_map | get $k)" }
)
let missing = ($local_slugs | where {|s| not ($s in $remote_slugs) })
let extra = ($remote_slugs | where {|s| not ($s in $local_slugs) })
let repo_only = (if ($missing | is-empty) { "none" } else { $missing | str join ", " })
let deploy_only = (if ($extra | is-empty) { "none" } else { $extra | str join ", " })

print $"  deployed: ($remote_slugs | length) collections, ($remote_keys | length) fields"
print $"  repo:     ($local_slugs | length) collections, ($local_keys | length) fields"
print $"  collections only in the repo:     ($repo_only)"
print $"  collections only deployed:        ($deploy_only)"

if ([$only_local $only_remote $type_diff] | any {|group| $group | is-not-empty }) {
  print ""
  print "  drift:"
  for k in $only_local { print $"    missing from the deployed site: ($k)" }
  for k in $only_remote { print $"    only on the deployed site:      ($k)" }
  for d in $type_diff { print $"    type differs:                   ($d)" }
  print ""
  print "  the deployed site is behind. Evolve it with `emdash schema` — not a seed."
} else {
  print ""
  print "  ✓ the deployed content model matches the repo's seed"
}
"""

[tasks."site:reset"]
description = "⚠ Wipe local D1/miniflare state (loses all content) — then run: mise run repo:apply"
run = """
rm -rf $"($env.SITE_DIR)/.wrangler/state"
print "Done — run: mise run repo:apply"
"""

[tasks."site:clean"]
description = "⚠ Wipe .src/site — then run: mise run site:setup → init → apply"
run = """
^mise daemons stop $env.SITE_DAEMON | complete | ignore
rm -rf ($env.SITE_DIR)
print "✓ Wiped .src/site — run: mise run site:setup"
"""

[tasks."site:regen"]
description = "⚠ Wipe all of .src (templates + site) and re-clone templates"
run = """
^mise daemons stop -a | complete | ignore
rm -rf ($env.SRC_DIR)
^mise run src:clone-templates
print "✓ Wiped .src — run: mise run site:setup → init → apply"
"""
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# REPO — this repo's own hygiene
# -----------------------------------------------------------------------------

[tasks."repo:init"]
description = "One-time init after site:setup — plugin deps + skills"
depends = ["plugin:install-all", "skills:add-all"]
run = "print '✓ init done — run: mise run repo:apply'"

[tasks."repo:apply"]
description = "Apply config, rebuild + link plugins, re-seed, restart the site, refresh the token — run after every change"
depends = [
  "config:apply",
  "plugin:build",
  "plugin:link",
  "plugin:typecheck",
  "plugin:audit",
  "skills:sync",
]
run = """
# Stop ONLY the site: the optional daemons (registry, plugins-site) must survive, because the
# site's plugin discovery points at the local registry while it is running.
^mise daemons stop $env.SITE_DAEMON | complete | ignore
# The Vite optimizer re-hashes chunks whenever the dependency graph changes (a plugin's admin
# module, a production build in the same dir), leaving the server serving stale `deps_ssr/*?v=…`
# URLs and returning 500s.
rm -rf $"($env.SITE_DIR)/node_modules/.vite"
# pitchfork waits for the daemon's ready_http (see [daemons]) before returning.
^mise daemons start $env.SITE_DAEMON
# dev-bypass also runs migrations, so poll it until it answers before seeding or minting the
# MCP token. It applies the seed itself, but with skip-on-conflict — an entry that already
# exists is left alone — so it picks up NEW seed content and never EDITS existing content.
# seed:apply below is what makes edits land, via `emdash seed --on-conflict=update`.
print "⏳ waiting for the site to be ready..."
mut ready = false
for _ in 1..60 {
  if (^curl -fsS -o /dev/null -X POST $"($env.SITE_URL)/_emdash/api/setup/dev-bypass" | complete).exit_code == 0 {
    $ready = true
    break
  }
  sleep 1sec
}
if not $ready { print "⚠ the site did not answer within 60s — continuing anyway" }
^mise run seed:apply
^mise run mcp:token-admin
print $"→ admin:  ($env.SITE_URL)/_emdash/api/setup/dev-bypass?redirect=/_emdash/admin"
print "→ mcp:    run/token-admin.txt holds the bearer token for /_emdash/api/mcp"
print "✓ apply done"
"""

[tasks."repo:urls"]
description = "Print every URL this project serves"
run = """
print "Host site"
print $"  admin      ($env.SITE_URL)/_emdash/api/setup/dev-bypass?redirect=/_emdash/admin"
print $"  mcp        ($env.SITE_URL)/_emdash/api/mcp — Bearer: run/token-admin.txt"
print ""
print "Optional daemons — start with: mise run registry:up / mise run plugins-site:up"
print $"  registry   ($env.REGISTRY_URL)/health — JSON API under /xrpc/com.emdashcms.experimental.aggregator.*"
print "             note: / 308-redirects to https://plugins.emdashcms.com/ — there is no local page"
print $"  plugins UI ($env.PLUGINS_SITE_URL)/"
print ""
print $"Live         ($env.DEPLOY_URL)"
"""

[tasks."repo:verify"]
description = "Assert the running site matches what the repo claims (set EMDASH_URL to check a deployment instead) — content, the model_id join, and snapshot drift against real R2 objects"
run = '''
# Every check here exists because the opposite happened and nothing said so: the seed pointed at
# model paths that exist in no bucket; brep_file / step_file were declared on every entry and null
# on every entry; `emdash seed` printed success into a database the site never reads.
#
# plugin:audit checks the FILES are coherent. This checks the LIVE state agrees with them, which is
# the part that was missing: every file can be right while the running site is wrong.
#
# The R2 checks are the centrepiece — they follow each part's model_id to the real object in the
# geometry bucket and compare it against the stored snapshot. That is what would have caught the
# fiction on its first run rather than six commits later.
# A credential from fnox, the single source of truth. The ambient environment wins, so a caller
# already inside `fnox exec` pays nothing. `printenv` takes the NAME as an argument, which avoids
# building a shell string with a `$` in it. Empty rather than fatal: a missing credential is a
# finding to report, not a crash.
def secret [name: string] {
  let ambient = ($env | get -o $name)
  if ($ambient | is-not-empty) { $ambient } else {
    let result = (^fnox exec -- printenv $name | complete)
    if $result.exit_code == 0 { $result.stdout | str trim } else { "" }
  }
}

def report [ok: bool, label: string, detail: string] {
  let glyph = (if $ok { "✓" } else { "✗" })
  let suffix = (if ($detail | is-empty) { "" } else { $" — ($detail)" })
  print $"  ($glyph) ($label)($suffix)"
}

let site_url = $env.SITE_URL
let account = (secret "CLOUDFLARE_ACCOUNT_ID")
let token = (secret "CLOUDFLARE_API_TOKEN")
let bucket = $env.VERIFY_BUCKET
mut checks = []

# ── 1. the site answers at all ───────────────────────────────────────────────
# Retried on purpose: config:apply writes files Vite watches (astro.config.mjs, wrangler.jsonc,
# seed/seed.json), so the dev server restarts underneath you and a verify straight afterwards races
# it. One attempt reports "fetch failed" for what is really "not ready yet" — a false alarm that
# teaches people to ignore the check. The site binds IPv6-only, so localhost is the right host.
mut status = ""
for _ in 0..40 {
  let probe = (^curl -sS -o /dev/null -w "%{http_code}" --max-time 2 $site_url | complete)
  if $probe.exit_code == 0 {
    $status = ($probe.stdout | str trim)
    break
  }
  sleep 500ms
}
if ($status | is-empty) or (($status | into int) >= 500) {
  let detail = (if ($status | is-empty) { "no response, gave up after 20s" } else { $status })
  report false "site responds" $detail
  print ""
  print "✗ the site is not up — run: mise run repo:apply"
  exit 1
}
report true "site responds" $status
$checks = ($checks | append true)

# ── 2. read the content through the official CLI ─────────────────────────────
# This used to fetch the raw API endpoint with a token read out of run/token-admin.txt. `emdash
# content list` is the documented way to read content from an instance and it resolves auth itself,
# so the raw endpoint and the hand-held token both went.
mut parts = []
mut data_ok = false
try {
  let listed = (^mise run emdash:_json -- $"content list ($env.VERIFY_COLLECTION) --json" | from json)
  # `content list` is SLIM — it carries no `data` — so each entry is fetched with `content get`.
  # That matters more than it looks: given only the slim list every part has no data, so nothing
  # resolved and nothing mismatched, and the R2 checks PASSED VACUOUSLY. A check that passes
  # because it read nothing is worse than one that fails, hence this guard.
  $parts = (($listed | get -o items | default []) | each {|item|
    ^mise run emdash:_json -- $"content get parts ($item.slug) --json" | from json
  })
  let fetched = $parts
  let with_data = ($fetched | where {|part| ($part | get -o data) | is-not-empty } | length)
  $data_ok = ($with_data == ($fetched | length)) and ($with_data > 0)
  report $data_ok "content get returns data" $"($with_data) of ($fetched | length) entries"
} catch {|err|
  report false "content get returns data" $err.msg
}
$checks = ($checks | append $data_ok)

let parts_final = $parts
if ($parts_final | is-not-empty) {
  if ($account | is-empty) or ($token | is-empty) {
    let missing = (if ($account | is-empty) { "CLOUDFLARE_ACCOUNT_ID" } else { "CLOUDFLARE_API_TOKEN" })
    report false "R2 cross-check" $"cannot run, ($missing) is unset"
    $checks = ($checks | append false)
  } else {
    let limit = ($env.VERIFY_MODEL_LIMIT? | default "5" | into int)
    let samples = ($parts_final | first $limit)

    let missing_join = (
      $parts_final
      | where {|part| ($part | get -o data | default {} | get -o $env.VERIFY_JOIN_FIELD) | is-empty }
      | each {|part| $part.slug }
    )
    let join_ok = ($missing_join | is-empty)
    let join_detail = (if $join_ok { $"($parts_final | length) parts" } else { $missing_join | str join ", " })
    report $join_ok $"every ($env.VERIFY_COLLECTION) entry declares a ($env.VERIFY_JOIN_FIELD)" $join_detail
    $checks = ($checks | append $join_ok)

    mut unresolved = []
    mut drift = []
    for part in $samples {
      let id = ($part | get -o data | default {} | get -o $env.VERIFY_JOIN_FIELD)
      if ($id | is-empty) { continue }
      let body = (mktemp)
      let url = $"https://api.cloudflare.com/client/v4/accounts/($account)/r2/buckets/($bucket)/objects/models/($id)/manifest.json"
      let code = (
        ^curl -sS -o $body -w "%{http_code}" -H $"Authorization: Bearer ($token)" $url
        | complete
        | get stdout
        | str trim
      )
      if (($code | into int) >= 400) {
        $unresolved = ($unresolved | append $"($id) ($code)")
        continue
      }
      let manifest = (open $body | from json)
      let snapshot = ($part | get -o data | default {} | get -o $env.VERIFY_SNAPSHOT_FIELD | default {})
      # The snapshot must equal the live manifest, field for field. Drift means the entry describes
      # a model that has since changed — or never matched at all.
      let pairs = [
        ["model_name" ($manifest | get -o name)]
        ["objects" ($manifest | get -o objectCount)]
        ["model_version" ($manifest | get -o version)]
        ["model_updated" ($manifest | get -o updatedAt)]
      ]
      for pair in $pairs {
        let key = ($pair | first)
        let live = ($pair | last)
        let stored = ($snapshot | get -o $key)
        if ($stored != $live) {
          $drift = ($drift | append $"($part.slug)/($id): ($key) is ($stored), live is ($live)")
        }
      }
    }

    let resolve_ok = ($unresolved | is-empty)
    let resolve_detail = (if $resolve_ok { $"($samples | length) models" } else { $unresolved | str join ", " })
    report $resolve_ok $"($env.VERIFY_JOIN_FIELD) resolves in ($bucket)" $resolve_detail
    $checks = ($checks | append $resolve_ok)

    let drift_ok = ($drift | is-empty)
    let drift_detail = (if $drift_ok { $"($samples | length) models" } else { $drift | first 6 | str join "; " })
    report $drift_ok "stored snapshot matches the live manifest" $drift_detail
    $checks = ($checks | append $drift_ok)
  }
}

let checks_final = $checks
let failed = ($checks_final | where {|result| not $result } | length)
print ""
if $failed > 0 {
  print $"✗ repo:verify failed — ($failed) of ($checks_final | length) checks"
  exit 1
}
print $"✓ repo:verify passed — ($checks_final | length) checks"
'''

[tasks."repo:nu"]
description = "Parse and type-check every task body with nushell's own checker — a broken body should fail here, not when someone runs it"
run = """
# nushell can check itself: `nu --ide-check <limit> <file>` reports parse errors, type mismatches
# and unknown variables as `diagnostic` entries. (Entries of type `hint` are just inferred types —
# ignore them.) Externals are not resolved, so `^cmd` and a bare `pnpm` produce no false alarm.
#
# Each body is written to a file and checked, because a body only ever lives inside mise.toml and
# is otherwise not parsed until it runs. This is the check that catches the `(text)`-inside-an-
# interpolated-string bug at commit time: `(s)` reads as a variable, so `problem(s)` is a static
# "Variable not found" instead of a failure at 2am.
#
# `par-each`, because each check is a separate `nu` process and there are ~120 of them: serially
# this was ~6s of process spawns, and the work is embarrassingly parallel. Each iteration gets its
# own scratch file so the parallel branches cannot collide.
let cfg = (open $"($env.ROOT)/mise.toml")
let scratch = $"($env.RUN_DIR)/nucheck"
rm -rf $scratch
mkdir $scratch
let bodies = (
  $cfg.tasks
  | columns
  | each {|name| {name: $name, body: ($cfg.tasks | get $name | get -o run | default "")} }
  | where {|task| $task.body | is-not-empty }
)
let problems = (
  $bodies
  | enumerate
  | par-each {|item|
    let file = $"($scratch)/($item.index).nu"
    $item.item.body | save --force $file
    (^nu --ide-check 200 $file | complete).stdout
    | lines
    | where {|line| $line | str starts-with '{' }
    | each {|line| $line | from json }
    | where {|diag| ($diag | get -o type) == "diagnostic" }
    | each {|diag| $"($item.item.name): ($diag | get -o message)" }
  }
  | flatten
)
rm -rf $scratch
if ($problems | is-not-empty) {
  # `error make`, not `print` + `exit`: nushell formats it, and it is a real failure rather than
  # something that looks like output.
  # `msg` only: a `label` needs a `span`, and a bare one is rejected with "missing required
  # columns". The detail goes in the message.
  error make {
    msg: $"nushell rejected ($problems | length) of ($bodies | length) task bodies:
($problems | str join (char nl))"
  }
}
print $"  ✓ ($bodies | length) task bodies parse and type-check"
"""

[tasks."pre-commit"]
description = "What the git pre-commit hook runs. mise passes the staged files as STAGED"
run = "mise run check"

[tasks."repo:hooks"]
description = "Point git at the committed hooks in .githooks — run once per clone"
run = """
# Committed hooks, not .git/hooks: a hook that only exists on one machine is a hook nobody else
# has. `mise generate git-pre-commit` produces the file; this points git at it.
^git -C $env.ROOT config core.hooksPath .githooks
print "  ✓ core.hooksPath = .githooks — the checks now run on every commit"
"""

[tasks."repo:docs"]
description = "Fail if docs/tasks.md has drifted from the tasks — it is generated, never hand-edited"
run = """
# Generated from this file by mise (`mise generate task-docs`), so it cannot become a second copy
# that drifts: this fails unless regenerating produces exactly what is committed. It is the task
# reference a newcomer reads, and it is the reason no hand-written task list exists anywhere.
let generated = (^mise --cd $env.ROOT generate task-docs | complete).stdout
let committed = (open --raw $"($env.ROOT)/docs/tasks.md")
if ($generated | str trim) != ($committed | str trim) {
  print "✗ docs/tasks.md is out of date — run: mise run repo:docs:write"
  exit 1
}
print "  ✓ docs/tasks.md matches the tasks"
"""

[tasks."repo:docs:write"]
description = "Regenerate docs/tasks.md from the tasks — the fix for a failing repo:docs"
# `--cd` because tasks run in .src/site, where `--output docs/tasks.md` would write to the wrong tree.
run = "^mise --cd $env.ROOT generate task-docs --output docs/tasks.md"

[tasks."repo:sync"]
description = "Fail if a daemon in [daemons] names a task that does not exist — mise does not check this"
run = """
# Every daemon's `run` is `mise run <task>`, and mise does NOT check the task exists — `mise tasks
# run, and every one of its `run` lines is `mise run <task>`. A name there that is not a task here
# is a daemon that cannot start — which is exactly how the registry's web UI sat broken, running a
# task nobody had written. Both files carry a note about this at the top; this is the enforcement.
let refs = (
  (open $"($env.ROOT)/mise.toml")
  | get -o daemons
  | default {}
  | values
  | each {|daemon| $daemon | get -o run | default "" }
  | where {|cmd| $cmd | str starts-with "mise run " }
  | each {|cmd| $cmd | str replace "mise run " "" | split row " " | first }
  | uniq
)
mut missing = []
for ref in $refs {
  if (^mise tasks info $ref | complete).exit_code != 0 { $missing = ($missing | append $ref) }
}
if ($missing | is-not-empty) {
  print $"✗ [daemons] names tasks that do not exist: ($missing | str join ', ')"
  exit 1
}
print $"  ✓ all ($refs | length) daemon tasks exist"
"""

[tasks."repo:check"]
description = "Lint and formatting over the plugins, that the committed skills match the site's, and that the files which must agree have not drifted"
run = """
# The same tools and flags the emdash monorepo uses, taken from mise [tools] because this repo has
# no root package.json. `--deny-warnings` is what makes a warning mean something rather than scroll
# past. Targets are explicit rather than `.`: oxfmt also rewrites TOML and Markdown, and prose
# (docs/) and generated files gain nothing from that except unreviewable diffs.
let targets = ($env.CODE_PATHS | split row ":")
print "→ oxlint --type-aware --deny-warnings"
^oxlint --type-aware --deny-warnings ...$targets
let lint = $env.LAST_EXIT_CODE
print "→ oxfmt --check"
^oxfmt --check ...$targets
let fmt = $env.LAST_EXIT_CODE
print "→ skills:check (the committed EmDash skills match the site's)"
^mise run skills:check
let skills = $env.LAST_EXIT_CODE
print "→ repo:sync (the files that must agree)"
^mise run repo:sync
let sync = $env.LAST_EXIT_CODE
print "→ repo:nu (every task body parses and type-checks)"
^mise run repo:nu
let nucheck = $env.LAST_EXIT_CODE
print "→ mise tasks validate (mise's own checks on the task definitions)"
^mise tasks validate
let tasks_ok = $env.LAST_EXIT_CODE
print "→ mise fmt --check (mise.toml is formatted by mise's own formatter)"
^mise --cd $env.ROOT fmt --check
let misefmt = $env.LAST_EXIT_CODE
print "→ repo:docs (docs/tasks.md is what the tasks actually are)"
^mise run repo:docs
let docs_ok = $env.LAST_EXIT_CODE
# There is no `set -e` in nushell: a failing external command does not abort the script, so every
# one of them is collected and the task fails if any did. Running them all also shows you every
# problem at once instead of stopping at the first.
if ([$lint $fmt $skills $sync $nucheck $tasks_ok $misefmt $docs_ok] | any {|code| $code != 0 }) { exit 1 }
"""

[tasks."repo:format"]
description = "Apply formatting to the plugins — the fix for a failing repo:check"
run = """
# mise formats its own config — oxfmt does not touch TOML, so `mise.toml` went unchecked.
^mise --cd $env.ROOT fmt
^oxfmt ...($env.CODE_PATHS | split row ":")
exit $env.LAST_EXIT_CODE
"""

# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# MCP — tokens for the EmDash MCP server
# -----------------------------------------------------------------------------

[tasks."mcp:token-admin"]
description = "Create admin MCP token → run/token-admin.txt + run/token-admin.env"
run = """
let base = $env.SITE_URL
^mise run mcp:_login
let jar = $"($env.RUN_DIR)/.mcp-cookies"
let api = [$"-b" $jar "-H" "X-EmDash-Request: 1" "-H" "content-type: application/json"]
# Idempotent, because this runs on every `repo:apply`: an old token with this name is revoked
# first. EmDash shows a token's secret only once, so re-creating is the only way to get one back.
let listed = (^curl -sS ...$api $"($base)/_emdash/api/admin/api-tokens" | from json)
for old in ($listed.data.items | default [] | where name == "token-admin") {
  ^curl -sS -o /dev/null -X DELETE ...$api $"($base)/_emdash/api/admin/api-tokens/($old.id)"
  print $"→ revoked the previous ($old.name)"
}
let created = (
  ^curl -sS -X POST ...$api -d '{"name":"token-admin","scopes":["admin"]}'
    $"($base)/_emdash/api/admin/api-tokens"
  | from json
)
let token = ($created.data.token? | default "")
if ($token | is-empty) {
  print $"✗ token creation failed: ($created | to json --raw)"
  exit 1
}
$"($token)(char nl)" | save -f $"($env.RUN_DIR)/token-admin.txt"
# _.file loads this into the environment for the EmDash MCP server (as EMDASH_MCP_TOKEN).
$"EMDASH_MCP_TOKEN=($token)(char nl)" | save -f $"($env.RUN_DIR)/token-admin.env"
print "✓ Token saved → run/token-admin.txt"
"""

[tasks."mcp:clean-tokens"]
description = "Revoke every API token from the local database (the token file is regenerated by repo:apply)"
run = """
let base = $env.SITE_URL
^mise run mcp:_login
let jar = $"($env.RUN_DIR)/.mcp-cookies"
let api = [$"-b" $jar "-H" "X-EmDash-Request: 1"]
let items = (^curl -sS ...$api $"($base)/_emdash/api/admin/api-tokens" | from json | get -o data.items | default [])
if ($items | is-empty) { print "No API tokens to revoke."; exit 0 }
print $"→ revoking ($items | length) tokens…"
for tok in $items {
  ^curl -sS -o /dev/null -X DELETE ...$api $"($base)/_emdash/api/admin/api-tokens/($tok.id)"
  print $"  ✓ ($tok.name)"
}
print "✓ revoked — run: mise run mcp:token-admin"
"""
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# DEPLOY — Cloudflare
# -----------------------------------------------------------------------------

# EmDash's own CORE migrations — NOT our collections and fields, which the docs are explicit are
# never managed this way ("Core migrations do not add or remove your collections, fields, or
# taxonomies"). Reads the DEPLOYED D1 and needs no admin token: it authenticates with the
# Cloudflare credentials (fnox) rather than the site's API. Read-only — `--status` applies nothing.
# The database name comes from the wrangler config, so a rename cannot silently point this
# somewhere else.
[tasks."site:migrate"]
description = "Report EmDash CORE migration status for the DEPLOYED D1 (read-only, Cloudflare creds via fnox — no admin token)"
run = '''
let raw = (open --raw $"($env.ROOT)/config/site.wrangler.jsonc")
let hits = ($raw | parse --regex '"database_name"\s*:\s*"(?<name>[^"]+)"')
if ($hits | is-empty) {
  print "✗ no d1_databases[].database_name in config/site.wrangler.jsonc"
  exit 1
}
let name = ($hits | get name | first)
print $"  → migration status for the deployed D1: ($name)"
^fnox exec -- emdash migrate --status --d1 $name
'''

# `site:_deploy` is the shared body: a production build in .src/site re-runs the Vite optimizer
# and re-hashes the `deps_ssr/*?v=…` URLs the RUNNING dev server is already serving. Clearing the
# on-disk caches is not enough — the server holds the stale module graph in memory and starts
# returning 500s — so it is stopped first and put back afterwards.
[tasks."site:_deploy"]
hide = true
usage = 'arg "<mode>" help="build | deploy-dry | deploy"'
run = """
let mode = $env.usage_mode
# A production build must use the HOSTED registry, so drop the dev override set in [env].
hide-env EMDASH_REGISTRY_URL
let site = $env.SITE_DIR
let paused = (^mise run site:_pause | str trim)
let rc = (match $mode {
  "build" => {
    ^pnpm --dir $site build
    $env.LAST_EXIT_CODE
  }
  "deploy-dry" => {
    ^pnpm --dir $site build
    let built = $env.LAST_EXIT_CODE
    if $built == 0 { ^pnpm --dir $site exec wrangler deploy --dry-run --outdir dist }
    if $built == 0 { $env.LAST_EXIT_CODE } else { $built }
  }
  _ => {
    # Cloudflare creds come from fnox (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID).
    ^fnox exec -- pnpm --dir $site run deploy
    $env.LAST_EXIT_CODE
  }
})
# A production build leaves .vite/.astro in a state `astro dev` cannot reuse, so clean up either way.
rm -rf $"($site)/node_modules/.vite"
rm -rf $"($site)/.astro"
^mise run site:_resume -- $paused
if $rc != 0 { exit $rc }
print "→ dev server needs a restart: mise run repo:apply"
"""

[tasks."site:build"]
description = "Production-build the site (astro build → .src/site/dist)"
depends = ["config:apply"]
run = "mise run site:_deploy -- build"

[tasks."site:deploy-dry"]
description = "Validate the production build + Worker bundle without deploying"
depends = ["config:apply"]
run = "mise run site:_deploy -- deploy-dry"

[tasks."site:deploy"]
description = "Build + deploy the site to Cloudflare (creds via fnox)"
depends = ["config:apply"]
run = "mise run site:_deploy -- deploy"
# PLUGIN — the emdash-plugin CLI
# Singular takes a name; plural sweeps every plugin. The two CLIs differ: `plugin:*` below
# line up with `emdash-plugin`; site-side commands are under emdash:.
# -----------------------------------------------------------------------------

[tasks."plugin:new"]
description = "Scaffold a new sandboxed plugin, then install and validate it"
usage = """
arg "<name>" help="New plugin name"
"""
run = """
let name = $env.usage_name
print "→ scaffold"
^mise run plugin:init -- $name
print "→ dependencies"
^mise run plugin:install -- $name
print "→ validate the generated manifest"
^mise run plugin:validate -- $name
print $"✓ ($name) is ready — try: mise run plugin:dev -- ($name)"
"""

[tasks."plugin:dev"]
description = "Watch a plugin's sources and rebuild on change (official emdash-plugin dev)"
usage = '''
arg "<plugin>" help="Plugin directory name under plugins/"
'''
run = """
^mise run plugin:_require -- $env.usage_plugin
let dir = $"($env.PLUGINS_DIR)/($env.usage_plugin)"
# Must run IN the plugin being watched.`
^pnpm --dir $dir exec emdash-plugin dev
"""

[tasks."plugin:check"]
description = "Validate, typecheck and audit every plugin — the plugin half of `mise run check`"
depends = ["plugin:audit", "plugin:typecheck", "plugin:validate"]

[tasks."plugin:install"]
description = "Install deps for one plugin"
usage = 'arg "<plugin>" help="Plugin directory name under plugins/"'
run = """
^mise run plugin:_require -- $env.usage_plugin
let dir = $"($env.PLUGINS_DIR)/($env.usage_plugin)"
print $"→ pnpm install in ($env.usage_plugin)"
^pnpm --dir $dir install
"""

[tasks."plugin:install-all"]
description = "Install deps for all plugins in plugins/"
wait_for = ["site:setup"]
sources = ["plugins/*/package.json"]
outputs = ["plugins/*/node_modules/.modules.yaml"]
run = """
for dir in (^mise run plugin:_dirs | from json) {
  print $"→ pnpm install in ($dir | path basename)"
  ^pnpm --dir $dir install
}
"""

[tasks."plugin:link"]
description = "Symlink all local plugins into the site's node_modules so the dev server can load them"
run = """
# Plugins live in plugins/ but the site resolves them from its own node_modules, so they are
# symlinked in — which keeps edits live with no rebuild step.
let node_modules = $"($env.SITE_DIR)/node_modules"
mkdir $node_modules
let dirs = (^mise run plugin:_dirs | from json)
for dir in $dirs {
  let pkg = ((open $"($dir)/package.json") | get -o name | default ($dir | path basename))
  let dest = $"($node_modules)/($pkg)"
  ^mise run fs:_link -- $dir $dest
  print $"  ✓ linked ($pkg)"
}
"""

# The four sweep tasks below are one idea — "run each plugin's own <script>, skipping plugins that
# do not declare it, so a native plugin is skipped rather than failed". It lives here once instead
# of four times.
#
# `build` is not optional before `link`: a sandboxed plugin's `./sandbox` export points at its
# built bundle, so linking without building leaves the site importing a file that is not there.
# See docs/plugin.md.
[tasks."plugin:_sweep"]
hide = true
usage = '''
arg "<script>" help="Plugin script to run, in every plugin that declares it"
arg "[plugin]" help="Restrict to one plugin directory (default: every plugin)"
'''
run = """
let script = $env.usage_script
let only = $env.usage_plugin?
let dirs = (
  (^mise run plugin:_dirs | from json)
  | where {|p| ($only | is-empty) or (($p | path basename) == $only) }
)
mut ran = 0
for dir in $dirs {
  let manifest = (open $"($dir)/package.json")
  if ($manifest | get -o scripts | default {} | get -o $script | is-not-empty) {
    print $"→ ($script) ($manifest.name)"
    ^pnpm --dir $dir run $script
    $ran = $ran + 1
  }
}
if $ran == 0 {
  print $"✗ no plugin declares a ($script) script — see docs/plugin.md"
  exit 1
}
"""

[tasks."plugin:build"]
description = "Build every plugin that declares a build script (sandboxed bundles)"
run = "mise run plugin:_sweep -- build"

[tasks."plugin:validate"]
description = "Validate plugin manifests (sandboxed plugins only)"
run = "mise run plugin:_sweep -- validate"

[tasks."plugin:bundle"]
description = "Bundle a plugin for release — e.g: mise run plugin:bundle -- <name>"
run = "mise run plugin:_sweep -- bundle"

[tasks."plugin:typecheck"]
description = "Typecheck every plugin that declares a typecheck script"
run = "mise run plugin:_sweep -- typecheck"

[tasks."plugin:test"]
description = "Run each plugin's own tests — the plugin half of repo:test"
run = "mise run plugin:_sweep -- test"

[tasks."plugin:audit"]
description = "Structural checks across plugins/ — phantom scripts, unbuilt sandbox bundles, emdash drift, empty allowedHosts"
run = '''
# Every rule here encodes a bug that was found by hand, and each one presented as "the feature is
# broken" when the real fault was a file describing a setup that did not exist:
#
#   1. A script the toolchain can never run — the native plugin declared validate/build/bundle/test
#      pointing at the sandboxed CLI while having no manifest. Unrunnable for months; it only
#      surfaced when a sweep tried to run one.
#   2. A sandboxed plugin whose `./sandbox` entry has not been built. The descriptor names a built
#      bundle as its entrypoint, so linking without building leaves the site importing a file that
#      is not there.
#   3. A plugin pinned to a different `emdash` than the site runs — the scaffold asked for 0.x and
#      installed 0.42.0 while the site ran 1.1.0, so its passing test proved nothing about the site.
#   4. `network:request` with nothing to allow. The bundle-time check rejects it, so failing here
#      just fails earlier, with a better message.
#
# The manifest is read as TEXT with regexes rather than parsed: this is a lint, and
# `emdash-plugin validate` remains the authority on whether a manifest is valid.
def version_at [path: string] {
  if ($path | path exists) { open $path | get -o version } else { null }
}
let site_emdash = (version_at $"($env.SITE_DIR)/node_modules/emdash/package.json")
let dirs = (^mise run plugin:_dirs | from json)
mut failures = []

for abs in $dirs {
  let manifest = (open $"($abs)/package.json")
  let label = ($manifest | get -o name | default ($abs | path basename))
  let has_manifest = ($"($abs)/emdash-plugin.jsonc" | path exists)

  # 1. a script the toolchain cannot run.
  if not $has_manifest {
    for name in (($manifest | get -o scripts | default {}) | columns) {
      let command = ($manifest | get -o scripts | get $name)
      if ($command | str contains "emdash-plugin") {
        $failures = ($failures | append $"($label): script ($name) runs emdash-plugin but the plugin has no emdash-plugin.jsonc — it can never succeed")
      }
    }
  }

  # 2. the sandbox bundle has not been built.
  let entry = ($manifest | get -o exports | default {} | get -o './sandbox')
  let relative = (
    if ($entry | describe | str starts-with "string") { $entry }
    else if ($entry | is-empty) { null }
    else { $entry | get -o import | default ($entry | get -o default) }
  )
  if $has_manifest and ($relative | is-not-empty) and (not ($"($abs)/($relative)" | path exists)) {
    $failures = ($failures | append $"($label): exports ./sandbox to ($relative), which does not exist — run: mise run plugin:build")
  }

  # 3. emdash drift from the site.
  let pinned = (version_at $"($abs)/node_modules/emdash/package.json")
  if ($site_emdash | is-not-empty) and ($pinned | is-not-empty) and ($pinned != $site_emdash) {
    $failures = ($failures | append $"($label): has emdash ($pinned), but the site runs ($site_emdash) — a green test here says nothing about the site")
  }

  # 4. network access declared with nothing to allow.
  if $has_manifest {
    let raw = (open --raw $"($abs)/emdash-plugin.jsonc")
    # Single-quoted regexes: a `$"..."` pattern would have its embedded quotes read as the end of
    # the string. The manifest is text here — `emdash-plugin validate` is the authority on whether
    # it is a valid manifest.
    let capability_hits = ($raw | parse --regex '(?s)"capabilities"\s*:\s*\[(?<v>[^\]]*)\]')
    let allowed_hits = ($raw | parse --regex '(?s)"allowedHosts"\s*:\s*\[(?<v>[^\]]*)\]')
    let capabilities = (if ($capability_hits | is-empty) { "" } else { $capability_hits | first | get v })
    let allowed = (if ($allowed_hits | is-empty) { "" } else { $allowed_hits | first | get v })
    if ($capabilities | str contains "network:request") and (not ($capabilities | str contains "network:request:unrestricted")) {
      if (($allowed | str trim) | is-empty) {
        $failures = ($failures | append $"($label): declares network:request but allowedHosts is empty — the bundle-time check will reject it")
      }
    }
  }
}

if ($failures | is-not-empty) {
  print $"✗ plugin:audit found ($failures | length) problems:"
  for failure in $failures { print $"  ✗ ($failure)" }
  exit 1
}
print $"  ✓ ($dirs | length) plugins consistent"
'''

# Sandboxed-plugin build + release. The CLI is `@emdash-cms/plugin-cli` (binary
# `emdash-plugin`) and needs an `emdash-plugin.jsonc`. These sweep every plugin and run the
# script only if it declares one, so a native plugin is skipped rather than failed.
#
# `plugin:build` is not optional before `plugin:link`: a sandboxed plugin's `./sandbox` export
# points at its built bundle, so linking without building leaves the site importing a file
# that does not exist. See docs/plugin.md.

[tasks."plugin:search"]
description = "Search the plugin registry (emdash-plugin search, defaulting to the local registry when running)"
run = """
# The CLI already implements registry search; the only thing it gets wrong for us is that it
# defaults to the HOSTED registry while mise points EMDASH_REGISTRY_URL at the local one.
mut extra = []
if ($env.EMDASH_REGISTRY_URL? | is-not-empty) { $extra = ['--registry-url' $env.EMDASH_REGISTRY_URL] }
^emdash-plugin search ...$extra
"""

[tasks."plugin:info"]
description = "show details about a single package (official) — e.g: mise run plugin:info -- <slug>"
run = "emdash-plugin info"

[tasks."plugin:catalog"]
description = "Fetch the live plugin list from the registry → docs/plugin-catalog/"
run = '''
# The registry is the source of truth for published plugins — a GitHub scrape (what this used to
# do) goes stale and misses anything not hosted on GitHub.
let base = ($env.CATALOG_REGISTRY_URL? | default "https://registry.emdashcms.com")
mut packages = []
mut cursor = ""
loop {
  mut url = $"($base)/xrpc/com.emdashcms.experimental.aggregator.searchPackages?limit=100"
  if ($cursor | is-not-empty) { $url = $"($url)&cursor=($cursor)" }
  let page = (^curl -sS $url | from json)
  $packages = ($packages | append ($page | get -o packages | default []))
  $cursor = ($page | get -o cursor | default "")
  if ($cursor | is-empty) { break }
}
# `str lowercase` because the JavaScript sorted with `localeCompare`, which is case-insensitive:
# a plain sort-by puts every capitalised name first, which is not the catalogue anyone expects.
$packages = ($packages | sort-by {|p| $p | get -o profile | default {} | get -o name | default $p.slug | str lowercase })

# One row per package. Each field is computed before the string is built: a brace or a paren inside
# an interpolated string is not literal, and `(s)` in a message fails as "Command `s` not found".
let rows = ($packages | each {|pkg|
  let profile = ($pkg | get -o profile | default {})
  let name = ($profile | get -o name | default $pkg.slug)
  let authors = (
    ($profile | get -o authors | default [])
    | each {|author| $author | get -o name }
    | where {|n| $n | is-not-empty }
    | str join ", "
  )
  let author_text = (if ($authors | is-empty) { "—" } else { $authors })
  let license = ($profile | get -o license | default "—")
  let description = (($profile | get -o description | default "") | str replace --all --regex '\s+' " " | str trim)
  let clipped = (if ($description | str length) > 130 { $description | str substring 0..<130 } else { $description })
  $"| ($name) | `($pkg.slug)` | ($author_text) | ($license) | ($clipped) |"
})

let markdown = $"# Plugin catalog

Live packages published to the EmDash **registry** — generated by `mise run plugin:catalog`.

- Source: `($base)`
- Generated: (date now | format date "%Y-%m-%d")
- Packages: ($packages | length)

| Name | Slug | Author | License | Description |
|------|------|--------|---------|-------------|
($rows | str join (char nl))
"

# Only stable, useful fields: the raw records carry `cid`, `labels` and `indexedAt`, which change on
# every publish, and committing those turns the diff into noise.
let slim = ($packages | each {|pkg|
  let profile = ($pkg | get -o profile | default {})
  {
    slug: $pkg.slug,
    did: $pkg.did,
    handle: ($pkg | get -o handle),
    name: ($profile | get -o name | default $pkg.slug),
    description: ($profile | get -o description | default ""),
    authors: (
      ($profile | get -o authors | default [])
      | each {|author| $author | get -o name }
      | where {|n| $n | is-not-empty }
    ),
    license: ($profile | get -o license),
    keywords: ($profile | get -o keywords | default []),
    latestVersion: ($pkg | get -o latestVersion),
  }
})

mkdir $"($env.ROOT)/docs/plugin-catalog"
$markdown | save --force $"($env.ROOT)/docs/plugin-catalog/README.md"
($slim | to json --indent 4) | save --force $"($env.ROOT)/docs/plugin-catalog/packages.json"
print $"  ✓ ($packages | length) packages → docs/plugin-catalog/"
'''

[tasks."plugin:init"]
description = "Scaffold a new sandboxed plugin (official) — then: mise run plugin:new -- <name>"
usage = 'arg "<name>" help="New plugin name"'
# Scaffolds a NEW plugin, so it must run in plugins/ itself.
dir = "{{config_root}}/plugins"
run = "^emdash-plugin init $env.usage_name"

# These were tasks that could never work: plugin.mjs documented them as subcommands but had no
# `case` for any of them, so each one fell through to `default` and printed "unknown subcommand".
# They are one-shot calls to the official CLI, so they are one-shot tasks.
[tasks."plugin:login"]
description = "log in to the plugin registry via your Atmosphere account (official)"
run = "emdash-plugin login"

[tasks."plugin:logout"]
description = "log out of the plugin registry, revoking the publisher session (official)"
run = "emdash-plugin logout"

[tasks."plugin:whoami"]
description = "show the active publisher (official)"
run = "emdash-plugin whoami"

[tasks."plugin:profile"]
description = "manage the plugin package profile (official)"
run = "emdash-plugin profile"

[tasks."plugin:switch"]
description = "switch the active publisher session to another DID (official)"
run = "emdash-plugin switch"

[tasks."plugin:release"]
description = "manage delegated release intents (official)"
run = "emdash-plugin release"

[tasks."plugin:update-package"]
description = "update a published plugin's registry record without a release (official)"
run = "emdash-plugin update-package"

# -----------------------------------------------------------------------------
# SKILLS
# -----------------------------------------------------------------------------

[tasks."skills:sync"]
description = "Vendor the site's EmDash skills into .github/skills/ (committed) + symlink them for Claude Code"
run = """
# The EmDash skills live in TWO places, for two reasons:
#
#   .github/skills/<name>/   COMMITTED, and the one that matters. VS Code Copilot reads
#                           .github/skills/, and skills are discovered when a session STARTS.
#                           .claude/skills/ is gitignored, so on a fresh clone the link does not
#                           exist yet — and an agent that starts before anyone has run skills:sync
#                           has no EmDash knowledge at all. That is not hypothetical: it happened,
#                           and a whole session went into rediscovering export-seed, site import and
#                           the file-vs-D1 trap while those skills sat on disk unread.
#
#   .claude/skills/emdash    a SYMLINK, for Claude Code. Deliberately not committed: it points into
#                           gitignored .src/, so it would be broken on any other clone.
let site = $env.SITE_DIR
let vendor = $"($env.ROOT)/.github/skills"
let shipped = (^mise run skills:_shipped | str trim)
if ($shipped | is-empty) {
  print $"  ⚠ no shipped skills found in ($site), looked for .claude/skills and .agents/skills"
  exit 0
}

let names = (ls $shipped | where type == dir | get name | each {|p| $p | path basename } | sort)
rm -rf $vendor
mkdir $vendor
for name in $names { cp -r $"($shipped)/($name)" $"($vendor)/($name)" }
print $"  ✓ ($names | length) EmDash skills vendored → .github/skills — committed"

# A RELATIVE target on purpose: the link lives at .claude/skills/emdash, so the target is always
# ../../.src/site/... — an absolute one would break on any other clone.
mkdir $"($env.ROOT)/.claude/skills"
let rel = (
  if ($shipped | str contains ".agents/") { "../../.src/site/.agents/skills" }
  else { "../../.src/site/.claude/skills" }
)
^mise run fs:_link -- $rel $"($env.ROOT)/.claude/skills/emdash"
print $"  ✓ .claude/skills/emdash → ($rel)"
"""

[tasks."skills:check"]
description = "Fail if the committed .github/skills/ copy has drifted from the skills the site ships"
run = """
# Drift happens when the template or EMDASH_VERSION changes, and the failure mode is silent — an
# agent reads a stale skill and confidently does the wrong thing.
def hash_tree [dir: string] {
  mut acc = {}
  if ($dir | path exists) {
    for file in (glob $"($dir)/**/*") {
      if (($file | path type) == "file") {
        $acc = ($acc | upsert ($file | path relative-to $dir) (open --raw $file | hash sha256))
      }
    }
  }
  $acc
}

let site = $env.SITE_DIR
let vendor = $"($env.ROOT)/.github/skills"
let shipped = (^mise run skills:_shipped | str trim)
if ($shipped | is-empty) {
  print "  ⚠ no shipped skills to compare against — run: mise run site:setup"
  exit 0
}

let shipped_hashes = (hash_tree $shipped)
let vendored_hashes = (hash_tree $vendor)
let shipped_keys = ($shipped_hashes | columns)
let vendored_keys = ($vendored_hashes | columns)
mut problems = []

for path in $shipped_keys {
  if not ($path in $vendored_keys) {
    $problems = ($problems | append $"missing from .github/skills: ($path)")
  } else if (($vendored_hashes | get $path) != ($shipped_hashes | get $path)) {
    $problems = ($problems | append $"differs: ($path)")
  }
}
for path in $vendored_keys {
  if not ($path in $shipped_keys) {
    $problems = ($problems | append $"not shipped by the site: ($path)")
  }
}

if ($problems | is-not-empty) {
  print $"✗ skills:check — .github/skills has drifted from ($shipped | path relative-to $env.ROOT):"
  for problem in ($problems | first 20) { print $"  - ($problem)" }
  print "  fix: mise run skills:sync"
  exit 1
}
print $"  ✓ ($vendored_keys | length) vendored skill files match the site's"
"""

[tasks."skills:add-all"]
description = "Install the standard skill set for this project (run once after init)"
wait_for = ["site:setup"]
depends = ["skills:sync"]
run = """
# The skills CLI has no "restrict agents" flag, so it also writes other agents' directories.
^skills add kinoward/agent-skills/mise-guide --yes --agents "Claude Code"
for dir in [".crush" ".goose" ".cursor" ".augment" ".continue" ".codebuddy"] {
  rm -rf $"($env.ROOT)/($dir)"
}
print "  ✓ non-Claude agent dirs removed"
"""

# The rest of the skills CLI. These were subcommands of the deleted script that no task ever
# exposed, so they could not be run at all — the same shape of bug as the plugin relay.
[tasks."skills:list"]
description = "list installed skills (official)"
run = "skills list"

[tasks."skills:find"]
description = "search for skills (official)"
run = "skills find"

[tasks."skills:add"]
description = "install a skill — e.g: mise run skills:add -- owner/repo/skill"
run = "skills add --yes --agents \"Claude Code\""

[tasks."skills:remove"]
description = "remove a skill (official)"
run = "skills remove --yes"

[tasks."skills:remove-all"]
description = "remove every installed skill (official)"
run = "skills remove --all --yes"

[tasks."skills:update"]
description = "update installed skills (official)"
run = "skills update"

[tasks."skills:restore"]
description = "reinstall skills from skills-lock.json (official: skills experimental_install)"
run = "skills experimental_install"
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# EMDASH CLI — one task per official command, with no wrapper at all
# The CLI that ships with the site is on PATH (see _.path in [env]), so these tasks ARE the
# official tool. Both duties of the deleted shim turned out to be unnecessary: it appended
# `--url`, which the CLI already defaults to localhost and only accepts as the LAST argument (a
# position a task cannot append to); and it passed `--token` by hand to work around a fault that
# was ours — EMDASH_TOKEN in the environment was a LOCAL token, overriding the CLI's own stored
# credential on every remote call.
# -----------------------------------------------------------------------------

[tasks."emdash:cli"]
description = "Run the official emdash CLI with any arguments — e.g: mise run emdash:cli -- schema get parts"
run = "emdash"

[tasks."emdash:help"]
description = "the official emdash help — for one command: mise run emdash:cli -- <cmd> --help"
run = "emdash --help"

[tasks."emdash:init"]
description = "initialize a database from the template config (official)"
run = "emdash init"

[tasks."emdash:types"]
description = "generate TypeScript types from the schema (official)"
run = "emdash types"

[tasks."emdash:doctor"]
description = "check database health and scheduler wiring (official)"
run = "emdash doctor"

[tasks."emdash:seed"]
description = "apply a seed file to a database (official)"
run = "emdash seed"

[tasks."emdash:export-seed"]
description = "export a database's schema + content as a seed (official)"
run = "emdash export-seed"

[tasks."emdash:migrate"]
description = "check or apply deployment-managed migrations (official)"
run = "emdash migrate"

[tasks."emdash:secrets"]
description = "generate or fingerprint an EmDash encryption key (official)"
run = "emdash secrets"

[tasks."emdash:login"]
description = "log in to an instance — prints a URL and a code you approve by hand"
run = "emdash login"

[tasks."emdash:logout"]
description = "log out of an instance"
run = "emdash logout"

[tasks."emdash:whoami"]
description = "show the current user and auth method"
run = "emdash whoami"

[tasks."emdash:content"]
description = "list/get/create/update/delete/publish/schedule content (official)"
run = "emdash content"

[tasks."emdash:schema"]
description = "list/get/create/delete collections and add/remove fields (official)"
run = "emdash schema"

[tasks."emdash:media"]
description = "list/upload/get/delete media, or repair-usage (official)"
run = "emdash media"

[tasks."emdash:search"]
description = "full-text search across content (official)"
run = "emdash search"

[tasks."emdash:taxonomy"]
description = "list taxonomies and terms, add a term (official)"
run = "emdash taxonomy"

[tasks."emdash:menu"]
description = "list menus, or get one with its items (official)"
run = "emdash menu"

[tasks."emdash:site"]
description = "export/import a whole site as a .emdash package (official)"
run = "emdash site"

# -----------------------------------------------------------------------------
# REGISTRY — the optional local plugin registry (:8788)
# Not on the default path. `registry:up` starts it; the projection has to be built or
# every query returns nothing.
# -----------------------------------------------------------------------------

# A private helper. mise does NOT hide a leading `_` on its own — `hide = true` does that.
# Both admin routes are the same POST with a different path, so the token lookup lives here.
[tasks."registry:_admin"]
hide = true
usage = 'arg "<path>" help="Admin route, e.g. /_admin/backfill"'
run = """
let env_file = $"($env.EMDASH_DIR)/apps/aggregator/.env"
let hits = (open $env_file | lines | where {|l| $l | str starts-with 'ADMIN_TOKEN=' })
if ($hits | is-empty) {
  print "✗ no ADMIN_TOKEN — run: mise run registry:env"
  exit 1
}
let token = ($hits | first | split row '=' | skip 1 | str join '=')
let res = (
  ^curl -sS -X POST
    -H $"authorization: Bearer ($token)"
    -H 'content-type: application/json'
    -d '{}'
    $"($env.REGISTRY_URL)($env.usage_path)"
  | complete
)
let body = ($res.stdout | str trim)
print (if ($body | str length) > 600 { $body | str substring 0..<600 } else { $body })
exit $res.exit_code
"""

[tasks."registry:install"]
description = "Install + build the emdash monorepo for the registry aggregator"
depends = ["src:clone-emdash"]
# Skipped when the lockfile has not changed — otherwise every `registry:up` re-installs
# the whole monorepo. Absolute paths, so they stay correct whatever the working directory.
dir = "{{config_root}}/.src/emdash"
sources = ["{{config_root}}/.src/emdash/pnpm-lock.yaml"]
outputs = ["{{config_root}}/.src/emdash/node_modules/.modules.yaml"]
run = """
^pnpm install --frozen-lockfile
^pnpm --filter @emdash-cms/aggregator run prebuild
"""

[tasks."registry:migrate"]
description = "Apply the registry aggregator's local D1 migrations"
depends = ["registry:install"]
dir = "{{config_root}}/.src/emdash/apps/aggregator"
run = "pnpm run db:migrate:local"

[tasks."registry:env"]
description = "Create the registry aggregator's local .env (LISTING_POLICY_MODE=open + dev admin token)"
depends = ["src:clone-emdash"]
dir = "{{config_root}}/.src/emdash/apps/aggregator"
# Without this the aggregator uses wrangler.jsonc's default LISTING_POLICY_MODE=projection,
# which fails closed (it needs positive labels from the emdashcms labeller) — so every read
# returns empty. `.env.example` sets `open`.
run = """
if ('.env' | path exists) {
  print "  ✓ .env already present"
} else {
  cp .env.example .env
  print "  ✓ wrote .env (LISTING_POLICY_MODE=open, dev ADMIN_TOKEN)"
}
"""

[tasks."registry:start"]
description = "Start the local registry aggregator on :8788 — called by pitchfork"
depends = ["registry:migrate", "registry:env"]
dir = "{{config_root}}/.src/emdash/apps/aggregator"
# `wrangler dev`, NOT the package's `vite dev`: the Cloudflare vite plugin resolves
# miniflare@4.20260507.1 + workerd@1.20260507.1, and that workerd build crashes on
# Durable Object SQLite (`table _cf_ALARM has 3 columns but 2 values were supplied`).
run = "^pnpm exec wrangler dev --port $env.REGISTRY_PORT"

[tasks."registry:up"]
description = "Start the registry aggregator daemon via pitchfork"
run = """
^mise daemons start registry
print $"→ registry: ($env.REGISTRY_URL)/health — JSON API under /xrpc/com.emdashcms.experimental.aggregator.*"
"""

[tasks."registry:logs"]
description = "Follow the registry aggregator's logs"
run = "mise daemons logs registry --follow"

[tasks."registry:backfill"]
description = "Ingest plugin records from the ATProto network — then run registry:project to make reads work"
# Jetstream only streams NEW records, so a fresh registry stays empty until backfill:
# this discovers publishers on the relay and fans out one job per (DID × collection).
run = "mise run registry:_admin -- /_admin/backfill"

[tasks."registry:project"]
description = "Build the registry's public projection — without it every read returns empty"
# Reads gate on public_projection_state.active_generation, and the generation is built by the
# LABEL ingest DO — locally there is no label stream, so a labels replay is what builds it.
run = "mise run registry:_admin -- /_admin/labels/replay"

# The registry's web UI (plugins.emdashcms.com), served locally on :4330. Optional, like the
# registry itself — but [daemons] declares it, so these tasks are what it runs. They
# were missing, which meant that daemon could never start and `repo:urls` told you to run a task
# that did not exist.
[tasks."plugins-site:start"]
description = "Serve the registry's web UI on :4330 — called by pitchfork"
depends = ["registry:install"]
dir = "{{config_root}}/.src/emdash/apps/plugins-site"
# `pnpm dev` runs the app's own `predev` first, which builds its workspace dependencies — without
# that the UI would serve against unbuilt packages.
run = "pnpm dev -- --port $env.PLUGINS_SITE_PORT"

[tasks."plugins-site:up"]
description = "Start the registry web UI daemon via pitchfork"
run = """
^mise daemons start plugins-site
print $"→ plugins UI ($env.PLUGINS_SITE_URL)/"
"""

[tasks."plugins-site:logs"]
description = "Follow the registry web UI's logs"
run = "mise daemons logs plugins-site --follow"
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# HELPERS — hidden via hide = true (a leading `_` in the name does NOT hide a task). Each owns ONE
# concern so no flow repeats it. Not part of the interface: none of these is meant to be typed.
# -----------------------------------------------------------------------------

# The ONE place that reads JSON back from the CLI. It owns three things so no caller repeats them:
#
#   --url       the CLI accepts it only as the LAST argument (anywhere else and it prints its help),
#               and it comes from EMDASH_URL — so targeting a deployment is one environment variable.
#   the banner  the CLI writes progress lines before its payload, so the payload is found by
#               locating the first line that opens with `{` or `[`.
#   the parse   callers receive JSON text and pipe it through `from json`.
#
# The argument is one string rather than a variadic because mise VALIDATES a declared signature:
# extra bare words are rejected outright rather than appended, so a variadic is not available.
[tasks."emdash:_json"]
hide = true
usage = 'arg "<args>" help="emdash arguments as one string, e.g. \"content list parts --json\""'
run = """
let args = ($env.usage_args | split row ' ')
let url = ($env.EMDASH_URL? | default "")
let full = (if ($url | is-not-empty) { $args | append ["--url" $url] } else { $args })
let lines = (^emdash ...$full | complete).stdout | lines
let start = ($lines | enumerate | where {|l|
  ($l.item | str starts-with '{') or ($l.item | str starts-with '[')
} | get -o index | first)
$lines | skip $start | str join (char nl)
"""

# EmDash's admin API authenticates with a session cookie, and `setup/dev-bypass` hands one out on
# localhost without a passkey. A curl cookie jar carries it — so nothing hand-assembles a Cookie
# header — and the jar lives at a fixed path, so callers need not capture any output.
[tasks."mcp:_login"]
hide = true
run = """
mkdir $"($env.RUN_DIR)"
^curl -sS -o /dev/null -c $"($env.RUN_DIR)/.mcp-cookies" -X POST $"($env.SITE_URL)/_emdash/api/setup/dev-bypass"
if $env.LAST_EXIT_CODE != 0 {
  print --stderr "✗ could not reach the site — is it running? mise run repo:apply"
  exit 1
}
"""

# Where the site ships its EmDash skills: `.claude/skills` first, `.agents/skills` as the fallback.
# Prints the path, or nothing when the site has not been set up yet.
[tasks."skills:_shipped"]
hide = true
run = """
let site = $env.SITE_DIR
print (
  if ($"($site)/.claude/skills" | path exists) { $"($site)/.claude/skills" }
  else if ($"($site)/.agents/skills" | path exists) { $"($site)/.agents/skills" }
  else { "" }
)
"""

# A plugin is a directory under plugins/ with a package.json. Defined once, so the five tasks that
# sweep plugins/ cannot disagree about what counts as one.
[tasks."plugin:_dirs"]
hide = true
run = """
print (
  ls ($env.PLUGINS_DIR)
  | get name
  | to json --raw
)
"""

# Fails with the list of what does exist, so a typo says what you probably meant. Both callers used
# to spell this out for themselves.
[tasks."plugin:_require"]
hide = true
usage = 'arg "<plugin>" help="Plugin directory name under plugins/"'
run = """
if not ($"($env.PLUGINS_DIR)/($env.usage_plugin)" | path exists) {
  print --stderr $"✗ no such plugin: ($env.usage_plugin)"
  let available = (^mise run plugin:_dirs | from json | each {|p| $p | path basename } | str join ' ')
  print --stderr $"  available: ($available)"
  exit 1
}
"""

# The dev-server daemon, stopped and put back around anything that re-runs the Vite optimizer in
# .src/site (a production build, `astro check`). Re-hashing the `deps_ssr/*?v=…` URLs under a
# running server makes it serve stale ones and return 500s — clearing the on-disk caches is not
# enough, because the stale module graph is held in memory. Prints one word for site:_resume.
[tasks."site:_pause"]
hide = true
run = """
let listed = (^mise daemons status | complete)
let running = (($listed.stdout | lines) | any {|l|
  ($l | str contains $"/($env.SITE_DAEMON)") and ($l | str contains "running")
})
if $running { ^mise daemons stop $env.SITE_DAEMON | complete | ignore }
print (if $running { "running" } else { "stopped" })
"""

[tasks."site:_resume"]
hide = true
usage = 'arg "<state>" help="what site:_pause printed: running | stopped"'
run = """
if ($env.usage_state == "running") {
  print "  → restarting the dev server (it holds a stale module graph)"
  ^mise daemons start $env.SITE_DAEMON
}
"""

# The dev server's ACTUAL database, as a path a file-based CLI can read.
#
# EmDash's file-based commands (`doctor`, `seed`, `export-seed`) all default to `./data.db`, which a
# Cloudflare site never uses — the dev server reads miniflare's D1 under `.wrangler/state/v3/d1`.
# So the default silently reports on the WRONG database: `emdash doctor` announced "no users" while
# the real one had one, and `emdash seed` printed "Seed applied successfully" into a file the site
# never reads. Prints the path, or exits non-zero having said why on stderr.
[tasks."site:_devdb"]
hide = true
run = """
let d1 = $"($env.SITE_DIR)/.wrangler/state/v3/d1/miniflare-D1DatabaseObject"
let found = (
  if ($d1 | path exists) {
    ls $d1
    | get name
    | where {|n| ($n | str ends-with '.sqlite') and (not ($n | str ends-with 'metadata.sqlite')) }
  } else { [] }
)
if ($found | is-empty) {
  print --stderr "✗ no local D1 yet — run: mise run repo:apply"
  exit 1
}
print ($found | first)
"""

# A symlink, or a junction on Windows. Node used to paper over that difference; it is spelled out
# once here instead of in every caller. `ln -sfn` stores the target string verbatim, so a RELATIVE
# target stays relative to the link — which is what keeps a committed config link portable.
[tasks."fs:_link"]
hide = true
usage = """
arg "<target>" help="what the link points at"
arg "<link>" help="path of the link to create"
"""
run = """
rm -rf $env.usage_link
mkdir ($env.usage_link | path dirname)
if ($nu.os-info.name == "windows") {
  ^cmd /c mklink /J $env.usage_link $env.usage_target | complete | ignore
} else {
  ^ln -sfn $env.usage_target $env.usage_link
}
"""

# -----------------------------------------------------------------------------
# DAEMONS — managed through pitchfork by `mise daemons start|stop|status|logs`, so the definitions
# live HERE rather than in a second file that had to be kept in step with the tasks.
# -----------------------------------------------------------------------------

# NOTE: values here are passed to pitchfork VERBATIM — mise does not expand templates in
# [daemons], so `{{env.SITE_URL}}` reaches pitchfork as those literal characters and the daemon
# never becomes ready. These URLs are duplicated from [env] on purpose, and that is the reason.

[daemons.emdash]
run = "mise run site:dev"
dir = "."
auto = ["start", "stop"]
ready_http = "http://localhost:4321/"

[daemons.registry]
run = "mise run registry:start"
dir = "."
auto = ["stop"]
ready_http = "http://localhost:8788/xrpc/com.emdashcms.experimental.aggregator.searchPackages?limit=1"

[daemons.plugins-site]
run = "mise run plugins-site:start"
dir = "."
auto = ["stop"]
ready_http = "http://localhost:4330/"
