[tasks."plugin:new"]
description = "Scaffold a new sandboxed plugin, then install and validate it"
usage = """
arg "<name>" help="New plugin name"
"""
run = """
let name = $env.usage_name
print "→ scaffold"
^mise run plugin:init -- $name
print "→ dependencies"
^mise run plugin:install -- $name
print "→ validate the generated manifest"
^mise run plugin:validate -- $name
print $"✓ ($name) is ready — try: mise run plugin:dev -- ($name)"
"""

