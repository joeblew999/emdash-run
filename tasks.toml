# The stages of working on an EmDash site — docs/plans/done/2026-10-07-stages.md.
# A project gets them with one line in its mise.toml:
#   [tools]
#   node = "26"
#   pnpm = "12"
#   [task_config]
#   includes = ["git::https://github.com/joeblew999/emdash-run.git//tasks.toml?ref=<tag or main>"]
#
# Where the site is: the folder `site` beside mise.toml, or SITE_FOLDER — "." when the site is the
# project itself, which is how EmDash lays out an existing site.
#
# The tools the tasks run — node and pnpm — are the project's: its mise.toml has a [tools] block.
# Not declared per task here: a step that forgot would silently run on whatever the machine has.
#
# Visible tasks are named <what>:<verb> — site:new, site:start, plugin:add — so they group by what
# you are working on. `step:*` tasks are hidden: each is ONE command — EmDash's, Astro's, wrangler's
# or pnpm's — written once and reused. Where no command exists, a step is one line of `node -e`
# (a check, a message), and one step runs a script: admin/first-admin.mjs, for site:admin. If a
# step seems to need more logic than that, it is a gap to write down in a plan, not code to add.

# ── hidden steps ─────────────────────────────────────────────────────────────────────────────

["step:there"]
hide = true
quiet = true
description = "There is a site here — says so plainly when there is not, instead of mise's bare 'No such file or directory'"
dir = "{{config_root}}"
run = "node -e \"if (!require('fs').existsSync('{{ env.SITE_FOLDER | default(value='site') }}/package.json')) { console.error('There is no site in [{{ env.SITE_FOLDER | default(value='site') }}]. Make one with: mise run site:new - or set SITE_FOLDER to where the site is.'); process.exit(1) }\""

["step:install"]
hide = true
description = "The site's packages, as its lockfile pins them"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm install"

["step:seed"]
hide = true
description = "The seed is one EmDash will accept — an invalid one is skipped on first start with no error. For site:check, not site:start. A site with no seed file is a valid site and this fails on one: such a project sets SITE_SEED = 'none'"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "{% if env.SITE_SEED | default(value='file') == 'none' %}node -e \"\"{% else %}pnpm exec emdash seed --validate{% endif %}"

["step:typecheck"]
hide = true
description = "Astro's type check of the site's pages and components"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec astro check"

["step:build"]
hide = true
description = "The production build — what a deploy ships"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec astro build"

["step:forget"]
hide = true
description = "Remove the local database and uploads, so the next start makes them again from the seed. Cloudflare sites keep them in .wrangler/state, Node sites in data.db and uploads/"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm dlx rimraf .wrangler/state data.db data.db-wal data.db-shm uploads"

["step:key"]
hide = true
description = "The key EmDash encrypts plugin secrets with, in the gitignored site/.env — made when there is none, left alone when there is"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec emdash secrets generate --write .env"

["step:dev"]
hide = true
description = "EmDash's dev server, started by Astro in the background — Astro keeps its pid, log and lock"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec astro dev --background --host 127.0.0.1 --port {{ env.SITE_PORT | default(value='4321') }}"

["step:up"]
hide = true
silent = "stdout"
description = "The site answers and the CLI can reach it: asks it for its collections. Fails when it does not — `emdash whoami` does not, it exits 0 with no site running"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
env = { EMDASH_URL = "http://localhost:{{ env.SITE_PORT | default(value='4321') }}" }
run = "pnpm exec emdash schema list"

["step:model-changed"]
hide = true
description = "What model:sync changed, as git sees it — nothing printed means the repo already had the model"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = ["git status --short -- .emdash", "git --no-pager diff --stat -- .emdash"]

["step:live"]
hide = true
quiet = true
description = "The project says where its deployment is — LIVE_URL in mise.toml. Fails plainly when it does not"
dir = "{{config_root}}"
run = "{% if env.LIVE_URL | default(value='') == '' %}node -e \"console.error('This needs the address of the deployed site. Set LIVE_URL in the [env] block of mise.toml.'); process.exit(1)\"{% else %}node -e \"\"{% endif %}"

["step:backups"]
hide = true
quiet = true
description = "The site's backups/ folder exists — EmDash's export does not make it. Keep it out of git: a package holds drafts too"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "node -e \"require('fs').mkdirSync('backups', { recursive: true })\""

["step:package"]
hide = true
description = "The deployed site as one EmDash package — content, model and media; no users — in the site's backups/ folder"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "node \"{{ env.MISE_TASK_DIR }}/admin/emdash.mjs\" {{ env.LIVE_URL | default(value='') }} \"{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}\" site export --url {{ env.LIVE_URL | default(value='') }} --output backups/live-{{ now() | date(format='%Y%m%d-%H%M%S') }}.emdash"

["step:import-how"]
hide = true
quiet = true
description = "The two commands that bring a package into an empty local site — EmDash wants a person to read the plan in between"
dir = "{{config_root}}"
run = "node -e \"console.log('The package is in backups/. To load it into an EMPTY local site (mise run site:reset, then open /_emdash/api/setup/dev-bypass?content=0):'); console.log('  mise run emdash -- site import backups/FILE --analyze'); console.log('  mise run emdash -- site import backups/FILE --plan DIGEST --confirm');\""

["step:plugin-details"]
hide = true
quiet = true
description = "The project says who publishes its plugins — EmDash's plugin scaffolder refuses without all three"
dir = "{{config_root}}"
run = "{% if env.PLUGIN_PUBLISHER | default(value='') == '' or env.PLUGIN_AUTHOR | default(value='') == '' or env.PLUGIN_SECURITY_EMAIL | default(value='') == '' %}node -e \"console.error('A new plugin needs three settings in the [env] block of mise.toml: PLUGIN_PUBLISHER (your Atmosphere handle or DID - it must resolve), PLUGIN_AUTHOR (a name) and PLUGIN_SECURITY_EMAIL.'); process.exit(1)\"{% else %}node -e \"\"{% endif %}"

["step:plugin-how"]
hide = true
quiet = true
description = "The edit EmDash leaves to you after a plugin is added: two lines in astro.config.mjs, and a sandbox runner if the site has none"
dir = "{{config_root}}"
run = "node -e \"console.log('The plugin is in the site and in package.json. Now, in astro.config.mjs:'); console.log('  1. import it:              import myPlugin from PACKAGE-NAME'); console.log('  2. inside emdash({ ... }):  sandboxed: [myPlugin],'); console.log('  3. once per site, a runner: Cloudflare - sandboxRunner: sandbox() from @emdash-cms/cloudflare, and the worker_loaders line in wrangler.jsonc (Workers Paid plan to deploy).'); console.log('                              Node - sandboxRunner: @emdash-cms/sandbox-workerd/sandbox (a string), and in the site: pnpm add @emdash-cms/sandbox-workerd workerd'); console.log('The site was stopped first. Then: mise run site:start. EmDash docs: deployment/plugin-sandbox.');\""

["step:rehearse"]
hide = true
description = "Everything a Cloudflare deploy does short of shipping: wrangler bundles the build and resolves the bindings, and uploads nothing. Needs no account"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec wrangler deploy --dry-run"

["step:newer"]
hide = true
description = "EmDash's documented update: the newest emdash and, where the site has it, its Cloudflare package — written to package.json and the lockfile"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm up --latest emdash @emdash-cms/cloudflare"

["step:update-how"]
hide = true
quiet = true
description = "What an update does not do, and what comes next"
dir = "{{config_root}}"
run = "node -e \"console.log('EmDash is updated in package.json and the lockfile, and the site type-checks and builds on it.'); console.log('  Read what changed:  https://github.com/emdash-cms/emdash/releases'); console.log('  Not updated: the files your site got from its template, and the agent skills the scaffolder wrote.'); console.log('  Next: mise run site:stop, mise run site:start - database migrations run on the first request. Then commit.');\""

["step:account"]
hide = true
description = "Someone is signed in to Cloudflare — fails at once, with wrangler's own words, when not. Sign in with: pnpm exec wrangler login"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec wrangler whoami"

["step:deploy"]
hide = true
description = "The build goes to Cloudflare, and every line of the site's .env goes with it as a secret — on a site this made, that is EmDash's encryption key; the values are never shown, and secrets already there are kept. On a first deploy wrangler makes the database and bucket named in wrangler.jsonc. --strict refuses when the deployed Worker was changed from somewhere else"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec wrangler deploy --strict --secrets-file .env --message \"live:ship {{ now() | date(format='%Y-%m-%d %H:%M:%S') }} UTC\""

["step:deployed"]
hide = true
description = "What is live now: wrangler's own account of the current deployment and its version"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec wrangler deployments status"

["step:live-up"]
hide = true
description = "The deployed site answers. A plain request, because none of EmDash's commands can ask a deployed site anything before someone has signed in to it. The first request after a deploy runs EmDash's migrations and can take half a minute"
dir = "{{config_root}}"
run = "curl --fail --silent --show-error --head --max-time 180 {{ env.LIVE_URL | default(value='') }}"

["step:mark"]
hide = true
description = "Where the deployed database is right now: its Time Travel bookmark, and the command that would restore to it"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec wrangler d1 time-travel info DB"

["step:backup-how"]
hide = true
quiet = true
description = "What a backup holds, what it does not, and how each copy is used"
dir = "{{config_root}}"
run = "node -e \"console.log('Two copies were taken. They are different things:'); console.log('  1. The Time Travel bookmark above: the whole database - users, tokens, plugin data. Cloudflare keeps 30 days. Restore: pnpm exec wrangler d1 time-travel restore DB --bookmark ID (destructive - stop writes first).'); console.log('  2. The package in backups/: content, model and media, no users. Loads into an EMPTY site: mise run emdash -- site import FILE --analyze.'); console.log('Neither holds: the media bucket itself, or EMDASH_ENCRYPTION_KEY - keep the key somewhere safe yourself.'); console.log('There is no SQL dump: wrangler d1 export refuses a database with search tables, which EmDash has.');\""

["step:preview"]
hide = true
description = "The production build, served by Astro in the background — the same build a deploy ships, so it signs in the way a deployed site does: no dev sign-in. EMDASH_SITE_URL tells EmDash its address: a Node build otherwise takes itself to be on port 4321 and refuses a passkey made anywhere else"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
env = { EMDASH_SITE_URL = "http://localhost:{{ env.PREVIEW_PORT | default(value='4322') }}" }
run = "pnpm exec astro preview --background --host 127.0.0.1 --port {{ env.PREVIEW_PORT | default(value='4322') }}"

["step:preview-up"]
hide = true
description = "The production build answers"
dir = "{{config_root}}"
run = "curl --fail --silent --show-error --head --max-time 180 http://localhost:{{ env.PREVIEW_PORT | default(value='4322') }}"

["step:admin-tools"]
hide = true
description = "The one package site:admin's script needs, installed beside the script — in mise's copy of emdash-run, not in the project"
dir = "{{config_root}}"
run = "pnpm --dir \"{{ env.MISE_TASK_DIR }}/admin\" install --silent"

["step:admin"]
hide = true
description = "EmDash's setup wizard and CLI sign-in, done by a script in a headless browser with a simulated passkey. Refuses any address that is not this machine"
dir = "{{config_root}}"
run = "node \"{{ env.MISE_TASK_DIR }}/admin/first-admin.mjs\" http://localhost:{{ env.PREVIEW_PORT | default(value='4322') }} \"{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}\""

# ── the stages ───────────────────────────────────────────────────────────────────────────────

["site:new"]
description = "A site, once: EmDash's scaffolder makes the site folder and installs it. Say which — mise run site:new -- node:blog — or leave it out for TEMPLATE in mise.toml, else cloudflare:blog"
dir = "{{config_root}}"
usage = '''
arg "[template]" help="<platform>:<template>" {
  choices "cloudflare:blog" "cloudflare:starter" "cloudflare:marketing" "cloudflare:portfolio" "node:blog" "node:starter" "node:marketing" "node:portfolio"
}
'''
run = [{ task = "step:own-folder" }, "pnpm dlx create-emdash@latest {{ env.SITE_FOLDER | default(value='site') }} --template {% if usage.template %}{{ usage.template }}{% else %}{{ env.TEMPLATE | default(value='cloudflare:blog') }}{% endif %} --pm pnpm --install --yes"]

["site:start"]
description = "I want to work on this site: install, make its key if it has none, run it in the background. Then open the admin: /_emdash/api/setup/dev-bypass?redirect=/_emdash/admin"
run = [{ task = "step:there" }, { task = "step:install" }, { task = "step:key" }, { task = "step:dev" }, { task = "step:up" }]

["site:stop"]
description = "Stop the site that site:start started, and the production build that site:preview started"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = ["pnpm exec astro dev stop", "pnpm exec astro preview stop"]

["site:logs"]
description = "Follow the running site's log"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec astro dev logs --follow"

["site:check"]
description = "Is my work sound, before a commit or a deploy: the seed is valid, the types check, the production build passes. Safe beside a running site"
run = [{ task = "step:there" }, { task = "step:install" }, { task = "step:seed" }, { task = "step:typecheck" }, { task = "step:build" }]

["site:reset"]
description = "The local site back to its seed: stops it, removes the local database and uploads, starts it again. Local only — nothing deployed is touched. Asks first — except in CI, where mise answers yes"
confirm = "Remove this site's local database and uploads, and start again from the seed?"
run = [{ task = "step:there" }, { task = "site:stop" }, { task = "step:forget" }, { task = "site:start" }]

["model:sync"]
description = "The admin and the repo must agree: after anyone changes the model — in the admin or with emdash schema — this records it in .emdash/ and shows what changed. Commit that with the code that uses it. From the running local site; with --live, from the deployed one at LIVE_URL (once: mise run emdash -- login --url <LIVE_URL>)"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
usage = 'flag "--live" help="Read the model of the deployed site at LIVE_URL instead of the local one"'
run = [
  "node \"{{ env.MISE_TASK_DIR }}/admin/emdash.mjs\" http://localhost:{{ env.SITE_PORT | default(value='4321') }} \"{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}\" types --url {% if usage.live %}{{ env.LIVE_URL | default(value='LIVE_URL-is-not-set') }}{% else %}http://localhost:{{ env.SITE_PORT | default(value='4321') }}{% endif %}",
  { task = "step:model-changed" },
]

["content:pull"]
description = "The deployed site's content, on this machine: downloads it as an EmDash package into backups/ and prints how to load it into an empty local site. Needs LIVE_URL, and once: mise run emdash -- login --url <LIVE_URL>"
run = [{ task = "step:live" }, { task = "step:there" }, { task = "step:backups" }, { task = "step:package" }, { task = "step:import-how" }]

["plugin:new"]
description = "I need a plugin of my own: stops the site, then EmDash's plugin scaffolder makes plugins/<name> inside it, and the plugin is installed, tested, built and added to the site. Ends with the two lines to add to astro.config.mjs. Needs PLUGIN_PUBLISHER, PLUGIN_AUTHOR and PLUGIN_SECURITY_EMAIL"
depends = ["step:there", "step:plugin-details"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
usage = 'arg "<name>" help="The slug of the plugin, e.g. save-log"'
run = [
  { task = "site:stop" },
  "pnpm dlx @emdash-cms/plugin-cli@latest init {{ usage.name }} --dir plugins/{{ usage.name }} --yes --publisher {{ env.PLUGIN_PUBLISHER | default(value='') }} --author-name \"{{ env.PLUGIN_AUTHOR | default(value='') }}\" --security-email {{ env.PLUGIN_SECURITY_EMAIL | default(value='') }} --package-manager pnpm",
  "pnpm --dir plugins/{{ usage.name }} install",
  "pnpm --dir plugins/{{ usage.name }} run test",
  "pnpm --dir plugins/{{ usage.name }} run build",
  "pnpm add file:./plugins/{{ usage.name }}",
  { task = "step:plugin-how" },
]

["plugin:check"]
description = "Is this plugin sound: its manifest is valid, its types check, its tests pass, it builds, and the bundle the registry would get is valid"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
usage = 'arg "<name>" help="The folder name of the plugin under plugins/"'
run = [
  "pnpm --dir plugins/{{ usage.name }} install",
  "pnpm --dir plugins/{{ usage.name }} run validate",
  "pnpm --dir plugins/{{ usage.name }} run typecheck",
  "pnpm --dir plugins/{{ usage.name }} run test",
  "pnpm --dir plugins/{{ usage.name }} run build",
  "pnpm --dir plugins/{{ usage.name }} exec emdash-plugin bundle --validate-only",
]

["plugin:add"]
description = "I need someone else's plugin, from npm: stops the site and adds the package to it, so the repo declares it and a fresh clone has it. Ends with the two lines to add to astro.config.mjs. (A registry plugin is installed in the admin instead — EmDash has no command for it)"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
usage = 'arg "<package>" help="The npm package, e.g. @emdash-cms/plugin-forms"'
run = [{ task = "site:stop" }, "pnpm add {{ usage.package }}", { task = "step:plugin-how" }]

["plugin:publish"]
description = "Release this plugin to EmDash's registry, under the account you are logged in to: mise run plugin -- login <handle>. Checks it first. Asks first — except in CI, where mise answers yes"
confirm = "Publish this plugin to the public registry? A released version cannot be changed."
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
usage = 'arg "<name>" help="The folder name of the plugin under plugins/"'
run = [
  "pnpm --dir plugins/{{ usage.name }} run validate",
  "pnpm --dir plugins/{{ usage.name }} run test",
  "pnpm --dir plugins/{{ usage.name }} exec emdash-plugin bundle --validate-only",
  "pnpm --dir plugins/{{ usage.name }} exec emdash-plugin publish",
]

[plugin]
description = "Anything else in EmDash's plugin CLI — e.g: mise run plugin -- search forms"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm dlx @emdash-cms/plugin-cli@latest"

["live:check"]
hide = true
description = "Would this deploy: site:check, then wrangler's dry run of the deploy — nothing is uploaded and no account is needed. For a site on Cloudflare"
run = [{ task = "site:check" }, { task = "step:rehearse" }]

["emdash:update"]
description = "A newer EmDash: updates the site to the latest release, then type-checks and builds it. The local database migrates on the next start. A deployed site: take a backup first, deploy after"
run = [{ task = "step:there" }, { task = "step:newer" }, { task = "step:typecheck" }, { task = "step:build" }, { task = "step:update-how" }]

["live:ship"]
description = "Put it live on Cloudflare: checks who is signed in, runs live:check, deploys, shows what is now live and waits for the site to answer. Needs LIVE_URL. EmDash migrates the database on the first request. The site's .env goes up with it as secrets. First time: see the signin: tasks, and have one in place BEFORE this — a deployed site with no sign-in in front of it belongs to whoever opens its admin first"
run = [{ task = "step:live" }, { task = "step:account" }, { task = "live:check" }, { task = "step:deploy" }, { task = "step:deployed" }, { task = "step:live-up" }]

["live:undo"]
description = "Put the previous version back — or the one you name: mise run live:undo -- <version-id> (wrangler versions list shows them). Code only: a rollback does not undo a database migration or any content"
depends = ["step:live", "step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
usage = 'arg "[version]" help="A version id; left out, the one before the current"'
run = ["pnpm exec wrangler whoami", "pnpm exec wrangler rollback {{ usage.version }} --yes --message \"live:undo\"", { task = "step:deployed" }, { task = "step:live-up" }]

["live:logs"]
description = "Follow the deployed site's log — requests, errors, and each run of the scheduler"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec wrangler tail"

["live:backup"]
description = "A way back, and a copy: the deployed database's Time Travel bookmark, and the deployed site as an EmDash package in backups/. Says what neither holds. Needs LIVE_URL, and once: mise run emdash -- login --url <LIVE_URL>"
run = [{ task = "step:live" }, { task = "step:there" }, { task = "step:account" }, { task = "step:mark" }, { task = "step:backups" }, { task = "step:package" }, { task = "step:backup-how" }]

["site:preview"]
description = "The site as a deploy would ship it, on this machine: stops the dev server, builds, and serves the production build in the background on PREVIEW_PORT (4322). It shares the local database with site:start. site:stop stops it"
run = [{ task = "step:there" }, { task = "site:stop" }, { task = "step:install" }, { task = "step:key" }, { task = "step:build" }, { task = "step:preview" }, { task = "step:preview-up" }]

["site:admin"]
hide = true
description = "A testing tool: a production build with a real administrator and a signed-in CLI, with nobody at a browser — for building and testing anything that needs real sign-in. Not how a deployed site gets its administrator (that is live:access). EMPTIES the local database first, then site:preview, then a script completes EmDash's setup wizard and approves the CLI's sign-in. Local only. Asks first. Afterwards: mise run emdash -- <command> --url http://localhost:<PREVIEW_PORT>"
confirm = "Empty this site's local database and uploads, and set up a production build of it with a test administrator?"
run = [{ task = "step:there" }, { task = "site:stop" }, { task = "step:forget" }, { task = "site:preview" }, { task = "step:admin-tools" }, { task = "step:admin" }]

# ── signing in ───────────────────────────────────────────────────────────────────────────────
# In development (site:start) EmDash signs you in by itself: open
# /_emdash/api/setup/dev-bypass?redirect=/_emdash/admin — nothing below is needed.
#
# A production build — on this machine (site:preview) or deployed — has real sign-in. These are the
# ways, side by side, so each can be tried. Each works on the local production build, and with
# --live on the deployed site at LIVE_URL.
#
#   signin:token    a MACHINE, in a second, no browser. Writes an administrator and an EmDash API
#                   token straight into the site's database. Use for the CLI, agents, CI.
#   signin:passkey  a MACHINE, through EmDash's real pages: a script in a hidden browser completes
#                   the setup wizard with a simulated passkey and signs the CLI in. Use to exercise
#                   the wizard and the CLI's own login. Needs Chrome or Edge.
#   signin:open     a PERSON: a visible browser window already signed in, on a site signin:passkey
#                   set up.
#   signin:access   PEOPLE on a deployed site: Cloudflare Access in front of the admin — sign in by
#                   a code sent to ADMIN_EMAIL — plus a pass that lets machines through it. Needs a
#                   Cloudflare token with Access rights: fnox exec -- mise run signin:access
#   (a login provider — GitHub, Google — is a fifth way and needs no task: two lines in the
#   site's astro.config.mjs and an OAuth app; see the README)
#
# signin:token and signin:passkey each want a site nobody has set up yet. They are alternatives:
# to try the other, start again from an empty database (site:reset locally).

["signin:token"]
description = "SIGN-IN, the fast way for a MACHINE: an administrator and an EmDash API token written straight into the site's database — no browser. The local production build (run site:preview first), or with --live the deployed site at LIVE_URL (fnox exec -- mise run signin:token -- --live). After it, mise run emdash -- <command> --url <site> just works"
depends = ["step:there"]
dir = "{{config_root}}"
usage = 'flag "--live" help="The deployed site at LIVE_URL instead of the local production build"'
run = "node \"{{ env.MISE_TASK_DIR }}/admin/token.mjs\" {% if usage.live %}{{ env.LIVE_URL | default(value='LIVE_URL-is-not-set') }}{% else %}http://localhost:{{ env.PREVIEW_PORT | default(value='4322') }}{% endif %} \"{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}\" {% if usage.live %}--remote{% else %}--local{% endif %}"

["signin:passkey"]
description = "SIGN-IN, through EmDash's real pages, for a MACHINE: a script in a hidden browser completes the setup wizard with a simulated passkey and approves the CLI's own login. The local production build (run site:preview first), or with --live the deployed site at LIVE_URL as ADMIN_EMAIL. The passkey is saved in ~/.config/emdash-run/passkeys/. Needs Chrome or Edge"
depends = ["step:there", "step:admin-tools"]
dir = "{{config_root}}"
usage = 'flag "--live" help="The deployed site at LIVE_URL instead of the local production build"'
run = "node \"{{ env.MISE_TASK_DIR }}/admin/first-admin.mjs\" {% if usage.live %}{{ env.LIVE_URL | default(value='LIVE_URL-is-not-set') }}{% else %}http://localhost:{{ env.PREVIEW_PORT | default(value='4322') }}{% endif %} \"{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}\"{% if usage.live %} --deployed{% endif %}"

["signin:open"]
description = "SIGN-IN, for a PERSON: a browser window you can see, already signed in to the admin of a site that signin:passkey set up — local production build, or --live. Close the window when done"
depends = ["step:there", "step:admin-tools"]
dir = "{{config_root}}"
usage = 'flag "--live" help="The deployed site at LIVE_URL instead of the local production build"'
run = "node \"{{ env.MISE_TASK_DIR }}/admin/first-admin.mjs\" {% if usage.live %}{{ env.LIVE_URL | default(value='LIVE_URL-is-not-set') }}{% else %}http://localhost:{{ env.PREVIEW_PORT | default(value='4322') }}{% endif %} \"{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}\" --show{% if usage.live %} --deployed{% endif %}"

["signin:access"]
description = "SIGN-IN, for PEOPLE on the deployed site: Cloudflare Access in front of its admin and API at LIVE_URL — a policy lets ADMIN_EMAIL in by a code sent to that address — plus a pass for machines, saved in ~/.config/emdash-run/access/. Changes nothing already there. Ends with the lines to add to astro.config.mjs and wrangler.jsonc. Needs a Cloudflare token with Access edit rights: fnox exec -- mise run signin:access"
depends = ["step:live", "step:there"]
dir = "{{config_root}}"
run = "node \"{{ env.MISE_TASK_DIR }}/admin/access.mjs\" {{ env.LIVE_URL | default(value='') }} \"{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}\""

[emdash]
description = "Anything in EmDash, through its official CLI — e.g: mise run emdash -- content list posts. The local dev site unless you say --url; for any site it adds the token and the Access pass this machine has saved for it (signin:token, signin:access)"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "node \"{{ env.MISE_TASK_DIR }}/admin/emdash.mjs\" http://localhost:{{ env.SITE_PORT | default(value='4321') }} \"{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}\""

["site:delete"]
description = "Delete this project's site folder — the opposite of site:new. Stops the site first. Everything in it goes, including its local database. Asks first — except in CI, where mise answers yes. Refuses when the site is the project itself"
confirm = "Delete the site folder and everything in it, including the local database?"
run = [{ task = "step:own-folder" }, { task = "step:there" }, { task = "site:stop" }, { task = "step:delete" }]

["step:own-folder"]
hide = true
quiet = true
description = "The site is in a plainly named folder of its own — not the project itself, not a path that leaves it. What site:new and site:delete need before they make or remove one"
dir = "{{config_root}}"
run = "{% set f = env.SITE_FOLDER | default(value='site') %}{% if f == '' or f | replace(from='.', to='') != f or f | replace(from='/', to='') != f or f | replace(from=':', to='') != f or f | replace(from=' ', to='') != f or f | replace(from='\\\\', to='') != f %}node -e \"console.error('This needs the site in a plainly named folder of its own. SITE_FOLDER is [{{ f }}]: nothing was made or deleted.'); process.exit(1)\"{% else %}node -e \"\"{% endif %}"

["step:delete"]
hide = true
description = "Remove site/ with a tool that works the same on every OS"
dir = "{{config_root}}"
run = [{ task = "step:own-folder" }, "pnpm dlx rimraf {{ env.SITE_FOLDER | default(value='site') }}"]
