# The stages of working on an EmDash site, as mise tasks.
#
# HOW TO USE THEM is docs/ (docs/getting-started.md): set-up, the one rule for this machine or the
# deployed site, the settings. WHAT EACH TASK DOES is its `description` below, and nowhere else:
# mise prints it (`mise tasks`), and docs/reference/tasks.md is written from it. So write a
# description for a developer who has read nothing else — what it does, where it acts, what it
# needs, what it stops or asks.
#
# THE TOOLS — node and pnpm — are the project's: its mise.toml has a [tools] block.
#
# HOW IT IS BUILT: this file is the front door and holds no logic. A task is its name, its
# description, its flags, and ONE line that hands it to scripts/core/cli.mjs. What a task does —
# the states it stands on, in order, and how each is reached — is the graph in scripts/core/:
#   node scripts/core/cli.mjs plan signin:token --live     prints what a task would do
# After any change here or in scripts/:  mise run dev:test --level smoke   (in the emdash-run repo).

# ═══ A SITE ON THIS MACHINE ══════════════════════════════════════════════════════════════════

["site:new"]
description = "Make a new site. Template: mise run site:new -- node:blog (default cloudflare:blog). A site that is already there is left alone"
usage = '''
arg "[template]" help="<platform>:<template>" {
  choices "cloudflare:blog" "cloudflare:starter" "cloudflare:marketing" "cloudflare:portfolio" "node:blog" "node:starter" "node:marketing" "node:portfolio"
}
'''
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:new {{ usage.template | default(value='') }}"

["site:ports"]
description = "Give this project two ports of its own (in mise.local.toml), so several projects — or several agents — can run at once"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:ports"

["site:status"]
description = "Where this site is, state by state: is there a site, are its packages in, is the dev site running, is it built from what is here now, is the built site running, is this machine signed in, does the deployed site answer — and for each that is not so, the task that gets it there. It only looks: nothing is started, built or changed"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:status"

[plan]
description = "What a task would do, in order, and do nothing: every state it stands on, then the task. mise run plan -- signin:token, mise run plan -- signin:token --live"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plan"

["site:start"]
description = "Start the dev site in the background (port 4321). EmDash signs you in by itself, and its welcome dialog is closed for you"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:start"

["site:stop"]
description = "Stop the dev site and the built site"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:stop"

["site:logs"]
description = "Follow the dev site's log"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:logs"

["site:check"]
description = "Before a commit: seed valid, types check, site builds. A site with no typescript gets typescript@6 added to its devDependencies first, and says so: without it astro check asks to install it, checks nothing and ends as a success"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:check"

["site:preview"]
description = "Build the site and serve it locally (port 4322) — behaves like a deployed site"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:preview"

["site:seed"]
description = "Apply an EmDash seed file to this machine's built site while it is running and has content in it. EmDash's own seeding does not: it applies a seed only on the first request to an empty database, and `emdash seed` writes to a SQLite file. Each thing the file names is looked for on the site, made if it is not there, left alone if it is: settings (only one the site has not set), collections and their fields (comments on or off as the file says), relations, taxonomies and terms, bylines, entries with their terms and bylines, published or draft, menus and their items, redirects, widget areas and their widgets, sections. A picture an entry names by its address ($media) is fetched and uploaded with its alt text, once: it needs the internet. Never a near copy of what is there: a menu item is the one with its label or its destination, a widget the one of its kind. One line per section, then a skip line for each thing in the file that is not applied: block types, translations, a picture inside a body, a byline's avatar, an entry with no slug, and any key that is not EmDash's seed format. EmDash's own check of the file is made first (the one emdash seed --validate makes, from the site's own EmDash), and a file it refuses is not applied. A thing the site refuses, or a picture that cannot be fetched, is in a FAIL line with what was answered, and the task fails; the rest is still applied, and the next run puts right what was left half done. mise run site:seed -- <file>; no file: the site's own (seed/seed.json). Through EmDash's HTTP API — with EmDash's own client, from the site's packages, where it has a call for the thing — and never a deployed site: it builds and starts the built site and signs this machine in if needed. Run again: nothing is made or fetched twice"
usage = '''
arg "[file]" help="A seed file in EmDash's format (https://emdashcms.com/seed.schema.json); a relative path is from the project's folder. Left out: the site's own, seed/seed.json"
'''
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:seed {{ usage.file | default(value='') }}"

["site:demo"]
description = "Put something real into every core feature of EmDash, so the admin and the site have something to show: a small site that reads like one. Most of it is a seed file in EmDash's own format, seeds/demo.json in emdash-run, applied as site:seed applies one: a title, a tagline, a social link and what robots are told (these replace the site's own); categories, one under another, and tags; two bylines, one a guest's; four published posts and two drafts, each one a visitor will see with a photograph fetched from its address; two pages; Contact in the primary menu, and a second menu; widgets in the sidebar and the footer; a section; a redirect; comments turned on for posts. Then what a seed file cannot say: a post's title and description for search engines; two more revisions of it; a day one draft is scheduled for; comments shown without approval, with a visitor's comment and an answer to it; a signed preview link to the other draft; the site's icon, made here, with a caption and a focal point; the picture a shared link is shown with; an API token that may only read (not kept, not printed); backups turned on and one taken. One line per section of the seed file and per feature: made or already there, and what shows that it works. A thing the site refuses, or a photograph that cannot be fetched, is in a FAIL line with what was answered, and the task fails. This machine's built site, never a deployed one: it builds and starts it and signs this machine in if needed. It needs the internet, for the photographs. Run again: nothing is made or fetched twice. To make a set-up of your own repeatable, copy seeds/demo.json, change it, and apply it with site:seed"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:demo"

["site:reset"]
description = "Empty the local database and start again from the seed. Asks first"
confirm = "Remove this site's local database and uploads, and start again from the seed?"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:reset"

["site:delete"]
description = "Delete the site folder. Asks first. No site is nothing to delete"
confirm = "Delete the site folder and everything in it, including the local database?"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:delete"

# ═══ THE ADMIN AND THE REPO ══════════════════════════════════════════════════════════════════

["model:sync"]
description = "Record the site's content model in the repo (.emdash/). Add -- --live for the deployed site"
usage = 'flag "--live" help="Read the model of the deployed site at LIVE_URL instead of the local one"'
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" model:sync --live={{ usage.live | default(value=false) }}"

["content:pull"]
description = "Download the deployed site's content as a package into backups/ in the site (keep that folder out of git)"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" content:pull"

# ═══ PLUGINS ═════════════════════════════════════════════════════════════════════════════════
# Two kinds. A REGISTRY plugin (plugin:search, plugin:install, plugin:favourites) is installed into
# the running site's database, as the admin's Install button does: no package, no config line, no
# rebuild (plugin:update moves one to a newer release, plugin:remove takes it out). A PACKAGE plugin (plugin:new, plugin:add) is in package.json and astro.config.mjs, and
# the task writes both. Either kind, when sandboxed, needs plugin:sandbox once — the tasks run it.
# plugin:install, plugin:favourites, plugin:update, plugin:remove and plugin:works act on this
# machine's built site, as signin:* do; with --live, on the deployed one. plugin:demo acts on this
# machine's built site and no other.

["plugin:new"]
description = "Make a plugin inside the site: scaffold, test, build, add to the site's config (its import, and its name in sandboxed: [ … ] of emdash({ … }); a config it cannot edit safely is left alone, with the lines to add). mise run plugin:new -- <name>. Run again: rebuilds it"
usage = 'arg "<name>" help="The slug of the plugin, e.g. save-log"'
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plugin:new {{ usage.name }}"

["plugin:check"]
description = "Check a plugin: manifest, types, tests, build, bundle. mise run plugin:check -- <name>"
usage = 'arg "<name>" help="The folder name of the plugin under plugins/"'
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plugin:check {{ usage.name }}"

["plugin:add"]
description = "Add a plugin from npm: the package, and for a sandboxed plugin (one built with emdash-plugin build) its two lines in the site's astro.config.mjs. A native plugin's two lines are printed for you to add, and the task stops there: which of its exports makes the plugin is for its README to say, and this does not guess. A config it cannot edit safely is left alone, with the lines to add. mise run plugin:add -- <package>. Run again: nothing changes"
usage = 'arg "<package>" help="The npm package, e.g. @emdash-cms/plugin-forms"'
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plugin:add {{ usage.package }}"

["plugin:search"]
description = "Search EmDash's plugin registry. mise run plugin:search -- forms"
usage = 'arg "<words>" help="What to look for, e.g. forms"'
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plugin:search {{ usage.words }}"

["plugin:sandbox"]
description = "Let the site run sandboxed plugins, which every registry plugin is: sandboxRunner in emdash({ … }) of the site's astro.config.mjs and, on a Cloudflare site, the Worker Loader binding in wrangler.jsonc; on a Node site its two packages, and workerd's install script allowed in pnpm-workspace.yaml, so the sandbox process stops when EmDash stops it. Stops the site when it changes packages. A file it cannot edit safely is left alone, with the lines to add by hand. Run again: nothing changes"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plugin:sandbox"

["plugin:install"]
description = "Install a plugin from EmDash's registry, no clicking: mise run plugin:install -- <publisher>/<slug>, or <publisher>/<slug>@<version> for that release and no other, newest or not. It prints everything the plugin asks for; one that can change things or reach outside the site, and any install with --live, needs --yes"
usage = '''
arg "<plugin>" help="As plugin:search prints it, e.g. @netdollar.dev/forms; with @<version> to hold it to that release" var=#true
flag "--live" help="The deployed site at LIVE_URL instead of the local production build"
flag "--yes" help="Agree to what the plugin asks for. Needed when it can change things or reach outside the site, and always with --live"
'''
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plugin:install --yes={{ usage.yes | default(value=false) }} --live={{ usage.live | default(value=false) }} {{ usage.plugin | default(value=[]) | join(sep=' ') }}"

["plugin:update"]
description = "Update an installed registry plugin to a release you name: mise run plugin:update -- <publisher>/<slug>@<version>. Before anything is sent it prints what the installed release was granted (what plugin:install recorded on this machine, in ~/.config/emdash-run/plugins/) and what each of the two releases declares in the registry, and says what the new one asks for that the installed one did not. A release that asks for more, and any update with --live, needs --yes; the site then checks the release against the plugin it is running, and that too stops without --yes. This machine's built site, starting it and signing in if needed; --live is the deployed one. An older release is refused by EmDash: remove the plugin and install that release. Run again: nothing to update"
usage = '''
arg "<plugin>" help="The plugin and the release to move it to, e.g. @meekmedia.bsky.social/bulletin@0.1.1" var=#true
flag "--live" help="The deployed site at LIVE_URL instead of the local production build"
flag "--yes" help="Agree to what the new release asks for. Needed when it asks for more than the installed one, and always with --live"
'''
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plugin:update --yes={{ usage.yes | default(value=false) }} --live={{ usage.live | default(value=false) }} {{ usage.plugin | default(value=[]) | join(sep=' ') }}"

["plugin:remove"]
description = "Remove a registry plugin from the site; what it stored is kept. mise run plugin:remove -- <publisher>/<slug>. Add --live for deployed"
usage = '''
arg "<plugin>" help="As plugin:search prints it, e.g. @netdollar.dev/forms" var=#true
flag "--live" help="The deployed site at LIVE_URL instead of the local production build"
'''
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plugin:remove --live={{ usage.live | default(value=false) }} {{ usage.plugin | default(value=[]) | join(sep=' ') }}"

["plugin:favourites"]
description = "Install the favourite registry plugins in one go, each at the release that was tried (docs/reference/favourite-plugins.md), or your own list: PLUGINS in mise.toml. It prints what each asks for and needs --yes: some can change content or reach outside the site. Add --live for deployed"
usage = '''
flag "--live" help="The deployed site at LIVE_URL instead of the local production build"
flag "--yes" help="Agree to what each plugin asks for. Needed: some of the favourites can change content or reach outside the site"
'''
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plugin:favourites --yes={{ usage.yes | default(value=false) }} --live={{ usage.live | default(value=false) }}"

["plugin:works"]
description = "Does a plugin load and answer? One line per check. This machine's built site: it builds and starts (skipped when the site is already built from the code that is here and answering; --fresh does both anyway), lists the plugin as active, its routes answer a GET (those open to visitors asked with no sign-in), its admin pages load in Chrome with the saved sign-in, the log and the sandbox show no refusal; it restarts the built site, and signs in if needed. With --live, the deployed site (or its preview, with LIVE_PREVIEW): it answers a visitor, lists the plugin as active, its routes answer, its admin pages load — and it says which checks it skipped and why: nothing is built, restarted or signed in to, and the log is not read. Sign in first: mise run signin:token -- --live. It does not try a form's submit or fire a hook. mise run plugin:works -- <name>. No name: every plugin"
usage = '''
arg "[name]" help="<publisher>/<slug> of a registry plugin, or the name of one in plugins/. None: every plugin the site has" var=#true
flag "--live" help="The deployed site at LIVE_URL instead of the local production build: only the checks that can be made from outside"
flag "--fresh" help="Check, build and restart the site first even when it is already built from this code and answering"
'''
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plugin:works --fresh={{ usage.fresh | default(value=false) }} --live={{ usage.live | default(value=false) }} {{ usage.name | default(value=[]) | join(sep=' ') }}"

["plugin:demo"]
description = "Seven plugins from EmDash's registry each do their real thing, with requests only and nobody clicking, and one line each says what was seen — and, where the site can show it, what a visitor is given. SEO Suite: the organisation and the X handle its settings name are on the home page. Link Guardian: it finds a dead link in a published post. Image Alt Text Manager: an image with no alt text is in its queue, and the alt text saved there is on the image. Contact Forms: a form named Contact, the message a visitor sends to it read back, and the form on the site's Contact page (on a Cloudflare site with EmDash 1.2.0 that one message is all Contact Forms 0.2.0 takes: a later one, from the page too, is answered Please try again later — scripts/core/plugin-demo.mjs says why). Forms: a form named Feedback, a visitor's answers read back, and the form on a page Feedback. LinguaDash: a French entry of a post, given its French words and published, at the address the English page names as its French one. Instant Indexer: the key search engines ask a site for is at its address, and it sends nothing from an address only this machine can reach: the line quotes it saying so. A form is on a page only on a site whose config has that plugin's own package for drawing it (@masonjames/emdash-contact-forms, @netdollar/emdash-forms), and a French entry is published only on a site with French among its languages (i18n in its Astro config), as this repo's site/ has both: on a site without, the line says what the site lacks, the form is put on no page and the French entry stays a draft. This machine's built site and no other: it builds, starts and signs in if needed, and installs those of the seven the site lacks, each at the release that was tried, agreeing to what it asks for as plugin:install --yes does (some can change content or reach outside the site). What it makes stays in the site: a published post plugin-demo with a photograph (plugin-demo-photo.jpg, asked for at Unsplash), an image plugin-demo.png, the form Contact with one message and the form Feedback with one, the pages contact and feedback, both in the primary menu (a page contact that is already there keeps what it says, and the form is added under it), the French entry, and a few plugin settings (a value the site already has is kept). It needs collections of posts and pages, as EmDash's templates have, and the internet: the registry, the photograph, and the dead link is really asked for. Run again: every line says already so, and nothing is made twice. A plugin that did not do its thing is a FAIL line with what the site answered, and the task fails. plugin:works is the other check: that a plugin loads and answers"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plugin:demo"

["plugin:publish"]
description = "Publish a plugin to EmDash's registry. Asks first"
confirm = "Publish this plugin to the public registry? A released version cannot be changed."
usage = 'arg "<name>" help="The folder name of the plugin under plugins/"'
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plugin:publish {{ usage.name }}"

[plugin]
description = "Anything else in EmDash's plugin CLI. mise run plugin -- info <publisher> <slug>"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" plugin"

# ═══ SIGNING IN ══════════════════════════════════════════════════════════════════════════════
# In development (site:start) EmDash signs you in by itself — open
# /_emdash/api/setup/dev-bypass?redirect=/_emdash/admin — and nothing below is needed.
#
# A production build — on this machine (site:preview) or deployed — has real sign-in. These are
# the ways, kept side by side so each can be tried. Each works on the local production build, and
# with -- --live on the deployed site at LIVE_URL.
#
#   task            who it signs in   needs Playwright?   what it is for
#   signin:token    a machine         NO                  everyday: CLI, agents, CI — one second
#   signin:access   people (+ a pass  NO                  a deployed site: Cloudflare Access in
#                   for machines)                         front of the admin, sign in by emailed code
#   signin:passkey  a machine         YES (+ Chrome/Edge) testing EmDash's own wizard and login
#   signin:open     a person          YES (+ Chrome/Edge) a signed-in window, after signin:token
#                                                         or signin:passkey
#   site:admin      a machine         YES (+ Chrome/Edge) hidden: fresh build + signin:passkey
#   (a login provider — GitHub, Google — is one more way and needs no task: two lines in the
#   site's astro.config.mjs and an OAuth app)
#
# Playwright is only scripts/signin-browser.mjs. Nothing else here uses a browser.
# signin:token and signin:passkey each want a site nobody has set up yet: they are alternatives.
# To try the other one, start from an empty database (site:reset locally).
#
# Once signed in, `mise run emdash -- <command> --url <site>` adds what this machine saved for
# that site. `whoami` behind Cloudflare Access is handled two ways (option A: the task signin:token puts the
# token and the pass into EmDash's own sign-in store, scripts/core/signin.mjs; option B: scripts/emdash.mjs).

["signin:token"]
description = "Sign a machine in with no browser — the everyday way, for the CLI, agents and CI: an admin and an API token written to the site's database. This machine's built site; add -- --live for the deployed one (Cloudflare sites only)"
usage = 'flag "--live" help="The deployed site at LIVE_URL instead of the local production build"'
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" signin:token --live={{ usage.live | default(value=false) }}"

["signin:mcp"]
description = "How an agent connects to the site's own MCP server: EmDash has one, with tools for content, schema, media, menus, taxonomies and more, and it takes the token signin:token saves. Prints the address and the settings for an agent's .mcp.json, with the token read from the environment, never printed. This machine's built site; add -- --live for the deployed one"
usage = 'flag "--live" help="The deployed site at LIVE_URL instead of the local production build"'
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" signin:mcp --live={{ usage.live | default(value=false) }}"

["signin:access"]
description = "Sign people in to the deployed site: Cloudflare Access in front of its admin, by a code emailed to ADMIN_EMAIL. Uploaded media stays public. Prints three lines for astro.config.mjs and wrangler.jsonc. Needs a Cloudflare API token with Access edit rights, in CLOUDFLARE_API_TOKEN or in fnox"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" signin:access"

["signin:passkey"]
description = "Sign a machine in through EmDash's real setup wizard, with a passkey — for testing the wizard itself. Add -- --live for the deployed site. Needs Playwright + Chrome"
usage = 'flag "--live" help="The deployed site at LIVE_URL instead of the local production build"'
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" signin:passkey --live={{ usage.live | default(value=false) }}"

["signin:open"]
description = "Open a browser window already signed in to the admin, for you to look around. Add -- --live for the deployed site. Needs Playwright + Chrome"
usage = 'flag "--live" help="The deployed site at LIVE_URL instead of the local production build"'
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" signin:open --live={{ usage.live | default(value=false) }}"

# ═══ THE DEPLOYED SITE ═══════════════════════════════════════════════════════════════════════

["live:ship"]
description = "Deploy to Cloudflare: check, deploy, wait for the new version to answer. A newly deployed site has no content: it prints how to bring this machine's content to it"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" live:ship"

["live:preview"]
description = "Deploy the site as it is in this folder as a PREVIEW: an address of its own, with a database, bucket and sessions of its own, beside the live site and without touching it (Cloudflare's Worker Previews). Named after the git branch, or: mise run live:preview -- <name>. Run again: the same preview, updated. The first time it makes the preview's database, bucket and session store and writes a previews block into wrangler.jsonc. A new preview has no content. To act on one, give its address as LIVE_URL to any task that takes --live. Remove it: mise run live:preview -- <name> --delete"
usage = '''
arg "[name]" help="The preview's name: part of its address. Left out, the git branch"
flag "--delete" help="Delete this preview instead (its database, bucket and session store are kept)"
'''
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" live:preview --delete={{ usage.delete | default(value=false) }} {{ usage.name | default(value='') }}"

["live:undo"]
description = "Roll the deployed site back to the previous version (code only)"
usage = 'arg "[version]" help="A version id; left out, the one before the current"'
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" live:undo {{ usage.version | default(value='') }}"

["live:logs"]
description = "Follow the deployed site's log"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" live:logs"

["live:backup"]
description = "Back up the deployed site: a database bookmark to restore to, and a content package in backups/. No SQL dump — Cloudflare's export refuses an EmDash database"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" live:backup"

# ═══ EMDASH ITSELF ═══════════════════════════════════════════════════════════════════════════

["emdash:update"]
description = "Update the site to the newest EmDash, then type-check and build"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" emdash:update"

[emdash]
description = "EmDash's CLI. This machine by default; add --live for the deployed site, --preview for the built site"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" emdash"

# ═══ HIDDEN, BUT RUN BY NAME ═════════════════════════════════════════════════════════════════

["live:check"]
description = "Hidden. site:check, then a dry run of the deploy"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" live:check"

["site:admin"]
description = "Hidden. Fresh built site + signin:passkey in one go. Empties the local database"
confirm = "Empty this site's local database and uploads, and set up a production build of it with a test administrator?"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:admin"

# ═══ HIDDEN STEPS — one command each, reused by the tasks above ══════════════════════════════

["site:forget"]
hide = true
description = "Internal: remove this site's local database and uploads, and the token saved for them. site:reset and site:admin do this; the test uses it alone"
run = "node \"{{ env.MISE_TASK_DIR }}/scripts/core/cli.mjs\" site:forget"
