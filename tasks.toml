# The stages of working on an EmDash site — docs/plans/2026-10-07-stages.md.
# A project gets them with one line in its mise.toml:
#   [task_config]
#   includes = ["git::https://github.com/joeblew999/emdash-run.git//tasks.toml?ref=<tag or main>"]
#
# Visible tasks are named <what>:<verb> — site:new, site:start, plugin:add — so they group by what
# you are working on. `step:*` tasks are hidden: each is ONE of EmDash's own commands,
# written once and reused. There is no script underneath — if a step needs logic, it is a gap to
# write down in the plan, not code to add here.

# ── hidden steps ─────────────────────────────────────────────────────────────────────────────

["step:install"]
hide = true
description = "The site's packages, as its lockfile pins them"
dir = "{{config_root}}/site"
tools = { node = "26.10.0", pnpm = "12.9.1" }
run = "pnpm install"

["step:seed"]
hide = true
description = "The seed is one EmDash will accept — an invalid one is skipped on first start with no error"
dir = "{{config_root}}/site"
tools = { node = "26.10.0", pnpm = "12.9.1" }
run = "pnpm exec emdash seed --validate"

["step:dev"]
hide = true
description = "EmDash's dev server, started by Astro in the background — Astro keeps its pid, log and lock"
dir = "{{config_root}}/site"
tools = { node = "26.10.0", pnpm = "12.9.1" }
run = "pnpm exec astro dev --background --host 127.0.0.1 --port {{ env.SITE_PORT | default(value='4321') }}"

["step:up"]
hide = true
description = "The site answers and the CLI can reach it — fails when it does not"
dir = "{{config_root}}/site"
tools = { node = "26.10.0", pnpm = "12.9.1" }
env = { EMDASH_URL = "http://localhost:{{ env.SITE_PORT | default(value='4321') }}" }
run = "pnpm exec emdash whoami"

# ── the stages ───────────────────────────────────────────────────────────────────────────────

["site:new"]
description = "A site, once: EmDash's scaffolder makes site/ from TEMPLATE (cloudflare:blog, node:starter, …) and installs it"
dir = "{{config_root}}"
tools = { node = "26.10.0", pnpm = "12.9.1" }
run = "pnpm dlx create-emdash@latest site --template {{ env.TEMPLATE | default(value='cloudflare:blog') }} --pm pnpm --install --yes"

["site:start"]
description = "I want to work on this site: install, check the seed, run it in the background. Then open the admin: /_emdash/api/setup/dev-bypass?redirect=/_emdash/admin"
run = [{ task = "step:install" }, { task = "step:seed" }, { task = "step:dev" }, { task = "step:up" }]

["site:stop"]
description = "Stop the site that site:start started"
dir = "{{config_root}}/site"
tools = { node = "26.10.0", pnpm = "12.9.1" }
run = "pnpm exec astro dev stop"

["site:logs"]
description = "Follow the running site's log"
dir = "{{config_root}}/site"
tools = { node = "26.10.0", pnpm = "12.9.1" }
run = "pnpm exec astro dev logs --follow"

[emdash]
description = "Anything else in EmDash, through its official CLI — e.g: mise run emdash -- content list posts"
dir = "{{config_root}}/site"
tools = { node = "26.10.0", pnpm = "12.9.1" }
env = { EMDASH_URL = "http://localhost:{{ env.SITE_PORT | default(value='4321') }}" }
run = "pnpm exec emdash"

["site:delete"]
description = "Delete this project's site/ — the opposite of site:new. Stops the site first. Everything in site/ goes, including its local database; asks before it does"
confirm = "Delete site/ and everything in it, including the local database?"
run = [{ task = "site:stop" }, { task = "step:delete" }]

["step:delete"]
hide = true
description = "Remove site/ with a tool that works the same on every OS"
dir = "{{config_root}}"
tools = { node = "26.10.0", pnpm = "12.9.1" }
run = "pnpm dlx rimraf site"
