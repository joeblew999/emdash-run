# The stages of working on an EmDash site — docs/plans/2026-10-07-stages.md.
# A project gets them with one line in its mise.toml:
#   [tools]
#   node = "26"
#   pnpm = "12"
#   [task_config]
#   includes = ["git::https://github.com/joeblew999/emdash-run.git//tasks.toml?ref=<tag or main>"]
#
# Where the site is: the folder `site` beside mise.toml, or SITE_FOLDER — "." when the site is the
# project itself, which is how EmDash lays out an existing site.
#
# The tools the tasks run — node and pnpm — are the project's: its mise.toml has a [tools] block.
# Not declared per task here: a step that forgot would silently run on whatever the machine has.
#
# Visible tasks are named <what>:<verb> — site:new, site:start, plugin:add — so they group by what
# you are working on. `step:*` tasks are hidden: each is ONE of EmDash's own commands,
# written once and reused. There is no script underneath — if a step needs logic, it is a gap to
# write down in the plan, not code to add here.

# ── hidden steps ─────────────────────────────────────────────────────────────────────────────

["step:there"]
hide = true
quiet = true
description = "There is a site here — says so plainly when there is not, instead of mise's bare 'No such file or directory'"
dir = "{{config_root}}"
run = "node -e \"if (!require('fs').existsSync('{{ env.SITE_FOLDER | default(value='site') }}/package.json')) { console.error('There is no site in [{{ env.SITE_FOLDER | default(value='site') }}]. Make one with: mise run site:new - or set SITE_FOLDER to where the site is.'); process.exit(1) }\""

["step:install"]
hide = true
description = "The site's packages, as its lockfile pins them"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm install"

["step:seed"]
hide = true
description = "The seed is one EmDash will accept — an invalid one is skipped on first start with no error. For site:check, not site:start. A site with no seed file is a valid site and this fails on one: such a project sets SITE_SEED = 'none'"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "{% if env.SITE_SEED | default(value='file') == 'none' %}node -e \"\"{% else %}pnpm exec emdash seed --validate{% endif %}"

["step:typecheck"]
hide = true
description = "Astro's type check of the site's pages and components"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec astro check"

["step:build"]
hide = true
description = "The production build — what a deploy ships"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec astro build"

["step:forget"]
hide = true
description = "Remove the local database and uploads, so the next start makes them again from the seed. Cloudflare sites keep them in .wrangler/state, Node sites in data.db and uploads/"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm dlx rimraf .wrangler/state data.db data.db-wal data.db-shm uploads"

["step:key"]
hide = true
description = "The key EmDash encrypts plugin secrets with, in the gitignored site/.env — made when there is none, left alone when there is"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec emdash secrets generate --write .env"

["step:dev"]
hide = true
description = "EmDash's dev server, started by Astro in the background — Astro keeps its pid, log and lock"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec astro dev --background --host 127.0.0.1 --port {{ env.SITE_PORT | default(value='4321') }}"

["step:up"]
hide = true
silent = "stdout"
description = "The site answers and the CLI can reach it: asks it for its collections. Fails when it does not — `emdash whoami` does not, it exits 0 with no site running"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
env = { EMDASH_URL = "http://localhost:{{ env.SITE_PORT | default(value='4321') }}" }
run = "pnpm exec emdash schema list"

["step:types"]
hide = true
description = "Record the running site's model in the repo: .emdash/schema.json and .emdash/types.ts"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
env = { EMDASH_URL = "http://localhost:{{ env.SITE_PORT | default(value='4321') }}" }
run = "pnpm exec emdash types"

["step:model-changed"]
hide = true
description = "What step:types changed, as git sees it — nothing printed means the repo already had the model"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = ["git status --short -- .emdash", "git --no-pager diff --stat -- .emdash"]

["step:live"]
hide = true
quiet = true
description = "The project says where its deployment is — LIVE_URL in mise.toml. Fails plainly when it does not"
dir = "{{config_root}}"
run = "{% if env.LIVE_URL | default(value='') == '' %}node -e \"console.error('This needs the address of the deployed site. Set LIVE_URL in the [env] block of mise.toml.'); process.exit(1)\"{% else %}node -e \"\"{% endif %}"

["step:backups"]
hide = true
quiet = true
description = "The site's backups/ folder exists — EmDash's export does not make it. Keep it out of git: a package holds drafts too"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "node -e \"require('fs').mkdirSync('backups', { recursive: true })\""

["step:package"]
hide = true
description = "The deployed site as one EmDash package — content, model and media; no users — in the site's backups/ folder"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec emdash site export --url {{ env.LIVE_URL | default(value='') }} --output backups/live-{{ now() | date(format='%Y%m%d-%H%M%S') }}.emdash"

["step:import-how"]
hide = true
quiet = true
description = "The two commands that bring a package into an empty local site — EmDash wants a person to read the plan in between"
dir = "{{config_root}}"
run = "node -e \"console.log('The package is in backups/. To load it into an EMPTY local site (mise run site:reset, then open /_emdash/api/setup/dev-bypass?content=0):'); console.log('  mise run emdash -- site import backups/FILE --analyze'); console.log('  mise run emdash -- site import backups/FILE --plan DIGEST --confirm');\""

["step:plugin-details"]
hide = true
quiet = true
description = "The project says who publishes its plugins — EmDash's plugin scaffolder refuses without all three"
dir = "{{config_root}}"
run = "{% if env.PLUGIN_PUBLISHER | default(value='') == '' or env.PLUGIN_AUTHOR | default(value='') == '' or env.PLUGIN_SECURITY_EMAIL | default(value='') == '' %}node -e \"console.error('A new plugin needs three settings in the [env] block of mise.toml: PLUGIN_PUBLISHER (your Atmosphere handle or DID - it must resolve), PLUGIN_AUTHOR (a name) and PLUGIN_SECURITY_EMAIL.'); process.exit(1)\"{% else %}node -e \"\"{% endif %}"

["step:plugin-how"]
hide = true
quiet = true
description = "The edit EmDash leaves to you after a plugin is added: two lines in astro.config.mjs, and a sandbox runner if the site has none"
dir = "{{config_root}}"
run = "node -e \"console.log('The plugin is in the site and in package.json. Now, in astro.config.mjs:'); console.log('  1. import it:              import myPlugin from PACKAGE-NAME'); console.log('  2. inside emdash({ ... }):  sandboxed: [myPlugin],'); console.log('  3. once per site, a runner: Cloudflare - sandboxRunner: sandbox() from @emdash-cms/cloudflare, and the worker_loaders line in wrangler.jsonc (Workers Paid plan to deploy).'); console.log('                              Node - sandboxRunner: @emdash-cms/sandbox-workerd/sandbox (a string), and in the site: pnpm add @emdash-cms/sandbox-workerd workerd'); console.log('The site was stopped first. Then: mise run site:start. EmDash docs: deployment/plugin-sandbox.');\""

["step:rehearse"]
hide = true
description = "Everything a Cloudflare deploy does short of shipping: wrangler bundles the build and resolves the bindings, and uploads nothing. Needs no account"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec wrangler deploy --dry-run"

["step:newer"]
hide = true
description = "EmDash's documented update: the newest emdash and, where the site has it, its Cloudflare package — written to package.json and the lockfile"
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm up --latest emdash @emdash-cms/cloudflare"

["step:update-how"]
hide = true
quiet = true
description = "What an update does not do, and what comes next"
dir = "{{config_root}}"
run = "node -e \"console.log('EmDash is updated in package.json and the lockfile, and the site type-checks and builds on it.'); console.log('  Read what changed:  https://github.com/emdash-cms/emdash/releases'); console.log('  Not updated: the files your site got from its template, and the agent skills the scaffolder wrote.'); console.log('  Next: mise run site:stop, mise run site:start - database migrations run on the first request. Then commit.');\""

# ── the stages ───────────────────────────────────────────────────────────────────────────────

["site:new"]
description = "A site, once: EmDash's scaffolder makes the site folder and installs it. Say which — mise run site:new -- node:blog — or leave it out for TEMPLATE in mise.toml, else cloudflare:blog"
dir = "{{config_root}}"
usage = '''
arg "[template]" help="<platform>:<template>" {
  choices "cloudflare:blog" "cloudflare:starter" "cloudflare:marketing" "cloudflare:portfolio" "node:blog" "node:starter" "node:marketing" "node:portfolio"
}
'''
run = [{ task = "step:own-folder" }, "pnpm dlx create-emdash@latest {{ env.SITE_FOLDER | default(value='site') }} --template {% if usage.template %}{{ usage.template }}{% else %}{{ env.TEMPLATE | default(value='cloudflare:blog') }}{% endif %} --pm pnpm --install --yes"]

["site:start"]
description = "I want to work on this site: install, make its key if it has none, run it in the background. Then open the admin: /_emdash/api/setup/dev-bypass?redirect=/_emdash/admin"
run = [{ task = "step:there" }, { task = "step:install" }, { task = "step:key" }, { task = "step:dev" }, { task = "step:up" }]

["site:stop"]
description = "Stop the site that site:start started"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec astro dev stop"

["site:logs"]
description = "Follow the running site's log"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm exec astro dev logs --follow"

["site:check"]
description = "Is my work sound, before a commit or a deploy: the seed is valid, the types check, the production build passes. Safe beside a running site"
run = [{ task = "step:there" }, { task = "step:install" }, { task = "step:seed" }, { task = "step:typecheck" }, { task = "step:build" }]

["site:reset"]
description = "The local site back to its seed: stops it, removes the local database and uploads, starts it again. Local only — nothing deployed is touched. Asks first — except in CI, where mise answers yes"
confirm = "Remove this site's local database and uploads, and start again from the seed?"
run = [{ task = "step:there" }, { task = "site:stop" }, { task = "step:forget" }, { task = "site:start" }]

["model:sync"]
description = "The admin and the repo must agree: after anyone changes the model — in the admin or with emdash schema — this records it in .emdash/ and shows what changed. Commit that with the code that uses it. Needs the site running"
run = [{ task = "step:there" }, { task = "step:up" }, { task = "step:types" }, { task = "step:model-changed" }]

["content:pull"]
description = "The deployed site's content, on this machine: downloads it as an EmDash package into backups/ and prints how to load it into an empty local site. Needs LIVE_URL, and once: mise run emdash -- login --url <LIVE_URL>"
run = [{ task = "step:live" }, { task = "step:there" }, { task = "step:backups" }, { task = "step:package" }, { task = "step:import-how" }]

["plugin:new"]
description = "I need a plugin of my own: stops the site, then EmDash's plugin scaffolder makes plugins/<name> inside it, and the plugin is installed, tested, built and added to the site. Ends with the two lines to add to astro.config.mjs. Needs PLUGIN_PUBLISHER, PLUGIN_AUTHOR and PLUGIN_SECURITY_EMAIL"
depends = ["step:there", "step:plugin-details"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
usage = 'arg "<name>" help="The slug of the plugin, e.g. save-log"'
run = [
  { task = "site:stop" },
  "pnpm dlx @emdash-cms/plugin-cli@latest init {{ usage.name }} --dir plugins/{{ usage.name }} --yes --publisher {{ env.PLUGIN_PUBLISHER | default(value='') }} --author-name \"{{ env.PLUGIN_AUTHOR | default(value='') }}\" --security-email {{ env.PLUGIN_SECURITY_EMAIL | default(value='') }} --package-manager pnpm",
  "pnpm --dir plugins/{{ usage.name }} install",
  "pnpm --dir plugins/{{ usage.name }} run test",
  "pnpm --dir plugins/{{ usage.name }} run build",
  "pnpm add file:./plugins/{{ usage.name }}",
  { task = "step:plugin-how" },
]

["plugin:check"]
description = "Is this plugin sound: its manifest is valid, its types check, its tests pass, it builds, and the bundle the registry would get is valid"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
usage = 'arg "<name>" help="The folder name of the plugin under plugins/"'
run = [
  "pnpm --dir plugins/{{ usage.name }} install",
  "pnpm --dir plugins/{{ usage.name }} run validate",
  "pnpm --dir plugins/{{ usage.name }} run typecheck",
  "pnpm --dir plugins/{{ usage.name }} run test",
  "pnpm --dir plugins/{{ usage.name }} run build",
  "pnpm --dir plugins/{{ usage.name }} exec emdash-plugin bundle --validate-only",
]

["plugin:add"]
description = "I need someone else's plugin, from npm: stops the site and adds the package to it, so the repo declares it and a fresh clone has it. Ends with the two lines to add to astro.config.mjs. (A registry plugin is installed in the admin instead — EmDash has no command for it)"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
usage = 'arg "<package>" help="The npm package, e.g. @emdash-cms/plugin-forms"'
run = [{ task = "site:stop" }, "pnpm add {{ usage.package }}", { task = "step:plugin-how" }]

["plugin:publish"]
description = "Release this plugin to EmDash's registry, under the account you are logged in to: mise run plugin -- login <handle>. Checks it first. Asks first — except in CI, where mise answers yes"
confirm = "Publish this plugin to the public registry? A released version cannot be changed."
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
usage = 'arg "<name>" help="The folder name of the plugin under plugins/"'
run = [
  "pnpm --dir plugins/{{ usage.name }} run validate",
  "pnpm --dir plugins/{{ usage.name }} run test",
  "pnpm --dir plugins/{{ usage.name }} exec emdash-plugin bundle --validate-only",
  "pnpm --dir plugins/{{ usage.name }} exec emdash-plugin publish",
]

[plugin]
description = "Anything else in EmDash's plugin CLI — e.g: mise run plugin -- search forms"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
run = "pnpm dlx @emdash-cms/plugin-cli@latest"

["live:check"]
description = "Would this deploy: site:check, then wrangler's dry run of the deploy — nothing is uploaded and no account is needed. For a site on Cloudflare"
run = [{ task = "site:check" }, { task = "step:rehearse" }]

["emdash:update"]
description = "A newer EmDash: updates the site to the latest release, then type-checks and builds it. The local database migrates on the next start. A deployed site: take a backup first, deploy after"
run = [{ task = "step:there" }, { task = "step:newer" }, { task = "step:typecheck" }, { task = "step:build" }, { task = "step:update-how" }]

[emdash]
description = "Anything else in EmDash, through its official CLI — e.g: mise run emdash -- content list posts"
depends = ["step:there"]
dir = "{{config_root}}/{{ env.SITE_FOLDER | default(value='site') }}"
env = { EMDASH_URL = "http://localhost:{{ env.SITE_PORT | default(value='4321') }}" }
run = "pnpm exec emdash"

["site:delete"]
description = "Delete this project's site folder — the opposite of site:new. Stops the site first. Everything in it goes, including its local database. Asks first — except in CI, where mise answers yes. Refuses when the site is the project itself"
confirm = "Delete the site folder and everything in it, including the local database?"
run = [{ task = "step:own-folder" }, { task = "step:there" }, { task = "site:stop" }, { task = "step:delete" }]

["step:own-folder"]
hide = true
quiet = true
description = "The site is in a plainly named folder of its own — not the project itself, not a path that leaves it. What site:new and site:delete need before they make or remove one"
dir = "{{config_root}}"
run = "{% set f = env.SITE_FOLDER | default(value='site') %}{% if f == '' or f | replace(from='.', to='') != f or f | replace(from='/', to='') != f or f | replace(from=':', to='') != f or f | replace(from=' ', to='') != f or f | replace(from='\\\\', to='') != f %}node -e \"console.error('This needs the site in a plainly named folder of its own. SITE_FOLDER is [{{ f }}]: nothing was made or deleted.'); process.exit(1)\"{% else %}node -e \"\"{% endif %}"

["step:delete"]
hide = true
description = "Remove site/ with a tool that works the same on every OS"
dir = "{{config_root}}"
run = [{ task = "step:own-folder" }, "pnpm dlx rimraf {{ env.SITE_FOLDER | default(value='site') }}"]
